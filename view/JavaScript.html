<script>
/* ============================================================= *
 *  DataGrid client — table, pagination, search, sort,
 *  draggable/resizable columns, inline editing, modals, export.
 * ============================================================= */
(function () {
'use strict';

/* ---------- element refs ---------- */
var $ = function (id) { return document.getElementById(id); };
var app=$('app'), loader=$('loader'),
    loginScreen=$('loginScreen'), loginBody=$('loginBody'),
    searchInput=$('searchInput'), searchClear=$('searchClear'),
    btnAddRow=$('btnAddRow'), btnAddColumn=$('btnAddColumn'), btnImport=$('btnImport'), btnExport=$('btnExport'), btnTotal=$('btnTotal'), btnSettings=$('btnSettings'),
    btnFilter=$('btnFilter'), filterBadge=$('filterBadge'),
    btnColorRules=$('btnColorRules'), colorBadge=$('colorBadge'),
    btnTrash=$('btnTrash'), trashBadge=$('trashBadge'),
    btnAccess=$('btnAccess'), btnActivity=$('btnActivity'), whoami=$('whoami'), readOnlyBadge=$('readOnlyBadge'),
    pageSize=$('pageSize'), pageFirst=$('pageFirst'), pagePrev=$('pagePrev'),
    pageNext=$('pageNext'), pageLast=$('pageLast'),
    pager=$('pager'), pagerRange=$('pagerRange'), pageInfo=$('pageInfo'),
    thead=$('thead'), tbody=$('tbody'), colgroup=$('colgroup'),
    tableScroll=$('tableScroll'), bulkBar=$('bulkBar'),
    viewBar=$('viewBar'), kanbanEl=$('kanban'), dashboardEl=$('dashboard'), calendarEl=$('calendar'), galleryEl=$('gallery'), scheduleEl=$('schedule'),
    emptyNoColumns=$('emptyNoColumns'), rowCount=$('rowCount'), sheetLink=$('sheetLink'),
    modalOverlay=$('modalOverlay'), modal=$('modal'), modalTitle=$('modalTitle'),
    modalBody=$('modalBody'), modalFoot=$('modalFoot'), modalClose=$('modalClose'),
    panelOverlay=$('panelOverlay'), recordPanel=$('recordPanel'), panelTitle=$('panelTitle'),
    panelSub=$('panelSub'), panelBody=$('panelBody'), panelFoot=$('panelFoot'),
    panelClose=$('panelClose'), panelPrev=$('panelPrev'), panelNext=$('panelNext'),
    toasts=$('toasts');

var toolbarEl=document.querySelector('.toolbar');

var ICON = {
  edit:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  expand:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>'
};

/* ---------- state ---------- */
var State = {
  columns:[], rows:[], search:'', filters:[], sort:{colId:null, dir:1},
  page:1, pageSize:10, sheetUrl:'', _drag:null, currency:'₱', allowEmailFallback:false, trashCount:0,
  tableId:'', tables:[],          /* multiple tables: active id + [{id,name,order,accessMode}] for the switcher */
  accessMode:'perUser',           /* active table's access mode: 'perUser' (default) or 'adminManaged' (everyone views, admins edit) */
  me:{email:'', role:'member', isAdmin:false, owner:''},
  selected:{}, _pageIds:[],   /* multi-select for bulk actions: set of row ids + current page's ids */
  _view:null, _viewSig:null,      /* memoised filter+sort result (see currentView) */
  viewType:'grid', groupColId:'',  /* layout: 'grid' | 'kanban' | 'dashboard' | 'calendar' | 'gallery', and the Kanban group-by column id */
  gridGroupColId:'', _collapsedGroups:{},  /* Grid grouping: the column rows are grouped by (distinct from Kanban's groupColId), + which group keys are collapsed (ephemeral) */
  calendarColId:'', calMonth:'',    /* Calendar view: date/datetime column to plot by + the month on screen ('YYYY-MM'; ephemeral, not persisted) */
  galleryColId:'',                  /* Gallery view: the Attachment column whose first image is each card's hero (blank = no image, cards show a placeholder) */
  dashCharts:[],                    /* dashboard chart specs: up to 3 × {colId, chartType:'bar'|'pie'|'line'|'donut'} */
  views:[], activeViewId:'',      /* saved views for this table + the one currently applied */
  _linkCache:{}, _kdrag:null,      /* link label cache (key = tableId|displayColId) + active Kanban drag row id */
  colorRules:[],                   /* conditional-formatting rules (view-scoped): [{colId,op,value,value2,style}] */
  scheduleView:false, dateNotes:{}, schedMonth:'',  /* Shift Schedule roster: on for the built-in table + its per-day notes map + month on screen ('YYYY-MM'; ephemeral) */
  _panelRowId:''                   /* record side-panel: id of the row currently open in the slide-over ('' = closed) */
};

/* ---------- lightweight client persistence (GAS IFRAME sandbox allows localStorage) ----------
   Only remembers that the greeting screen has been shown once, so a refresh skips
   straight into the app. It never carries identity — the server's getIdentity /
   getInitialData still decide who you are and what you can see. All access is guarded
   so the app degrades to its previous behaviour if storage is unavailable. */
var SIGNED_IN_KEY='datagrid_signed_in';
var THEME_KEY='datagrid_theme';        /* 'light' | 'dark' */
var DENSITY_KEY='datagrid_density';    /* 'comfortable' | 'compact' */
function lsGet(k){ try{ return window.localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ window.localStorage.setItem(k,v); }catch(e){} }
function markSignedIn(){ lsSet(SIGNED_IN_KEY,'1'); }
function hasSignedIn(){ return lsGet(SIGNED_IN_KEY)==='1'; }

/* ---------- Appearance: theme + density (per-user, remembered on this device) ----------
   Both are applied by setting data-* attributes on <html>; the stylesheet does the
   rest. Applied at init() before the login screen so even the sign-in card is themed.
   Defaults: light + comfortable, unless the OS prefers dark on first visit. */
function getTheme(){
  var t=lsGet(THEME_KEY);
  if(t==='light'||t==='dark') return t;
  try{ if(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark'; }catch(e){}
  return 'light';
}
function getDensity(){ var d=lsGet(DENSITY_KEY); return d==='compact'?'compact':'comfortable'; }
function applyTheme(t){
  var root=document.documentElement;
  if(t==='dark') root.setAttribute('data-theme','dark'); else root.removeAttribute('data-theme');
}
function applyDensity(d){
  var root=document.documentElement;
  if(d==='compact') root.setAttribute('data-density','compact'); else root.removeAttribute('data-density');
}
function setTheme(t){ t=(t==='dark')?'dark':'light'; lsSet(THEME_KEY,t); applyTheme(t); }
function setDensity(d){ d=(d==='compact')?'compact':'comfortable'; lsSet(DENSITY_KEY,d); applyDensity(d); }
function applyAppearance(){ applyTheme(getTheme()); applyDensity(getDensity()); }

/* Debounce: coalesce a burst of calls into one trailing call after `wait` ms of
   quiet. Used to keep search typing snappy — we re-render once the user pauses
   instead of rebuilding the whole grid on every keystroke. */
function debounce(fn,wait){
  var t=null;
  return function(){
    var ctx=this, args=arguments;
    if(t) clearTimeout(t);
    t=setTimeout(function(){ t=null; fn.apply(ctx,args); },wait);
  };
}

/* ---------- live refresh (GAS has no server push, so we poll) ---------- */
var POLL_MS=10000;          /* how often to check the server for changes */
var pollTimer=null;         /* active interval id, so we never stack pollers */
var lastDataSig=null;       /* signature of the last rendered rows+columns */
var lastTablesSig=null;     /* signature of the last rendered table list (see tablesSignature) */

/* ============================================================= *
 *  Pure helpers (no DOM) — also unit-tested outside the app
 * ============================================================= */
function displayColumns(columns){
  return columns.map(function(c,i){return {c:c,i:i};})
    .sort(function(a,b){
      var oa=(typeof a.c.order==='number')?a.c.order:a.i;
      var ob=(typeof b.c.order==='number')?b.c.order:b.i;
      if(oa!==ob) return oa-ob;
      return a.i-b.i;
    }).map(function(x){return x.c;});
}
function isBlank(v){ return v===''||v===null||v===undefined; }
/* A time cell is stored canonically as zero-padded 24-hour 'HH:mm' (so it sorts
   chronologically and Sheets can't reinterpret it). We DISPLAY it 12-hour with
   am/pm. Anything that isn't recognisably HH:mm is shown verbatim. Pure. */
function formatTime12(v){
  var s=String(v==null?'':v).trim();
  var m=s.match(/^(\d{1,2}):(\d{2})/);
  if(!m) return s;
  var h=parseInt(m[1],10), mi=parseInt(m[2],10);
  if(isNaN(h)||isNaN(mi)||h>23||mi>59) return s;
  var ap=h<12?'AM':'PM';
  var h12=h%12; if(h12===0) h12=12;
  return h12+':'+(mi<10?'0'+mi:mi)+' '+ap;
}
/* A compact 12-hour time for the dense roster view: drops ":00" on the hour and the
   space before am/pm, so "08:00"→"8AM" and "15:30"→"3:30PM". Blank stays blank;
   anything formatTime12 can't parse is returned as-is (uppercased am/pm). Pure. */
function formatTimeShort(v){
  var s=formatTime12(v);
  if(!s) return '';
  return s.replace(':00','').replace(/\s+(AM|PM)$/i,function(_,ap){ return ap.toUpperCase(); });
}
function formatCellValue(v,type){
  if(isBlank(v)) return '';
  if(type==='number'){ var n=(typeof v==='number')?v:parseFloat(v); return isNaN(n)?String(v):String(n); }
  if(type==='price'){
    var p=(typeof v==='number')?v:parseFloat(v);
    if(isNaN(p)) return String(v);
    var sym=(State && State.currency) ? State.currency : '₱';
    /* Price displays with no decimals (whole units, rounded) — the raw value is
       kept in row.values for sort/filter/totals, so precision isn't lost. */
    return (p<0?'-':'')+sym+Math.abs(p).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
  }
  /* datetime cells store a full 'yyyy-MM-dd HH:mm:ss' stamp but display date-only
     (the raw value is kept for sort/filter — those read row.values directly). */
  if(type==='datetime'){ var s=String(v); var m=s.match(/^\d{4}-\d{2}-\d{2}/); return m?m[0]:s; }
  /* time cells store canonical 24-hour 'HH:mm' but display 12-hour with am/pm. */
  if(type==='time'){ return formatTime12(v); }
  /* file cells hold a JSON array of {id,name,url,...}; for search/CSV/kanban meta
     we surface the file names joined. */
  if(type==='file'){ return parseFiles(v).map(function(f){return f.name;}).join(', '); }
  return String(v);
}
function rowMatches(row,cols,term){
  for(var i=0;i<cols.length;i++){
    if(formatCellValue(row.values[cols[i].id],cols[i].type).toLowerCase().indexOf(term)>=0) return true;
  }
  return false;
}
function filterRows(rows,cols,search){
  var term=(search||'').trim().toLowerCase();
  if(!term) return rows.slice();
  return rows.filter(function(r){return rowMatches(r,cols,term);});
}
function cmp(a,b,type){
  if(type==='number'||type==='price'){
    var x=parseFloat(a), y=parseFloat(b);
    if(isNaN(x))x=0; if(isNaN(y))y=0;
    return x<y?-1:(x>y?1:0);
  }
  return String(a).localeCompare(String(b), undefined, {numeric:true, sensitivity:'base'});
}
function sortRows(rows,cols,sort){
  if(!sort||!sort.colId) return rows.slice();
  var col=null; for(var i=0;i<cols.length;i++){ if(cols[i].id===sort.colId){col=cols[i];break;} }
  if(!col) return rows.slice();
  var dir=sort.dir===-1?-1:1;
  var arr=rows.map(function(r,i){return {r:r,i:i};});
  arr.sort(function(x,y){
    var av=x.r.values[col.id], bv=y.r.values[col.id];
    var ae=isBlank(av), be=isBlank(bv);
    if(ae&&be) return x.i-y.i;
    if(ae) return 1;      /* blanks always last */
    if(be) return -1;
    var base=cmp(av,bv,col.type);
    return base!==0 ? base*dir : x.i-y.i;   /* stable */
  });
  return arr.map(function(x){return x.r;});
}
function paginate(rows,page,size){
  size=size||10;
  var total=rows.length;
  var totalPages=Math.max(1,Math.ceil(total/size));
  page=Math.min(Math.max(1,page||1),totalPages);
  var start=(page-1)*size, end=start+size;
  return {pageRows:rows.slice(start,end), page:page, totalPages:totalPages, total:total, start:start, end:end};
}
/* Partition rows into groups by a column's value, for the grid's grouping mode.
   Returns [{key, label, rows}] in first-appearance order — so if the caller has
   already sorted by the group column the groups come out in sorted order, and if
   not they appear in the order their first row does. Blank values collapse into a
   single trailing-or-inline "(Empty)" group (keyed by a sentinel that no real
   value can produce). Pure — exported for tests. */
function groupRowsBy(rows, col){
  rows = rows || [];
  if(!col) return [{key:'', label:'', rows:rows.slice()}];
  var order=[], byKey=Object.create(null);
  rows.forEach(function(r){
    var raw=r.values[col.id];
    var blank=isBlank(raw);
    var key=blank ? '\uFFFFempty' : String(raw);
    if(!byKey[key]){
      var lab;
      if(blank){ lab='(Empty)'; }
      else { lab=formatCellValue(raw, col.type); if(lab==='') lab=String(raw); }
      byKey[key]={key:key, label:lab, rows:[]};
      order.push(key);
    }
    byKey[key].rows.push(r);
  });
  return order.map(function(k){ return byKey[k]; });
}
function inDateRange(v,from,to){
  if(!from && !to) return true;
  if(isBlank(v)) return false;
  var s=String(v).slice(0,10);   /* compare on the calendar date — works for date and datetime (yyyy-MM-dd…) */
  if(from && s<from) return false;
  if(to && s>to) return false;
  return true;
}
function filterByDateRange(rows,colId,from,to){
  if(!colId || (!from && !to)) return rows.slice();
  return rows.filter(function(r){ return inDateRange(r.values[colId], from, to); });
}
/* Sum a column's numeric values (used for price totals); blank / non-numeric cells are skipped. */
function sumColumn(rows,colId){
  var t=0;
  for(var i=0;i<rows.length;i++){ var n=parseFloat(rows[i].values[colId]); if(!isNaN(n)) t+=n; }
  return t;
}
function csvEscape(s){
  s=(s==null)?'':String(s);
  if(/[",\r\n]/.test(s) || /^\s|\s$/.test(s)) return '"'+s.replace(/"/g,'""')+'"';
  return s;
}
/* Parse CSV text into an array of string arrays (one per row). Handles quoted
   fields, escaped quotes (""), and commas / newlines inside quotes. Accepts CRLF
   or LF line endings and strips a leading UTF-8 BOM. A trailing newline doesn't
   produce a spurious empty row. This is the inverse of buildCsv, and is unit-tested. */
function parseCsv(text){
  text=String(text==null?'':text);
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);   // strip BOM
  var rows=[], field='', row=[], i=0, n=text.length, inQuotes=false;
  function endField(){ row.push(field); field=''; }
  function endRow(){ endField(); rows.push(row); row=[]; }
  while(i<n){
    var ch=text[i];
    if(inQuotes){
      if(ch==='"'){
        if(text[i+1]==='"'){ field+='"'; i+=2; continue; }   // escaped quote
        inQuotes=false; i++; continue;
      }
      field+=ch; i++; continue;
    }
    if(ch==='"'){ inQuotes=true; i++; continue; }
    if(ch===','){ endField(); i++; continue; }
    if(ch==='\r'){ if(text[i+1]==='\n') i++; endRow(); i++; continue; }
    if(ch==='\n'){ endRow(); i++; continue; }
    field+=ch; i++;
  }
  // flush the final field/row unless the text ended exactly on a row break
  if(field!=='' || row.length>0) endRow();
  // drop a single trailing empty row (from a file-ending newline)
  if(rows.length && rows[rows.length-1].length===1 && rows[rows.length-1][0]==='') rows.pop();
  return rows;
}
function buildCsv(cols,rows){
  var head=cols.map(function(c){return csvEscape(c.name);}).join(',');
  var lines=rows.map(function(r){
    return cols.map(function(c){ return csvEscape(formatCellValue(r.values[c.id],c.type)); }).join(',');
  });
  return [head].concat(lines).join('\r\n');
}
function coerceClient(val,type){
  if(type==='number'||type==='price'){ if(val==='') return ''; var n=parseFloat(val); return isNaN(n)?'':n; }
  return String(val==null?'':val);
}
function isValidEmail(v){
  var s=String(v==null?'':v).trim();
  if(!s) return true;
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
}
function isValidPhone(v){
  var s=String(v==null?'':v).trim();
  if(!s) return true;
  if(!/^[+()\d\s.\-]+$/.test(s)) return false;   // digits + common phone punctuation only
  var digits=s.replace(/\D/g,'');
  return digits.length>=3 && digits.length<=20;   // leading zeros are kept — value is text
}
/* "Not applicable" sentinel accepted in an email/phone COLUMN in place of a real
   value: N/A, n/a, NA, na (case-insensitive, slash optional). Deliberately kept
   out of isValidEmail/isValidPhone so the login email box still demands a real
   address — only the column-value paths consult isNA(). */
function isNA(v){
  return /^n\/?a$/i.test(String(v==null?'':v).trim());
}
/* Pure access-mode gate (mirrors the server's requireTableWrite_): admins can
   always edit a table's data; non-admins can edit only when the table is NOT
   admin-managed. Kept pure + exported so the rule is unit-tested in one place. */
function canEditMode(isAdmin, accessMode){
  return !!isAdmin || accessMode!=='adminManaged';
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}

/* ---------- linked records (pure) ----------
   A link cell stores a comma-separated list of target row ids. Order is preserved;
   blanks and duplicates are dropped. These mirror the server's cleanLinkIds_ so the
   client and server agree on what a link cell contains. */
function parseLinkIds(v){
  var arr = Array.isArray(v) ? v : String(v==null?'':v).split(',');
  var seen={}, out=[];
  for(var i=0;i<arr.length;i++){ var s=String(arr[i]==null?'':arr[i]).trim(); if(s && !seen[s]){ seen[s]=1; out.push(s); } }
  return out;
}
function formatLinkIds(ids){ return parseLinkIds(ids).join(','); }

/* ---- attachments (file column type) ----
   A file cell holds a JSON array of descriptors {id,name,url,mime,size}. These
   mirror the server's cleanFiles_ so the client and server agree on the shape.
   parseFiles accepts either an already-parsed array or the stored JSON string and
   returns a clean array of descriptors (bad / non-object entries dropped, fields
   coerced to strings/number, id+name+url required). formatFiles is the inverse,
   producing the canonical JSON string that gets sent back to the server. */
function parseFiles(v){
  if(isBlank(v)) return [];
  var arr;
  if(Array.isArray(v)){ arr=v; }
  else { try{ arr=JSON.parse(String(v)); }catch(e){ return []; } }
  if(!Array.isArray(arr)) return [];
  var out=[];
  for(var i=0;i<arr.length;i++){
    var f=arr[i];
    if(!f || typeof f!=='object') continue;
    var id=String(f.id==null?'':f.id).trim();
    var name=String(f.name==null?'':f.name).trim();
    var url=String(f.url==null?'':f.url).trim();
    if(!id || !name || !url) continue;
    var size=parseInt(f.size,10); if(isNaN(size)||size<0) size=0;
    out.push({ id:id, name:name, url:url, mime:String(f.mime==null?'':f.mime).trim(), size:size });
  }
  return out;
}
function formatFiles(files){ return JSON.stringify(parseFiles(files)); }

/* ============================================================= *
 *  Advanced filters (pure; unit-tested)
 *  A filter is { colId, op, value, value2 }. Filters are AND-combined and
 *  applied client-side over the loaded rows (before the search box narrows
 *  them further). Operators are grouped into four "families" by column type.
 *  An incomplete condition (a value input still blank) is treated as inactive
 *  and skipped, so a half-built filter never blanks out the whole table.
 * ============================================================= */
function filterFamily(type){
  if(type==='number'||type==='price') return 'number';
  if(type==='date'||type==='datetime') return 'date';
  if(type==='dropdown') return 'dropdown';
  return 'text';                       /* text, email, phone, and anything unknown */
}
/* [op-id, label, arity] — arity = number of value inputs the operator needs. */
var FILTER_OPS = {
  text:[['contains','contains',1],['ncontains','does not contain',1],['eq','is',1],['neq','is not',1],['starts','starts with',1],['ends','ends with',1],['empty','is empty',0],['nempty','is not empty',0]],
  dropdown:[['eq','is',1],['neq','is not',1],['empty','is empty',0],['nempty','is not empty',0]],
  number:[['eq','=',1],['neq','≠',1],['gt','>',1],['gte','≥',1],['lt','<',1],['lte','≤',1],['between','between',2],['empty','is empty',0],['nempty','is not empty',0]],
  date:[['on','on',1],['before','before',1],['after','after',1],['between','between',2],['empty','is empty',0],['nempty','is not empty',0]]
};
function opsForType(type){ return FILTER_OPS[filterFamily(type)]; }
function opArity(type,op){
  var a=opsForType(type);
  for(var i=0;i<a.length;i++) if(a[i][0]===op) return a[i][2];
  return 1;
}
/* Does one row's cell (raw) satisfy the operator? blank/non-numeric cells never
   match a value comparison in the number/date families — blanks surface only via
   "is empty". Text + dropdown compare case-insensitively. */
function matchFilter(raw,type,op,v1,v2){
  if(op==='empty')  return isBlank(raw);
  if(op==='nempty') return !isBlank(raw);
  var fam=filterFamily(type);
  if(fam==='number'){
    if(isBlank(raw)) return false;
    var x=parseFloat(raw); if(isNaN(x)) return false;
    if(op==='between'){
      var a=parseFloat(v1), b=parseFloat(v2);
      if(isNaN(a)||isNaN(b)) return true;              /* incomplete → inactive upstream */
      return x>=Math.min(a,b) && x<=Math.max(a,b);
    }
    var t=parseFloat(v1); if(isNaN(t)) return true;
    if(op==='eq')  return x===t;
    if(op==='neq') return x!==t;
    if(op==='gt')  return x>t;
    if(op==='gte') return x>=t;
    if(op==='lt')  return x<t;
    if(op==='lte') return x<=t;
    return true;
  }
  if(fam==='date'){
    if(isBlank(raw)) return false;
    var s=String(raw).slice(0,10);                     /* calendar date; works for datetime */
    var d1=String(v1==null?'':v1).slice(0,10);
    if(op==='between'){
      var d2=String(v2==null?'':v2).slice(0,10);
      if(!d1||!d2) return true;
      var lo=d1<d2?d1:d2, hi=d1<d2?d2:d1;
      return s>=lo && s<=hi;
    }
    if(!d1) return true;
    if(op==='on')     return s===d1;
    if(op==='before') return s<d1;
    if(op==='after')  return s>d1;
    return true;
  }
  /* text + dropdown */
  var hs=String(isBlank(raw)?'':raw).toLowerCase();
  var needle=String(v1==null?'':v1).toLowerCase();
  if(op==='eq')        return hs===needle;

  if(op==='contains')  return hs.indexOf(needle)>=0;

   arity (0 = always active, 1 = needs value, 2 = needs both). Skips filters

function isFilterActive(f,col){

/* AND-combine every active filter over rows. cols supplies the type + resolves

function applyFilters(rows,cols,filters){
  if(!filters || !filters.length) return rows.slice();
  var byId={}; cols.forEach(function(c){ byId[c.id]=c; });
  var active=[];
  for(var i=0;i<filters.length;i++){
    var col=byId[filters[i].colId];
    if(isFilterActive(filters[i],col)) active.push({f:filters[i],col:col});
  }
  if(!active.length) return rows.slice();
  return rows.filter(function(r){
    for(var j=0;j<active.length;j++){
      var a=active[j];
      if(!matchFilter(r.values[a.col.id], a.col.type, a.f.op, a.f.value, a.f.value2)) return false;
    }

  });
}

/* ============================================================= *
 *  Conditional formatting — color rules (pure; unit-tested)
 *  A rule is { colId, op, value, value2, style } and reuses the exact operator
 *  engine above (matchFilter / isFilterActive / opsForType). Rules are evaluated
 *  top-to-bottom and the FIRST active, matching rule paints the row — so order is
 *  priority. `style` is one of CF_STYLES, a small palette backed by theme tokens
 *  (so colors adapt to light/dark); an unknown style falls back to the first.

var CF_STYLES=['red','amber','green','teal','blue','violet','gray'];

    var colId=String(r.colId==null?'':r.colId); if(!colId) continue;
    var style=String(r.style==null?'':r.style); if(!isColorStyle(style)) style=CF_STYLES[0];
    out.push({ colId:colId, op:String(r.op==null?'':r.op), value:String(r.value==null?'':r.value), value2:String(r.value2==null?'':r.value2), style:style });
  }

}
/* Style id of the first rule that applies to a row, or '' when none do. A rule is
   skipped when its column was removed, its operator isn't valid for that column's
   type, or its value inputs aren't filled for the operator's arity — so a stale or
   half-built rule never colors anything. Mirrors applyFilters' treatment. */
function rowColorStyle(row,cols,rules,byIdOpt){
  if(!rules || !rules.length) return '';
  var byId=byIdOpt; if(!byId){ byId={}; cols.forEach(function(c){ byId[c.id]=c; }); }
  for(var i=0;i<rules.length;i++){
    var r=rules[i], col=byId[r.colId];
    if(!col) continue;
    var ops=opsForType(col.type), ok=false;
    for(var k=0;k<ops.length;k++){ if(ops[k][0]===r.op){ ok=true; break; } }
    if(!ok) continue;
    if(!isFilterActive(r,col)) continue;
    if(matchFilter(row.values[col.id], col.type, r.op, r.value, r.value2)) return r.style;
  }

}
/* Build the column-id → column map that rowColorStyle needs, ONCE per render, so a
   1000-row table doesn't rebuild it 1000 times. Returns null when there are no
   color rules — rowColorStyle early-returns in that case and never reads the map. */
function colorRuleColMap(cols){
  if(!State.colorRules || !State.colorRules.length) return null;
  var byId={}; cols.forEach(function(c){ byId[c.id]=c; });
  return byId;
}

/* ---------- tiny DOM builder ---------- */
function el(tag, props, children){
  var e=document.createElement(tag);
  if(props) for(var k in props){
    var v=props[k];
    if(v==null) continue;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k==='html') e.innerHTML=v;
    else if(k==='attrs'){ for(var a in v) e.setAttribute(a,v[a]); }
    else if(k.slice(0,2)==='on' && typeof v==='function') e.addEventListener(k.slice(2),v);
    else if(k.indexOf('-')>0) e.setAttribute(k,v);
    else e[k]=v;
  }
  (children||[]).forEach(function(c){ if(c==null) return; e.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return e;
}

  if(typeof google==='undefined' || !google.script || !google.script.run){

/* Ask the server who we are. Google identity is trusted and greets the user; if
   Google can't identify them, we ask them to type an email — self-asserted, and
   used only until Google can name them, so roles + per-user data stay enforced. */
function startLogin(){
  showLoginScreen();
  var settled=false;
  var watchdog=setTimeout(function(){
    if(settled) return;
    console.error('[DataGrid] getIdentity did not respond within 15s.');
    loginFailed('The server hasn’t responded. This usually means the deployment is running an OLD version of the code. Fix: Deploy ▸ Manage deployments ▸ (pencil) ▸ Version: New version ▸ Deploy — or open the Test deployment URL (Deploy ▸ Test deployments), which always runs the latest saved code.');
  }, 15000);

  callServer('getIdentity').then(function(id){
    settled=true; clearTimeout(watchdog);
    id=id||{email:'',source:'none'};
    if(id.email){ markSignedIn(); boot(); }      /* cookie-authenticated → straight into the app */
    else { window.location.href='login.php'; }   /* not signed in → go to the login page */
  }).catch(function(e){
    settled=true; clearTimeout(watchdog);
    console.error('[DataGrid] getIdentity failed:', e);
    loginFailed('Couldn’t check your sign-in: '+((e&&e.message)||e));
  });
}

function showLoginScreen(){
  if(!loginScreen) return;
  loginScreen.hidden=false;

    el('div',{class:'spinner','aria-hidden':'true'}),
    el('p',{text:'Checking your sign-in…'})
  ]));
}
function hideLoginScreen(){ if(loginScreen) loginScreen.hidden=true; }
function setLoginBody(node){ if(!loginBody) return; loginBody.innerHTML=''; loginBody.appendChild(node); }

/* Google (or a remembered typed email) already identifies the user — greet them
   and continue. A fallback identity is clearly marked and can be changed. */
function renderSignedIn(email, source){
  var fallback=(source==='fallback');
  var kids=[
    el('p',{class:'login-lead',text: fallback?'Continue as':'Signed in as'}),
    el('p',{class:'login-email',text: email}),
    el('p',{class:'login-note',text: fallback
      ? 'You entered this email because Google didn’t identify you. It isn’t verified — it just decides which rows are yours.'
      : 'This is the Google account you’re signed in with.'})
  ];
  var cont=el('button',{class:'btn btn-primary login-btn',type:'button',text:'Continue'});
  cont.addEventListener('click', function(){ markSignedIn(); boot(); });
  kids.push(cont);
  if(fallback){
    var change=el('button',{class:'login-link',type:'button',text:'Use a different email'});
    change.addEventListener('click',function(){ renderEmailEntry(email); });
    kids.push(change);
  }
  setLoginBody(el('div',{class:'login-signedin'},kids));
  cont.focus();

/* Google couldn't name the caller — ask for an email. It's self-asserted and
   still subject to roles + per-user data on the server. */
function renderEmailEntry(prefill){
  var input=el('input',{class:'input login-input',type:'email',placeholder:'you@example.com',autocomplete:'email','aria-label':'Your email'});
  if(prefill) input.value=prefill;
  var err=el('p',{class:'login-error'}); err.hidden=true;
  var cont=el('button',{class:'btn btn-primary login-btn',type:'button',text:'Continue'});
  function fail(msg){ err.textContent=msg; err.hidden=false; }
  function submit(){
    var v=(input.value||'').trim();
    if(!v || !isValidEmail(v)){ fail('Enter a valid email address.'); input.focus(); return; }
    err.hidden=true; cont.disabled=true; cont.textContent='Signing in…';
    callServer('loginWithEmail',[v]).then(function(){ markSignedIn(); boot(); })
      .catch(function(e){ cont.disabled=false; cont.textContent='Continue'; fail((e&&e.message)?e.message:'Could not sign in. Try again.'); });
  }
  cont.addEventListener('click',submit);
  input.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
  setLoginBody(el('div',{class:'login-entry'},[
    el('p',{class:'login-lead',text:'Sign in to continue'}),
    el('p',{class:'login-note',text:'We couldn’t detect your Google account, so enter your email to continue. It decides which rows are yours and which role you have.'}),
    input, err, cont
  ]));
  input.focus();
}

/* Google couldn't identify the caller AND an admin has left email sign-in off, so

    el('p',{class:'login-lead',text:'Google sign-in required'}),
    el('p',{class:'login-note',text:'This workspace only accepts Google-verified sign-in, so it can be sure who you are — and we couldn’t detect a Google account for you.'}),
    el('p',{class:'login-note',text:'Open the app while signed in to your Google account. If you should have access another way, ask an administrator to turn on email sign-in in Settings.'}),
    retry

}

/* ============================================================= *
 *  Live refresh — poll the server and re-render when data changes.
 *  GAS has no server push, so we ask getInitialData every POLL_MS and
 *  swap in new rows/columns only when it's safe to do so:
 *    - never while a modal is open (would yank the dialog's data), and
 *    - never while an inline cell edit is in progress (would lose typing).
 *  The user's search / sort / page are preserved across the swap.
 * ============================================================= */
/* Cheap signature of the table list, so the poll notices when another admin
   creates, renames, deletes, or reorders a table and can refresh the switcher. */
function tablesSignature(tables){
  return (tables||[]).map(function(t){ return t.id+':'+t.name+':'+(t.order==null?'':t.order)+':'+(t.accessMode||''); }).join(',');
}
function dataSig(columns, rows){
  /* Cheap change-detector: column identity+order+width and every row's values.
     JSON is fine here — payloads are the same shape the app already renders. */
  try {
    var colSig=(columns||[]).map(function(c){
      return c.id+':'+c.name+':'+c.type+':'+(c.order==null?'':c.order)+':'+(c.width==null?'':c.width)
        +':'+((c.options&&c.options.join('|'))||'');
    }).join(',');
    return colSig+' @'+(State.currency||'')+' #'+(State.trashCount||0)+' || '+JSON.stringify(rows||[]);
  } catch(e){ return String(Math.random()); }  /* on failure, force a re-render */
}
function refreshBlocked(){
  /* modalOverlay.hidden===false means a dialog is open; the record side-panel open
     means the user is viewing/editing one row; activeEditor set means an inline cell
     edit is mid-flight. In any of these, don't disturb the user. */
  return (modalOverlay && modalOverlay.hidden===false)
      || (panelOverlay && panelOverlay.hidden===false)
      || activeEditor!==null;
}
function startPolling(){
  if(pollTimer) return;                 /* already running — never stack timers */
  pollTimer=setInterval(pollForUpdates, POLL_MS);
}
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
function pollForUpdates(){
  if(refreshBlocked()) return;          /* try again on the next tick */
  callServer('getInitialData',[State.tableId]).then(function(data){
    if(!data || !data.me || !data.me.email) return;   /* lost identity — leave as-is */
    if(refreshBlocked()) return;                       /* a modal/edit opened mid-request */
    var cols=data.columns||[], rows=data.rows||[];
    var tables=data.tables||State.tables;
    /* If the table we're viewing was deleted by another admin, the server falls back
       to the primary table and returns ITS data under a different id. Treat that as a
       forced switch: adopt the new table and clear view state that referenced the old one. */
    var forced=!!(data.tableId && data.tableId!==State.tableId);
    var tSig=tablesSignature(tables);
    var sig=dataSig(cols, rows);
    if(sig===lastDataSig && tSig===lastTablesSig && !forced) return;   /* nothing changed — no flicker */
    lastDataSig=sig; lastTablesSig=tSig;
    State.columns=cols;
    State.rows=rows;
    State.tables=tables;
    State.sheetUrl=(data.sheetUrl)||State.sheetUrl;
    State.currency=data.currency || State.currency;
    if(typeof data.trashCount==='number') State.trashCount=data.trashCount;
    State.me=data.me || State.me;
    State.views=data.views||State.views;
    if(typeof data.accessMode==='string') State.accessMode=data.accessMode;
    State.scheduleView=!!data.scheduleView;
    State.dateNotes=data.dateNotes||{};
    if(forced){
      State.tableId=data.tableId;
      resetViewState();
      toast('The table you were viewing was removed — showing “'+(tableName(State.tableId)||'another table')+'”.','error');
    }
    invalidateView();                                   /* memoised filter+sort is now stale */
    render();                                           /* preserves search / sort / page */
    hydrateLinks();
    renderTableSwitch();
    updateTrashBadge();
  }).catch(function(e){
    console.warn('[DataGrid] live refresh skipped:', e); /* transient — try again next tick */
  });
}

function bindStatic(){

  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !modalOverlay.hidden) Modal.close(); });
  document.addEventListener('keydown',trapTab);

  /* Record side-panel: close (button + click on the dimmed backdrop + Esc), step
     between records, focus-trap, and Enter-to-save from a plain field. All bound
     once here; the panel's content is (re)built by renderRecordPanel. */
  if(panelClose) panelClose.addEventListener('click',Panel.close);
  if(panelOverlay) panelOverlay.addEventListener('mousedown',function(e){ if(e.target===panelOverlay) Panel.close(); });
  if(panelPrev) panelPrev.addEventListener('click',function(){ panelStep(-1); });
  if(panelNext) panelNext.addEventListener('click',function(){ panelStep(1); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && Panel.isOpen()) Panel.close(); });
  document.addEventListener('keydown',trapPanelTab);
  if(panelBody) panelBody.addEventListener('keydown',function(e){
    if(e.key==='Enter' && e.target.tagName!=='TEXTAREA' && e.target.tagName!=='SELECT'){ e.preventDefault(); if(_panelSave) _panelSave(); }
  });

  tableScroll.addEventListener('scroll',function(){ this.classList.toggle('scrolled', this.scrollTop>0); });
}

/* Show/hide admin-only controls for the signed-in user. Every one of these is
   also enforced on the server, so this is purely a tidy UI — not the gate. */
function applyAccess(){
  var admin=!!(State.me && State.me.isAdmin);
  if(whoami){
    var who=(State.me && State.me.email) ? State.me.email : 'Signed in';
    whoami.textContent=who+' · '+(admin?'Admin':'Member');
    whoami.hidden=false;
  }
  btnAddColumn.hidden=!admin;
  btnAccess.hidden=!admin;
  btnActivity.hidden=!admin;
  // Table management (create / rename / delete) lives in Settings and is gated there
  // and on the server; members can still switch tables from the same Settings section.
  // The data-sheet link opens the raw spreadsheet (everyone's rows), so members
  // never see it. The server also withholds the URL from members — this is just
  // belt-and-braces so the link can't linger if a member had it earlier.
  if(sheetLink && !admin){ sheetLink.hidden=true; }
  // The "no columns yet" empty state offers to add a column — only useful to admins.
  var h2=emptyNoColumns.querySelector('h2');
  var p=emptyNoColumns.querySelector('p');
  var addBtn=emptyNoColumns.querySelector('button');
  if(admin){
    if(h2) h2.textContent='Start by adding a column';
    if(p) p.textContent='This table is yours to shape. Add your first column — text, number, date, or a dropdown — then start adding rows.';
    if(addBtn) addBtn.hidden=false;
  } else {
    if(h2) h2.textContent='No columns yet';
    if(p) p.textContent='An administrator hasn’t set up any columns yet. Once they do, you’ll be able to add rows here.';
    if(addBtn) addBtn.hidden=true;
  }
}

/* ============================================================= *
 *  Table switcher (multiple tables)
 *  A dropdown of every table the user can see; picking one loads that table's own
 *  columns + rows. Admins also get a "manage" button (create / rename / delete).
 *  Creating/renaming/deleting is admin-only and enforced on the server — this is
 *  just the entry point. State.tableId is threaded into every table-scoped server
 *  call, so the whole app always reads and writes the selected table.
 * ============================================================= */
function tableName(id){
  for(var i=0;i<(State.tables||[]).length;i++){ if(State.tables[i].id===id) return State.tables[i].name; }
  return '';
}
function sortedTables(){
  return (State.tables||[]).slice().sort(function(a,b){
    var ao=a.order==null?0:a.order, bo=b.order==null?0:b.order;
    if(ao!==bo) return ao-bo;
    return String(a.name).localeCompare(String(b.name));
  });
}
/* The access mode of the table currently open. 'adminManaged' = everyone views,
   only admins edit; anything else behaves as the classic per-user table. Kept in
   State.accessMode (set from every getInitialData payload) with the table-list
   entry as a fallback so the switcher's optimistic UI stays consistent. */
function currentTableObj(){
  for(var i=0;i<(State.tables||[]).length;i++){ if(State.tables[i].id===State.tableId) return State.tables[i]; }
  return null;
}
function currentAccessMode(){
  if(State.accessMode==='adminManaged') return 'adminManaged';
  var t=currentTableObj();
  return (t && t.accessMode==='adminManaged') ? 'adminManaged' : 'perUser';
}
/* May the signed-in user create / edit / delete DATA on the active table?
   Admins always can. On a per-user table every signed-in member can (their own
   rows). On an admin-managed table members are read-only. This mirrors the
   server's requireTableWrite_ exactly — the server is the real gate; this just
   keeps the UI honest so members never see controls that would be rejected. */
function canEditData(){
  return canEditMode(!!(State.me && State.me.isAdmin), currentAccessMode());
}
/* Guard every mutation entry point: returns true if the user may edit this table,
   otherwise shows the standard refusal toast and returns false. The server's
   requireTableWrite_ is the real gate — this just keeps the UI honest and gives a
   clear message if a stale control is somehow triggered. */
function ensureCanEdit(){
  if(canEditData()) return true;
  toast('Only an administrator can change this table.','error');
  return false;
}
/* Keep State.tableId pointing at a table that still exists. The visible switcher
   now lives in the Settings dialog (rebuilt each time it opens), so there's no
   persistent DOM to update here — callers use this only to reconcile the active
   id after the table list changes (e.g. another admin deleted the table we were
   on, or a rename/create refreshed the list). */
function renderTableSwitch(){
  var tables=sortedTables();
  if(!tableName(State.tableId) && tables.length){ State.tableId=tables[0].id; }
  renderTableTabs(tables);
}
/* Render the active-table tab strip (#tableTabs) above the workspace. This is the
   switcher that used to live in Settings: one tab per table, the current one marked
   active; admins also get a ＋ tab that opens Settings to create/manage tables.
   Driven from renderTableSwitch, so it stays in sync after every switch / create /
   rename / delete / access-mode change and on initial load. */
function renderTableTabs(tables){
  var host=document.getElementById('tableTabs');
  if(!host) return;
  tables=tables||sortedTables();
  host.innerHTML='';
  if(!tables.length){ host.hidden=true; return; }
  host.hidden=false;
  tables.forEach(function(t){
    var active=t.id===State.tableId;
    var tab=el('button',{class:'table-tab'+(active?' is-active':''),type:'button',text:t.name,title:t.name});
    tab.setAttribute('role','tab');
    tab.setAttribute('aria-selected',active?'true':'false');
    tab.addEventListener('click',function(){ if(t.id!==State.tableId) switchTable(t.id); });
    host.appendChild(tab);
  });
  if(State.me && State.me.isAdmin){
    var add=el('button',{class:'table-tab table-tab-add',type:'button',text:'＋',title:'Create a table','aria-label':'Create a table'});
    add.addEventListener('click',openSettingsModal);
    host.appendChild(add);
  }
}
/* Clear everything specific to the table we're leaving: search, filters, sort,
   selection, and page. Used on an explicit switch and on a forced fallback. */
function resetViewState(){
  State.search=''; if(searchInput) searchInput.value=''; if(searchClear) searchClear.hidden=true;
  State.filters=[]; State.sort={colId:null,dir:1}; State.page=1; State.colorRules=[];
  State.viewType='grid'; State.groupColId=''; State.calendarColId=''; State.galleryColId=''; State.activeViewId='';
  State.gridGroupColId=''; State._collapsedGroups={};
  State._linkCache={};
  State._panelRowId=''; if(typeof Panel!=='undefined' && Panel.close) Panel.close();
  clearSelection(); invalidateView();
}
/* Switch to another table: reset the view (its columns/filters/sort differ), then
   load that table's data. Everything table-scoped keys off State.tableId. */
function switchTable(id){
  if(!id || id===State.tableId) return;
  var prev=State.tableId;
  State.tableId=id;
  resetViewState();
  callServer('getInitialData',[State.tableId]).then(function(data){
    if(!data) return;
    State.columns=(data.columns)||[];
    State.rows=(data.rows)||[];
    State.sheetUrl=(data.sheetUrl)||'';
    State.currency=data.currency || State.currency;
    State.trashCount=(typeof data.trashCount==='number')?data.trashCount:0;
    State.tables=(data.tables)||State.tables;
    State.tableId=(data.tableId)||State.tableId;
    State.accessMode=(data.accessMode)||'perUser';
    State.me=data.me || State.me;
    State.views=(data.views)||[];
    State.scheduleView=!!data.scheduleView;
    State.dateNotes=data.dateNotes||{};
    if(State.sheetUrl){ sheetLink.href=State.sheetUrl; }
    applyAccess();
    invalidateView(); if(!maybeAutoView()) render(); hydrateLinks(); updateTrashBadge(); renderTableSwitch();
    lastDataSig=dataSig(State.columns, State.rows);
    lastTablesSig=tablesSignature(State.tables);
    toast('Switched to “'+(tableName(State.tableId)||'table')+'”');
  }).catch(function(e){
    State.tableId=prev;                       // roll back to the table we were on
    renderTableSwitch();
    showError(e);
  });
}

/* The "Tables" section shown at the top of the Settings dialog. Everyone gets a
   switcher to change the active table; admins additionally get an inline list with
   rename / delete plus a create form. This replaces the old top-bar switcher and
   the standalone manager — every table action now lives in Settings. All three
   mutations are admin-only on the server; this is just the UI in front of them. */
function tablesSection(){
  var admin=!!(State.me && State.me.isAdmin);
  // Table switching now lives in the tab strip above the workspace (see
  // renderTableTabs); Settings keeps only admin table MANAGEMENT. Members have
  // nothing to manage here, so they get no Tables section at all.
  if(!admin) return null;
  var wrap=el('div',{class:'set-card'});

  // --- management (admin only) ---
  var panel=el('div',{class:'tables-manage'});
  panel.appendChild(el('p',{class:'modal-note',html:'Each table keeps its <strong>own columns and rows</strong>. Who’s an admin and the currency symbol are shared, but <strong>editing access is per table</strong>: “Everyone edits own rows” keeps each person’s rows private, while “Everyone views · admins edit” shows every row to everyone and lets only admins change them. Deleting a table removes its rows and columns for good.'}));

  var list=el('div',{class:'tables-list'},[el('div',{class:'tables-empty',text:'Loading…'})]);
  panel.appendChild(list);

  var nameInput=el('input',{class:'input',type:'text',placeholder:'e.g. Invoices',maxLength:60});
  var addBtn=el('button',{class:'btn btn-primary',type:'button',text:'Create'});
  panel.appendChild(el('div',{class:'field',style:'margin-top:14px;'},[
    el('label',{},[document.createTextNode('New table '), el('span',{class:'hint',text:'· name it'})]),
    el('div',{class:'tables-add'},[nameInput,addBtn])
  ]));

  function draw(tables){
    list.innerHTML='';
    tables=tables||[];
    if(!tables.length){ list.appendChild(el('div',{class:'tables-empty',text:'No tables yet.'})); return; }
    var canDelete=tables.length>1;
    tables.forEach(function(t){
      var isCurrent=t.id===State.tableId;
      var idBox=el('div',{class:'table-id'},[
        el('span',{class:'table-name',text:t.name}),
        isCurrent?el('span',{class:'table-current',text:'Current'}):null
      ].filter(Boolean));

      var rowEl=el('div',{class:'table-row'});
      var rename=el('button',{class:'btn btn-secondary btn-xs',type:'button',text:'Rename'});
      rename.addEventListener('click',function(){ startRename(t, rowEl); });
      var actions=[accessSelect(t), rename];
      if(canDelete){
        var del=el('button',{class:'icon-btn danger',type:'button',title:'Delete table','aria-label':'Delete '+t.name,html:ICON.trash});
        del.addEventListener('click',function(){ confirmDeleteTable(t); });
        actions.push(del);
      }
      rowEl.appendChild(idBox);
      rowEl.appendChild(el('div',{class:'tables-actions'},actions));
      list.appendChild(rowEl);
    });
  }

  /* Per-table access mode (admin only). perUser = everyone edits their own rows;
     adminManaged = everyone views every row, but only admins can change them.
     Flipping it persists via apiSetTableAccessMode and, when it's the table we're
     viewing, updates State.accessMode so the grid/toolbar/badge react immediately. */
  function accessSelect(t){
    var sel=el('select',{class:'select select-xs table-access','aria-label':'Who can edit “'+t.name+'”'});
    sel.appendChild(el('option',{value:'perUser',text:'Everyone edits own rows'}));
    sel.appendChild(el('option',{value:'adminManaged',text:'Everyone views · admins edit'}));
    sel.value=(t.accessMode==='adminManaged')?'adminManaged':'perUser';
    sel.addEventListener('change',function(){
      var mode=sel.value, prev=(t.accessMode==='adminManaged')?'adminManaged':'perUser';
      if(mode===prev) return;
      sel.disabled=true;
      callServer('apiSetTableAccessMode',[t.id,mode]).then(function(res){
        t.accessMode=mode;
        if(res&&res.tables){ State.tables=res.tables; renderTableSwitch(); }
        if(t.id===State.tableId){ State.accessMode=mode; invalidateView(); render(); }
        sel.disabled=false;
        toast(mode==='adminManaged'?'“'+t.name+'” is now view-only for members':'“'+t.name+'” is now editable by everyone');
      }).catch(function(e){ sel.value=prev; sel.disabled=false; showError(e); });
    });
    return sel;
  }

  // Inline rename: swap the name for an input with Save / Cancel.
  function startRename(t, rowEl){
    var input=el('input',{class:'input',type:'text',maxLength:60}); input.value=t.name;
    var save=el('button',{class:'btn btn-primary btn-xs',type:'button',text:'Save'});
    var cancel=el('button',{class:'btn btn-secondary btn-xs',type:'button',text:'Cancel',onclick:reload});
    function commit(){
      var nm=input.value.trim();
      if(!nm){ toast('Enter a table name.','error'); return; }
      save.disabled=true; save.textContent='Saving…';
      callServer('apiRenameTable',[t.id,nm]).then(function(res){
        if(res&&res.tables){ State.tables=res.tables; renderTableSwitch(); }
        toast('Table renamed'); reload();
      }).catch(function(e){ save.disabled=false; save.textContent='Save'; showError(e); });
    }
    save.addEventListener('click',commit);
    input.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); commit(); } else if(e.key==='Escape'){ e.preventDefault(); reload(); } });
    rowEl.innerHTML='';
    rowEl.appendChild(el('div',{class:'table-id'},[input]));
    rowEl.appendChild(el('div',{class:'tables-actions'},[save,cancel]));
    setTimeout(function(){ input.focus(); input.select(); },20);
  }

  function confirmDeleteTable(t){
    var c2=el('div',{},[
      el('p',{class:'modal-note',html:'Delete <strong>'+escapeHtml(t.name)+'</strong> and everything in it? Its columns, rows, and trashed rows are permanently removed — this can’t be undone.'})
    ]);
    // The confirm replaces the Settings dialog; both paths return you to Settings.
    var back=el('button',{class:'btn btn-secondary',type:'button',text:'Cancel',onclick:openSettingsModal});
    var yes=el('button',{class:'btn btn-danger',type:'button',text:'Delete table'});
    yes.addEventListener('click',function(){
      yes.disabled=true; yes.textContent='Deleting…';
      callServer('apiDeleteTable',[t.id]).then(function(res){
        if(res&&res.tables) State.tables=res.tables;
        toast('Table deleted');
        if(t.id===State.tableId){
          // We deleted the table we were viewing — jump to the primary the server named.
          var nextId=(res&&res.tableId)||(State.tables[0]&&State.tables[0].id)||'';
          Modal.close();
          State.tableId='';                 // force switchTable to run even if ids coincide
          switchTable(nextId);
        } else {
          renderTableSwitch();
          openSettingsModal();              // back to Settings on the fresh list
        }
      }).catch(function(e){ yes.disabled=false; yes.textContent='Delete table'; showError(e); });
    });
    Modal.open({title:'Delete table', body:c2, foot:[back,yes]});
  }

  function reload(){
    return callServer('apiListTables').then(function(res){
      if(res&&res.tables){ State.tables=res.tables; renderTableSwitch(); }
      draw((res&&res.tables)||[]);
    });
  }

  addBtn.addEventListener('click',function(){
    var nm=nameInput.value.trim();
    if(!nm){ toast('Enter a table name.','error'); return; }
    addBtn.disabled=true; addBtn.textContent='Creating…';
    callServer('apiCreateTable',[nm]).then(function(res){
      if(res&&res.tables){ State.tables=res.tables; renderTableSwitch(); }
      nameInput.value=''; addBtn.disabled=false; addBtn.textContent='Create';
      toast('Table “'+((res&&res.table&&res.table.name)||nm)+'” created');
      draw((res&&res.tables)||[]);          // stay in Settings so you can create more or rename
    }).catch(function(e){ addBtn.disabled=false; addBtn.textContent='Create'; showError(e); });
  });
  nameInput.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addBtn.click(); } });

  wrap.appendChild(panel);
  reload().catch(function(e){ list.innerHTML=''; list.appendChild(el('div',{class:'tables-empty',text:'Couldn’t load tables.'})); showError(e); });
  return wrap;
}

/* ============================================================= *
 *  Linked records — label cache
 *  A link column stores target row ids; we show a human label (the target row's
 *  chosen display column) as a chip. Labels are resolved on the server via
 *  apiLinkOptions — which respects the target table's per-user isolation, so a
 *  member never sees a row they couldn't otherwise see — and cached here per
 *  (linkTableId | displayColId) pair. A chip falls back to the raw id whenever a
 *  label isn't resolvable (not loaded yet, deleted, or hidden by isolation).
 * ============================================================= */
function linkCacheKey(col){ return String(col.linkTableId||'')+'|'+String(col.linkDisplayColId||''); }
function getLinkEntry(col){ return State._linkCache[linkCacheKey(col)] || null; }
function linkLabel(col,id){
  var e=getLinkEntry(col);
  if(e && e.byId && Object.prototype.hasOwnProperty.call(e.byId,id)){
    var lbl=e.byId[id];
    return (lbl===''||lbl==null) ? id : String(lbl);
  }
  return id;
}
function linkColumns(){ return State.columns.filter(function(c){ return c.type==='link' && c.linkTableId; }); }
/* Fetch labels for every distinct link target used by the current table's columns,
   then call done(changed) once, after all requests settle. `changed` is true only
   when at least one fetch actually ran — so callers can skip a needless re-render
   when every label set was already cached (the common case on background polls).
   Already-loaded pairs are skipped; a failed pair is marked loaded-with-error so
   chips fall back to ids. */
function prefetchLinks(done){
  var keys={};
  linkColumns().forEach(function(c){ keys[linkCacheKey(c)]=c; });
  var pending=[];
  Object.keys(keys).forEach(function(k){
    var cur=State._linkCache[k];
    if(!cur || !cur.loaded) pending.push(keys[k]);
  });
  if(!pending.length){ if(done) done(false); return; }
  var left=pending.length;
  pending.forEach(function(c){
    var k=linkCacheKey(c);
    if(!State._linkCache[k]) State._linkCache[k]={options:[],byId:{},loaded:false};
    callServer('apiLinkOptions',[c.linkTableId, c.linkDisplayColId]).then(function(res){
      var byId={}; (res.options||[]).forEach(function(o){ byId[o.id]=o.label; });
      State._linkCache[k]={options:res.options||[], byId:byId, loaded:true, tableName:res.tableName, displayColId:res.displayColId};
    }).catch(function(e){
      State._linkCache[k]={options:[],byId:{},loaded:true,error:(e&&e.message)||String(e)};
    }).then(function(){ if(--left===0 && done) done(true); });
  });
}
/* Re-fetch link labels in the background, then re-render (only if something was
   actually fetched) so id-chips become labels. */
function hydrateLinks(){ prefetchLinks(function(changed){ if(changed) render(); }); }

/* ============================================================= *
 *  Saved views — snapshot + apply
 *  A view captures the current search, filters, sort, layout (grid|kanban) and
 *  Kanban group-by column. Views are personal (yours) or shared (published by an
 *  admin, visible to all); the server enforces who may publish/edit which.
 * ============================================================= */
function dropdownCols(){ return displayColumns(State.columns).filter(function(c){ return c.type==='dropdown'; }); }
/* Date/datetime columns (Calendar view can plot by any of them; Created At always
   qualifies, so there's normally at least one). */
function dateColsList(){ return displayColumns(State.columns).filter(function(c){ return c.type==='date'||c.type==='datetime'; }); }
function isDateCol(id){ return !!id && dateColsList().some(function(c){ return c.id===id; }); }
function defaultCalendarCol(){ var d=dateColsList(); return d.length ? d[0].id : ''; }
/* Attachment columns the Gallery view can draw each card's hero image from. */
function fileColsList(){ return displayColumns(State.columns).filter(function(c){ return c.type==='file'; }); }
function isFileCol(id){ return !!id && fileColsList().some(function(c){ return c.id===id; }); }
function defaultGalleryCol(){ var f=fileColsList(); return f.length ? f[0].id : ''; }
/* True when a file descriptor looks like an image — by MIME first, then by a
   known image extension on its name (older uploads may lack a precise MIME). */
function isImageFile(f){
  if(!f) return false;
  if(/^image\//i.test(String(f.mime||''))) return true;
  return /\.(jpe?g|png|gif|webp|bmp|svg|heic|heif|avif)$/i.test(String(f.name||''));
}
/* First image among a file cell's descriptors, or null. Accepts the stored JSON
   string or an already-parsed array (parseFiles handles both). */
function firstImageFile(v){
  var arr=parseFiles(v);
  for(var i=0;i<arr.length;i++){ if(isImageFile(arr[i])) return arr[i]; }
  return null;
}
/* A Drive file id → an <img>-able thumbnail URL. A file's stored url is a Drive
   "view" link that won't render in <img>; the thumbnail endpoint does, for files
   shared anyone-with-link (which every upload is). */
function driveThumbUrl(id, width){
  id=String(id==null?'':id).trim(); if(!id) return '';
  var w=(+width>0)?Math.round(+width):400;
  return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w'+w;
}
function activeView(){
  for(var i=0;i<(State.views||[]).length;i++){ if(State.views[i].id===State.activeViewId) return State.views[i]; }
  return null;
}
function currentViewConfig(){
  return {
    search: State.search||'',
    filters: (State.filters||[]).map(function(f){ return {colId:f.colId, op:f.op, value:f.value, value2:f.value2}; }),
    sort: { colId: State.sort.colId||null, dir: State.sort.dir===-1?-1:1 },
    viewType: (State.viewType==='kanban'||State.viewType==='dashboard')?State.viewType:'grid',
    groupColId: State.groupColId||'',
    gridGroupColId: State.gridGroupColId||'',
    calendarColId: State.calendarColId||'',
    galleryColId: State.galleryColId||'',
    /* only persist charts that actually have a column chosen (mirrors the server) */
    charts: (State.dashCharts||[]).filter(function(c){ return c && c.colId; }).map(function(c){ return {colId:c.colId, chartType:c.chartType||'bar', dateColId:c.dateColId||'', from:c.from||'', to:c.to||''}; }),
    colorRules: sanitizeColorRules(State.colorRules)
  };
}
/* Apply a saved view by id, or reset to a clean default grid when id is ''.
   `silent` suppresses the "View applied" toast (used by the auto-open on first
   load of an admin-managed table, where no user action triggered it). */
function applyView(id,silent){
  State.activeViewId=id||'';
  var v=activeView();
  if(!v){
    State.search=''; if(searchInput) searchInput.value=''; if(searchClear) searchClear.hidden=true;
    State.filters=[]; State.sort={colId:null,dir:1};
    State.viewType='grid'; State.groupColId=''; State.calendarColId=''; State.galleryColId=''; State.dashCharts=[]; State.colorRules=[];
    State.gridGroupColId=''; State._collapsedGroups={};
    State.page=1; clearSelection(); invalidateView(); render();
    return;
  }
  var c=v.config||{};
  State.search=String(c.search||''); if(searchInput) searchInput.value=State.search; if(searchClear) searchClear.hidden=!State.search;
  State.filters=Array.isArray(c.filters)?c.filters.map(function(f){ return {colId:f.colId, op:f.op, value:f.value, value2:f.value2}; }):[];
  State.sort=(c.sort && c.sort.colId)?{colId:c.sort.colId, dir:c.sort.dir===-1?-1:1}:{colId:null,dir:1};
  State.viewType=(c.viewType==='kanban'||c.viewType==='dashboard')?c.viewType:'grid';
  State.groupColId=String(c.groupColId||'');
  State.gridGroupColId=String(c.gridGroupColId||''); State._collapsedGroups={};
  State.calendarColId=String(c.calendarColId||'');
  State.galleryColId=String(c.galleryColId||'');
  State.dashCharts=sanitizeDashCharts(c.charts);
  State.colorRules=sanitizeColorRules(c.colorRules);
  if(State.viewType==='kanban' && !State.groupColId){ var d=dropdownCols(); if(d.length) State.groupColId=d[0].id; }
  if(State.viewType==='dashboard' && !State.dashCharts.length){ State.dashCharts=[defaultChart()]; }
  if(State.viewType==='calendar' && !isDateCol(State.calendarColId)){ State.calendarColId=defaultCalendarCol(); }
  if(State.viewType==='gallery' && !isFileCol(State.galleryColId)){ State.galleryColId=defaultGalleryCol(); }
  State.page=1; clearSelection(); pruneFilters(); pruneColorRules(); pruneGridGroup(); invalidateView(); render();
  if(!silent) toast('View “'+v.name+'” applied');
}

/* First-open presentation for admin-managed tables. An admin-managed table is an
   admin-curated, shared table (e.g. the Shift Schedule), so the first time it's
   shown in a session we open it in its first SHARED view — which is how the seeded
   Shift Schedule lands in its Calendar view. Strictly scoped so it NEVER changes
   how ordinary per-user tables open (they stay on the grid, exactly as before):
   skipped unless the table is adminManaged, a view isn't already chosen, and we
   haven't already auto-opened this table this session (so switching to grid sticks). */
var _autoViewApplied={};
function autoDefaultViewId(){
  if(State.activeViewId) return '';
  if(currentAccessMode()!=='adminManaged') return '';
  if(_autoViewApplied[State.tableId]) return '';
  var vs=State.views||[];
  for(var i=0;i<vs.length;i++){ if(vs[i] && vs[i].scope==='shared') return vs[i].id; }
  return '';
}
function maybeAutoView(){
  var id=autoDefaultViewId();
  if(!id) return false;
  _autoViewApplied[State.tableId]=true;
  applyView(id,true);   /* silent — no user action triggered it */
  return true;
}
function setViewType(v){
  State.viewType=(v==='kanban'||v==='dashboard')?v:'grid';
  if(State.viewType==='kanban' && !State.groupColId){ var d=dropdownCols(); if(d.length) State.groupColId=d[0].id; }
  if(State.viewType==='dashboard' && !State.dashCharts.length){ State.dashCharts=[defaultChart()]; }
  if(State.viewType==='calendar' && !isDateCol(State.calendarColId)){ State.calendarColId=defaultCalendarCol(); }
  if(State.viewType==='gallery' && !isFileCol(State.galleryColId)){ State.galleryColId=defaultGalleryCol(); }
  clearSelection(); render();
}
/* Keep only well-formed chart specs (≤3, real chart type) — mirrors the
   server's sanitizeViewConfig_ so a saved view round-trips identically. */
/* Keep a date string only when it's a real YYYY-MM-DD; anything else → '' (a
   native <input type=date> only ever yields that shape or empty, but saved views
   round-trip through here too, so we validate defensively — matches the server). */
function cleanDateStr(s){ s=String(s==null?'':s); return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ''; }
function sanitizeDashCharts(arr){
  if(!Array.isArray(arr)) return [];
  var out=[];
  for(var i=0;i<arr.length && out.length<3;i++){
    var c=arr[i]; if(!c || typeof c!=='object') continue;
    var colId=String(c.colId||''); if(!colId) continue;
    var ct=String(c.chartType||'bar'); if(['bar','pie','line','donut'].indexOf(ct)<0) ct='bar';
    out.push({colId:colId, chartType:ct, dateColId:String(c.dateColId||''), from:cleanDateStr(c.from), to:cleanDateStr(c.to)});
  }
  return out;
}
/* A sensible first chart when the dashboard is opened empty: prefer a dropdown
   column (cleanest categories), else the first non-file column. */
function defaultChart(){
  var cols=displayColumns(State.columns);
  var drop=cols.filter(function(c){ return c.type==='dropdown'; });
  var pick=drop[0] || cols.filter(function(c){ return c.type!=='file'; })[0] || cols[0];
  return {colId: pick?pick.id:'', chartType:'bar'};
}
function openSaveViewModal(){

  if(admin){
    body.appendChild(el('div',{class:'field'},[
      el('label',{},[document.createTextNode('Who can see it '), el('span',{class:'hint',text:'· shared is visible to everyone'})]),

    ]));
  }
  var cancel=el('button',{class:'btn btn-secondary',type:'button',text:'Cancel',onclick:Modal.close});

function updateActiveView(){

  }).catch(showError);
}
function deleteActiveView(){

  del.addEventListener('click',function(){
    del.disabled=true; del.textContent='Deleting…';

    }).catch(function(e){ del.disabled=false; del.textContent='Delete view'; showError(e); });
  });
  Modal.open({title:'Delete view', body:body, foot:[cancel,del]});
}
/* The bar above the table: saved-view switcher + Save/Update/Delete, and the
   Grid | Kanban layout toggle (with a Group-by picker in Kanban). Rebuilt on every

function renderViewBar(){

  if(State.scheduleView){ viewBar.hidden=true; viewBar.innerHTML=''; return; }

  var left=el('div',{class:'view-left'});

  function addOpts(group,list){
    list.forEach(function(v){ var o=el('option',{value:v.id,text:v.name}); if(v.id===State.activeViewId) o.selected=true; group.appendChild(o); });
  }

  sel.value=State.activeViewId||'';

  left.appendChild(sel);

  var av=activeView();

    left.appendChild(el('button',{class:'btn btn-ghost btn-xs vb-danger',type:'button',text:'Delete',title:'Delete this view',onclick:deleteActiveView}));
  }

  var right=el('div',{class:'view-right'});
  right.appendChild(segmented([['grid','Grid'],['kanban','Kanban'],['dashboard','Dashboard']], State.viewType, setViewType));
  if(State.viewType==='kanban'){
    var gwrap=el('label',{class:'view-groupby'});
