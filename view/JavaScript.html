    gsel.appendChild(el('option',{value:'',text:'—'}));
    dropdownCols().forEach(function(c){ var o=el('option',{value:c.id,text:c.name}); if(c.id===State.groupColId) o.selected=true; gsel.appendChild(o); });
    gsel.value=State.groupColId||'';
    gsel.addEventListener('change',function(){ State.groupColId=this.value; render(); });
    gwrap.appendChild(gsel);
    right.appendChild(gwrap);
  }
  if(State.viewType==='calendar'){
    var cwrap=el('label',{class:'view-groupby'});
    cwrap.appendChild(el('span',{text:'Date'}));
    var csel=el('select',{class:'select',attrs:{'aria-label':'Calendar date column'}});
    var dcols=dateColsList();
    if(!dcols.length) csel.appendChild(el('option',{value:'',text:'—'}));
    dcols.forEach(function(c){ var o=el('option',{value:c.id,text:c.name}); if(c.id===State.calendarColId) o.selected=true; csel.appendChild(o); });
    csel.value=State.calendarColId||'';
    csel.addEventListener('change',function(){ State.calendarColId=this.value; render(); });
    cwrap.appendChild(csel);
    right.appendChild(cwrap);
  }
  if(State.viewType==='gallery'){
    var iwrap=el('label',{class:'view-groupby'});
    iwrap.appendChild(el('span',{text:'Image'}));
    var isel=el('select',{class:'select',attrs:{'aria-label':'Gallery image column'}});
    var fcols=fileColsList();
    if(!fcols.length) isel.appendChild(el('option',{value:'',text:'—'}));
    else isel.appendChild(el('option',{value:'',text:'No image'}));
    fcols.forEach(function(c){ var o=el('option',{value:c.id,text:c.name}); if(c.id===State.galleryColId) o.selected=true; isel.appendChild(o); });
    isel.value=State.galleryColId||'';
    isel.addEventListener('change',function(){ State.galleryColId=this.value; render(); });
    iwrap.appendChild(isel);
    right.appendChild(iwrap);
  }
  if(State.viewType==='grid'){
    var grwrap=el('label',{class:'view-groupby'});
    grwrap.appendChild(el('span',{text:'Group by'}));
    var grsel=el('select',{class:'select',attrs:{'aria-label':'Group rows by column'}});
    grsel.appendChild(el('option',{value:'',text:'None'}));
    groupableCols().forEach(function(c){ var o=el('option',{value:c.id,text:c.name}); if(c.id===State.gridGroupColId) o.selected=true; grsel.appendChild(o); });
    grsel.value=State.gridGroupColId||'';
    grsel.addEventListener('change',function(){ State.gridGroupColId=this.value; State._collapsedGroups={}; State.page=1; render(); });
    grwrap.appendChild(grsel);
    right.appendChild(grwrap);
  }

  viewBar.appendChild(left);
  viewBar.appendChild(right);
}

/* ============================================================= *
 *  Rendering
 * ============================================================= */
/* Filtering + sorting scan every row, so we cache their result and only
   redo it when the data, search text, or sort actually change. Paging then
   just slices the cached array — so clicking next/prev or changing page size
   stays instant even with thousands of rows. invalidateView() drops the cache
   whenever rows or columns are mutated. */
function invalidateView(){ State._view=null; }

/* Shallow copy of own props (used to snapshot/restore row.values around an
   optimistic edit). */
function copyValues(src){
  var out={}; if(src){ for(var k in src){ if(Object.prototype.hasOwnProperty.call(src,k)) out[k]=src[k]; } }
  return out;
}

function currentView(){
  var cols=displayColumns(State.columns);
  var fsig=(State.filters&&State.filters.length)?JSON.stringify(State.filters):'';
  var sig=State.search+' | '+fsig+' | '+(State.sort.colId||'')+' '+State.sort.dir+' '+cols.length;
  if(!State._view || State._viewSig!==sig){
    var matched=applyFilters(State.rows,cols,State.filters);   /* advanced filters first … */
    var filtered=filterRows(matched,cols,State.search);        /* … then the search box narrows further */
    var sorted=sortRows(filtered,cols,State.sort);
    State._view={cols:cols, filtered:filtered, sorted:sorted};
    State._viewSig=sig;
  }
  var v=State._view;
  var pg=paginate(v.sorted,State.page,State.pageSize);
  return {cols:cols, filtered:v.filtered, sorted:v.sorted, pg:pg};
}

function render(){
  var hasCols=State.columns.length>0;
  var canEdit=canEditData();
  /* On an admin-managed table a member is view-only: the data-creating controls are
     disabled here and every mutating path (inline edit, delete, bulk, drag, panel
     edit) also checks canEditData() — all of it re-enforced on the server. */
  btnAddRow.disabled=!hasCols || !canEdit;
  btnImport.disabled=!hasCols || !canEdit;
  btnExport.disabled=!hasCols;
  if(btnFilter) btnFilter.disabled=!hasCols;
  if(btnColorRules) btnColorRules.disabled=!hasCols;
  btnTotal.disabled=!State.columns.some(function(c){return c.type==='price';});
  /* The Shift Schedule's ⋯ More menu drops Color rules + Import CSV — neither applies
     to a fixed roster. Toggling the hidden attribute (not CSS) also removes them from
     the menu's keyboard navigation, which filters on .hidden. */
  if(btnColorRules) btnColorRules.hidden=!!State.scheduleView;
  btnImport.hidden=!!State.scheduleView;
  if(readOnlyBadge) readOnlyBadge.hidden=canEdit;   /* "View only" chip shows only when the user can't edit this table */
  emptyNoColumns.hidden=hasCols;
  updateFilterBadge();
  updateColorBadge();
  renderViewBar();
  /* The Shift Schedule is a fixed roster, so its toolbar drops the everyday actions
     (search, Filter, Total, Export CSV, Add column, Add row) — but KEEPS the ⋯ More
     menu, which is the way to reach Settings (switch/manage tables), Access, Activity
     and Trash. Every other table keeps the full toolbar. */
  if(toolbarEl) toolbarEl.classList.toggle('toolbar-min', !!State.scheduleView);
  /* The roster container is only ever shown by the schedule branch below; hide it
     on every other render so it never lingers after switching to a normal table. */
  if(scheduleEl && !State.scheduleView){ scheduleEl.hidden=true; scheduleEl.innerHTML=''; }

  if(!hasCols){
    thead.innerHTML=''; tbody.innerHTML=''; colgroup.innerHTML='';
    pager.hidden=true; updateRowCount(0,0);
    if(kanbanEl){ kanbanEl.hidden=true; kanbanEl.innerHTML=''; }
    if(dashboardEl){ dashboardEl.hidden=true; dashboardEl.innerHTML=''; }
    if(calendarEl){ calendarEl.hidden=true; calendarEl.innerHTML=''; }
    if(galleryEl){ galleryEl.hidden=true; galleryEl.innerHTML=''; }
    if(tableScroll) tableScroll.hidden=false;
    clearSelection(); renderBulkBar();
    return;
  }
  var view=currentView();
  State.page=view.pg.page;
  pruneSelection();                                        // forget selections for rows that vanished
  // In grouped mode the grid shows every row (no paging), so "select all on page"
  // and bulk actions should span the whole filtered set, not just one page slice.
  var gGroupCol=activeGridGroupCol();
  State._pageIds=(gGroupCol ? view.sorted : view.pg.pageRows).map(function(r){ return r._id; });

  // Shift Schedule roster: the built-in schedule table always renders as a weekly
  // roster (green date bands, one line per person per day, per-day notes) no matter
  // what viewType the saved view carries — so this branch is checked FIRST, before
  // Grid/Kanban/Dashboard/Calendar/Gallery. Paging and row selection don't apply.
  if(State.scheduleView){
    if(tableScroll) tableScroll.hidden=true;
    if(kanbanEl){ kanbanEl.hidden=true; kanbanEl.innerHTML=''; }
    if(dashboardEl){ dashboardEl.hidden=true; dashboardEl.innerHTML=''; }
    if(calendarEl){ calendarEl.hidden=true; calendarEl.innerHTML=''; }
    if(galleryEl){ galleryEl.hidden=true; galleryEl.innerHTML=''; }
    if(scheduleEl) scheduleEl.hidden=false;
    pager.hidden=true;
    clearSelection();
    renderSchedule(view);
    renderBulkBar();
    updateRowCount(State.rows.length, view.filtered.length);
    return;
  }

  // Kanban layout: a board of lanes instead of the grid. Selection/paging don't
  // apply, so clear them and hide the table + pager.
  if(State.viewType==='kanban'){
    if(tableScroll) tableScroll.hidden=true;
    if(dashboardEl){ dashboardEl.hidden=true; dashboardEl.innerHTML=''; }
    if(calendarEl){ calendarEl.hidden=true; calendarEl.innerHTML=''; }
    if(galleryEl){ galleryEl.hidden=true; galleryEl.innerHTML=''; }
    if(kanbanEl) kanbanEl.hidden=false;
    pager.hidden=true;
    clearSelection();
    renderKanban(view);
    renderBulkBar();
    updateRowCount(State.rows.length, view.filtered.length);
    return;
  }

  // Dashboard layout: KPI tiles (counts + sums) and up to 3 user-chosen charts.
  // Like Kanban, paging and row selection don't apply, so hide the table + pager.
  if(State.viewType==='dashboard'){
    if(tableScroll) tableScroll.hidden=true;
    if(kanbanEl){ kanbanEl.hidden=true; kanbanEl.innerHTML=''; }
    if(calendarEl){ calendarEl.hidden=true; calendarEl.innerHTML=''; }
    if(galleryEl){ galleryEl.hidden=true; galleryEl.innerHTML=''; }
    if(dashboardEl) dashboardEl.hidden=false;
    pager.hidden=true;
    clearSelection();
    renderDashboard(view);
    renderBulkBar();
    updateRowCount(State.rows.length, view.filtered.length);
    return;
  }

  // Calendar layout: rows placed on a month grid by a chosen date column. Like
  // Kanban/Dashboard, paging and selection don't apply, so hide the table + pager.
  if(State.viewType==='calendar'){
    if(tableScroll) tableScroll.hidden=true;
    if(kanbanEl){ kanbanEl.hidden=true; kanbanEl.innerHTML=''; }
    if(dashboardEl){ dashboardEl.hidden=true; dashboardEl.innerHTML=''; }
    if(galleryEl){ galleryEl.hidden=true; galleryEl.innerHTML=''; }
    if(calendarEl) calendarEl.hidden=false;
    pager.hidden=true;
    clearSelection();
    renderCalendar(view);
    renderBulkBar();
    updateRowCount(State.rows.length, view.filtered.length);
    return;
  }

  // Gallery layout: a responsive card grid, each card led by an image drawn from a
  // chosen Attachment column. Like the other non-grid views, paging and selection
  // don't apply, so hide the table + pager. Clicking a card opens the side-panel.
  if(State.viewType==='gallery'){
    if(tableScroll) tableScroll.hidden=true;
    if(kanbanEl){ kanbanEl.hidden=true; kanbanEl.innerHTML=''; }
    if(dashboardEl){ dashboardEl.hidden=true; dashboardEl.innerHTML=''; }
    if(calendarEl){ calendarEl.hidden=true; calendarEl.innerHTML=''; }
    if(galleryEl) galleryEl.hidden=false;
    pager.hidden=true;
    clearSelection();
    renderGallery(view);
    renderBulkBar();
    updateRowCount(State.rows.length, view.filtered.length);
    return;
  }

  if(tableScroll) tableScroll.hidden=false;
  if(kanbanEl){ kanbanEl.hidden=true; kanbanEl.innerHTML=''; }
  if(dashboardEl){ dashboardEl.hidden=true; dashboardEl.innerHTML=''; }
  if(calendarEl){ calendarEl.hidden=true; calendarEl.innerHTML=''; }
  if(galleryEl){ galleryEl.hidden=true; galleryEl.innerHTML=''; }
  renderColgroup(view.cols);
  renderHead(view.cols);
  if(gGroupCol){
    // Grouped grid: render every row in collapsible sections; paging is off.
    pager.hidden=true;
    renderBodyGrouped(view.cols, view.sorted, gGroupCol);
  } else {
    renderBody(view.cols, view.pg.pageRows);
    renderPager(view);
  }
  syncHeaderCheck();
  renderBulkBar();
  updateRowCount(State.rows.length, view.filtered.length);
}

function renderColgroup(cols){
  var frag=document.createDocumentFragment();
  var csel=el('col',{class:'col-select'}); csel.style.width='40px'; frag.appendChild(csel);
  cols.forEach(function(col){
    var c=el('col'); c.setAttribute('data-col',col.id); c.style.width=getColWidth(col.id)+'px';
    frag.appendChild(c);
  });
  var ca=el('col'); ca.style.width='92px'; frag.appendChild(ca);
  colgroup.innerHTML=''; colgroup.appendChild(frag);
}

function renderHead(cols){
  thead.innerHTML='';
  var tr=el('tr');

  // Leading selection column: a "select all on this page" checkbox (edit-only —
  // view-only members have nothing to bulk-act on, so the box is omitted).
  var thSel=el('th',{class:'th-select'});
  if(canEditData()){
    var selAll=el('input',{type:'checkbox',class:'sel-all',attrs:{'aria-label':'Select all rows on this page'}});
    selAll.addEventListener('change',function(){ toggleAllOnPage(selAll.checked); });
    thSel.appendChild(el('div',{class:'th-inner'},[selAll]));
  } else {
    thSel.appendChild(el('div',{class:'th-inner'},[]));
  }
  tr.appendChild(thSel);

  cols.forEach(function(col){
    var th=el('th'); th.setAttribute('data-col-id',col.id);
    var sorted=State.sort.colId===col.id;
    if(sorted) th.classList.add('sorted');

    var label=el('button',{class:'th-label',type:'button',title:'Sort · '+col.type,onclick:function(){ toggleSort(col.id); }},[
      el('span',{class:'th-name',text:col.name}),
      el('span',{class:'sort-ind',text: sorted?(State.sort.dir===1?'▲':'▼'):'▲'})
    ]);
    var admin=!!(State.me && State.me.isAdmin);
    var grip = admin ? el('span',{class:'resize-grip',title:'Drag to resize'}) : null;

    if(col.system){
      // Read-only system column: sortable for everyone; resizable for admins only.
      th.classList.add('th-system');
      th.appendChild(el('div',{class:'th-inner'},[label]));
      if(grip){ th.appendChild(grip); wireColumnResize(grip,col); }
    } else if(admin){
      var dragDot=el('span',{class:'drag-dot',text:'⋮⋮',title:'Drag to reorder',draggable:true});
      var menu=el('button',{class:'col-menu',type:'button',title:'Edit column','aria-label':'Edit column '+col.name,text:'⋯',onclick:function(e){ if(e&&e.stopPropagation)e.stopPropagation(); openColumnModal('edit',col); }});
      th.appendChild(el('div',{class:'th-inner'},[dragDot,label,menu]));
      th.appendChild(grip);
      wireColumnDrag(th,dragDot,col);
      wireColumnResize(grip,col);
    } else {
      // Member: header is sort-only — no reorder handle, edit menu, or resize grip.
      th.appendChild(el('div',{class:'th-inner'},[label]));
    }
    tr.appendChild(th);
  });
  var thA=el('th',{class:'th-actions'});
  thA.appendChild(el('div',{class:'th-inner'},[el('span',{text:'Actions'})]));
  tr.appendChild(thA);
  thead.appendChild(tr);
}

function buildCellInner(row,col){
  var v=row.values[col.id];
  if(col.type==='link'){
    var ids=parseLinkIds(v);
    if(!ids.length) return el('span',{class:'cell empty-cell',text:'—'});
    var wrap=el('span',{class:'cell cell-links'});
    ids.forEach(function(id){ wrap.appendChild(el('span',{class:'link-chip',text:linkLabel(col,id)})); });
    return wrap;
  }
  if(col.type==='file'){
    var files=parseFiles(v);
    if(!files.length) return el('span',{class:'cell empty-cell',text:'—'});
    var fwrap=el('span',{class:'cell cell-files'});
    files.forEach(function(f){
      var a=el('a',{class:'file-chip',href:f.url,target:'_blank',rel:'noopener',title:f.name});
      a.appendChild(el('span',{class:'file-chip-ico','aria-hidden':'true',text:'📎'}));
      a.appendChild(el('span',{class:'file-chip-name',text:f.name}));
      /* opening the file shouldn't also open the row editor */
      a.addEventListener('click',function(e){ e.stopPropagation(); });
      fwrap.appendChild(a);
    });
    return fwrap;
  }
  if(col.type==='dropdown' && !isBlank(v)){
    return el('span',{class:'cell'},[el('span',{class:'cell-badge',text:String(v)})]);
  }
  var disp=formatCellValue(v,col.type);
  if(disp==='') return el('span',{class:'cell empty-cell',text:'—'});
  var cls='cell';
  if(col.type==='number'||col.type==='price') cls+=' num';
  if(col.system) cls+=' sys';
  return el('span',{class:cls,text:disp});
}
function renderCellTd(td,row,col){ td.innerHTML=''; td.appendChild(buildCellInner(row,col)); }

function renderBody(cols,pageRows){
  if(pageRows.length===0){
    tbody.innerHTML='';
    var searching=!!State.search.trim();
    var filtering=(State.filters||[]).some(function(f){
      var col=null; for(var i=0;i<cols.length;i++){ if(cols[i].id===f.colId){ col=cols[i]; break; } }
      return isFilterActive(f,col);
    });
    var narrowed=searching||filtering;
    var td=el('td',{attrs:{colspan:String(cols.length+2)}});
    td.style.textAlign='center'; td.style.color='var(--muted)'; td.style.padding='30px';
    var msg = !narrowed ? 'No rows yet.'
            : (filtering && searching) ? 'No rows match your filters and search.'
            : filtering ? 'No rows match your filters.'
            : 'No rows match your search.';
    var kids=[el('div',{text: msg})];
    if(!narrowed && canEditData()) kids.push(el('button',{class:'btn btn-primary',type:'button',text:'Add row',style:'margin-top:12px;',onclick:function(){openRowModal('add');}}));
    else if(filtering) kids.push(el('button',{class:'btn btn-secondary',type:'button',text:'Edit filters',style:'margin-top:12px;',onclick:openFilterModal}));
    td.appendChild(el('div',{},kids));
    var tr=el('tr',{class:'is-placeholder'}); tr.appendChild(td); tbody.appendChild(tr);
    return;
  }
  var frag=document.createDocumentFragment();
  var byId=colorRuleColMap(cols);
  pageRows.forEach(function(row){ frag.appendChild(buildRowTr(row,cols,byId)); });
  tbody.innerHTML=''; tbody.appendChild(frag);
}

/* Build one data-row <tr> (checkbox + cells + row actions), shared by the flat
   grid and the grouped grid so both stay identical in look and behavior. An
   optional `byId` (column-id → column map) lets callers that build many rows in a
   loop compute the map once instead of once per row (see renderBody). */
function buildRowTr(row,cols,byId){
  var tr=el('tr'); tr.setAttribute('data-row-id',row._id);
  if(State.selected[row._id]) tr.classList.add('is-selected');
  var cf=rowColorStyle(row,cols,State.colorRules,byId); if(cf) tr.classList.add('cf-row','cf-'+cf);
  var canEdit=canEditData();

  // Leading selection checkbox — only when the user can edit (selection drives the
  // bulk delete / set-field actions). View-only members get an empty cell so the
  // column count still lines up with the header.
  var tdC=el('td',{class:'td-select',attrs:{'data-label':'Select'}});
  if(canEdit){
    var cb=el('input',{type:'checkbox',class:'row-check',attrs:{'aria-label':'Select this row'}});
    cb.checked=!!State.selected[row._id];
    cb.addEventListener('click',function(e){ e.stopPropagation(); });
    cb.addEventListener('change',function(){ toggleRow(row._id, cb.checked); });
    tdC.appendChild(cb);
  }
  tr.appendChild(tdC);

  cols.forEach(function(col){
    // data-label drives the column name shown beside each value in mobile card view.
    if(col.system){
      var tdS=el('td',{class:'td-system',attrs:{'data-label':col.name}});
      tdS.appendChild(buildCellInner(row,col));
      tr.appendChild(tdS);
      return;
    }
    var td=el('td',{class:'td-readonly',attrs:{'data-label':col.name}});
    td.appendChild(buildCellInner(row,col));
    tr.appendChild(td);
  });
  var tdA=el('td',{class:'td-actions'});
  // "Open record" (view) is always available; Edit + Delete only when the user can
  // edit — on an admin-managed table members get a read-only Open-record panel.
  var actions=[el('button',{class:'icon-btn',type:'button',title:'Open record','aria-label':'Open record',html:ICON.expand,onclick:function(e){e.stopPropagation();openRecordPanel(row._id);}})];
  if(canEdit){
    actions.push(el('button',{class:'icon-btn',type:'button',title:'Edit row','aria-label':'Edit row',html:ICON.edit,onclick:function(e){e.stopPropagation();openRowModal('edit',row);}}));
    actions.push(el('button',{class:'icon-btn danger',type:'button',title:'Delete row','aria-label':'Delete row',html:ICON.trash,onclick:function(e){e.stopPropagation();openDeleteRowModal(row);}}));
  }
  tdA.appendChild(el('div',{class:'row-actions'},actions));
  tr.appendChild(tdA);
  return tr;
}

/* Replace a single row's <tr> in place with a freshly-built one, so an optimistic
   edit shows immediately without rebuilding the whole grid. Returns true if it
   patched; false when a full render is required instead — i.e. we're not in the
   flat grid (kanban/dashboard/calendar), the grid is grouped (subtotals/sections
   could shift), or the row isn't on the current page. Callers do: if(!patchRowTr(r)) render(); */
function patchRowTr(row){
  if(!row || !tbody) return false;
  if(State.viewType!=='grid' || activeGridGroupCol()) return false;
  var kids=tbody.children, tr=null;
  for(var i=0;i<kids.length;i++){
    if(kids[i].getAttribute && kids[i].getAttribute('data-row-id')===String(row._id)){ tr=kids[i]; break; }
  }
  if(!tr || !tr.parentNode) return false;
  var cols=displayColumns(State.columns);
  tr.parentNode.replaceChild(buildRowTr(row, cols, colorRuleColMap(cols)), tr);
  return true;
}

/* The column the grid is currently grouped by, or null. Grid grouping only
   applies in the grid layout and only to a still-present, groupable column. */
function activeGridGroupCol(){
  if(State.viewType!=='grid' || !State.gridGroupColId) return null;
  var col=null; State.columns.forEach(function(c){ if(c.id===State.gridGroupColId) col=c; });
  return (col && isGroupableCol(col)) ? col : null;
}

/* Grouped grid body: rows partitioned into collapsible sections by the group
   column's value, each with a header (label + count + per-numeric-column
   subtotals). Renders every row (paging is off in grouped mode, like the other
   non-flat layouts) so a group is never split across pages. */
function renderBodyGrouped(cols, rows, groupCol){
  if(!rows.length){ renderBody(cols, rows); return; }        // reuse the flat empty-state
  var groups=groupRowsBy(rows, groupCol);
  var totalCols=cols.length+2;                               // select col + data cols + actions col
  var subCols=cols.filter(function(c){ return !c.system && (c.type==='price'||c.type==='number') && c.id!==groupCol.id; });
  var frag=document.createDocumentFragment();
  var byId=colorRuleColMap(cols);
  groups.forEach(function(g){
    var collapsed=!!State._collapsedGroups[g.key];
    frag.appendChild(buildGroupHeaderTr(g, collapsed, totalCols, subCols));
    if(!collapsed){ g.rows.forEach(function(row){ frag.appendChild(buildRowTr(row,cols,byId)); }); }
  });
  tbody.innerHTML=''; tbody.appendChild(frag);
}

/* A full-width group header row: a collapse toggle (caret + label + count) on the
   left, and right-aligned subtotal chips for each numeric/price column. */
function buildGroupHeaderTr(g, collapsed, totalCols, subCols){
  var tr=el('tr',{class:'group-row'+(collapsed?' is-collapsed':'')});
  var td=el('td',{class:'group-cell',attrs:{colspan:String(totalCols)}});
  var head=el('div',{class:'group-head'});
  var n=g.rows.length;
  var btn=el('button',{class:'group-toggle',type:'button',attrs:{'aria-expanded':String(!collapsed),title:(collapsed?'Expand group':'Collapse group')}});
  btn.appendChild(el('span',{class:'group-caret',attrs:{'aria-hidden':'true'},text:'▸'}));
  btn.appendChild(el('span',{class:'group-name',text:g.label,attrs:{title:g.label}}));
  btn.appendChild(el('span',{class:'group-count',text:n+(n===1?' record':' records')}));
  btn.addEventListener('click',function(){ toggleGroup(g.key); });
  head.appendChild(btn);
  if(subCols.length){
    var subs=el('div',{class:'group-subtotals'});
    subCols.forEach(function(c){
      var sum=sumNumbers(g.rows.map(function(r){ return r.values[c.id]; }));
      var disp=c.type==='price'?formatCellValue(sum,'price'):fmtNum(sum);
      subs.appendChild(el('span',{class:'group-sub'},[
        el('span',{class:'group-sub-label',text:c.name}),
        el('span',{class:'group-sub-val',text:disp,attrs:{title:disp}})
      ]));
    });
    head.appendChild(subs);
  }
  td.appendChild(head);
  tr.appendChild(td);
  return tr;
}

/* Collapse/expand one group. State._collapsedGroups is ephemeral (never saved to
   a view) and keyed by the group's value, so it survives re-render but resets on
   view/table switch. */
function toggleGroup(key){
  if(State._collapsedGroups[key]) delete State._collapsedGroups[key];
  else State._collapsedGroups[key]=true;
  render();
}

/* ============================================================= *
 *  Kanban board
 *  A saved-view layout: cards grouped into lanes by a dropdown column's options,
 *  plus an "Uncategorized" lane for blank/unknown values. Dragging a card to
 *  another lane writes that option back to the row's group column (apiUpdateCell),
 *  with an optimistic update + rollback on failure. Cards read from the same
 *  filtered/sorted view the grid uses, so search + filters still apply.
 * ============================================================= */
function renderKanban(view){
  if(!kanbanEl) return;
  kanbanEl.innerHTML='';
  var col=null; for(var i=0;i<State.columns.length;i++){ if(State.columns[i].id===State.groupColId){ col=State.columns[i]; break; } }
  if(!col || col.type!=='dropdown'){
    var hasDrop=dropdownCols().length>0;
    kanbanEl.appendChild(el('div',{class:'kanban-hint'},[
      el('div',{class:'kanban-hint-art',attrs:{'aria-hidden':'true'},text:'▤'}),
      el('h2',{text:'Group cards into lanes'}),
      el('p',{text: hasDrop ? 'Choose a “Group by” column above — pick one of your dropdown columns to see its options as lanes.'
                            : 'Kanban groups cards by a dropdown column. Add a dropdown column first, then pick it in “Group by”.'})
    ]));
    return;
  }
  /* the first non-group Price/Number column drives each lane's total (pipeline value) */
  var amountCol=null, dcols=displayColumns(State.columns);
  for(var a=0;a<dcols.length;a++){ var dc=dcols[a]; if(!dc.system && dc.id!==col.id && (dc.type==='price'||dc.type==='number')){ amountCol=dc; break; } }

  var lanes=(col.options||[]).slice();
  var byLane={}; lanes.forEach(function(o){ byLane[String(o)]=[]; });
  var uncat=[];
  view.sorted.forEach(function(r){
    var v=r.values[col.id];
    if(!isBlank(v) && Object.prototype.hasOwnProperty.call(byLane,String(v))) byLane[String(v)].push(r);
    else uncat.push(r);
  });
  var board=el('div',{class:'kanban-board'});
  lanes.forEach(function(o,idx){ board.appendChild(kanbanLane(String(o), String(o), byLane[String(o)], col, false, CHART_PALETTE[idx%CHART_PALETTE.length], amountCol)); });
  board.appendChild(kanbanLane('Uncategorized', '', uncat, col, true, '', amountCol));
  kanbanEl.appendChild(board);
}
function kanbanLane(title, laneValue, rows, groupCol, isUncat, accent, amountCol){
  var lane=el('div',{class:'kanban-lane'+(isUncat?' is-uncat':'')});
  if(accent) lane.style.setProperty('--lane', accent);
  var headKids=[
    el('div',{class:'kanban-lane-head-row'},[
      el('span',{class:'kanban-lane-dot',attrs:{'aria-hidden':'true'}}),
      el('span',{class:'kanban-lane-title',text:title,attrs:{title:title}}),
      el('span',{class:'kanban-lane-count',text:String(rows.length)})
    ])
  ];
  if(amountCol){
    var sum=sumNumbers(rows.map(function(r){ return r.values[amountCol.id]; }));
    var disp=amountCol.type==='price'?formatCellValue(sum,'price'):fmtNum(sum);
    headKids.push(el('div',{class:'kanban-lane-total'},[
      el('span',{class:'kanban-total-label',text:amountCol.name}),
      el('span',{class:'kanban-total-val',text:disp,attrs:{title:disp}})
    ]));
  }
  lane.appendChild(el('div',{class:'kanban-lane-head'},headKids));

  var list=el('div',{class:'kanban-cards'});
  if(rows.length){ rows.forEach(function(r){ list.appendChild(kanbanCard(r, groupCol)); }); }
  else { list.appendChild(el('div',{class:'kanban-empty',text:'No cards'})); }
  lane.appendChild(list);

  /* quick-add: opens the add-row modal pre-set to this lane's group value (edit-only) */
  if(canEditData()){
    var add=el('button',{class:'kanban-add',type:'button',
      attrs:{'aria-label':'Add a card to '+title}},[
      el('span',{class:'kanban-add-ico',attrs:{'aria-hidden':'true'},text:'+'}),
      el('span',{text:'Add'})
    ]);
    add.addEventListener('click',function(e){
      e.stopPropagation();
      var seed=null; if(laneValue){ seed={}; seed[groupCol.id]=laneValue; }
      openRowModal('add', null, seed);
    });
    lane.appendChild(add);
  }

  wireLaneDrop(lane, list, groupCol, laneValue);
  return lane;
}
function kanbanCard(row, groupCol){
  var canEdit=canEditData();
  var card=el('div',{class:'kanban-card',attrs:{draggable: canEdit?'true':'false','data-row-id':row._id}});
  var cols=displayColumns(State.columns).filter(function(c){ return !c.system && c.id!==groupCol.id; });
  function cellText(c){
    var v=row.values[c.id];
    if(c.type==='link') return parseLinkIds(v).map(function(id){ return linkLabel(c,id); }).join(', ');
    return formatCellValue(v,c.type);
  }
  var title=cols.length ? cellText(cols[0]) : '';
  card.appendChild(el('div',{class:'kanban-card-title',text: title || '(untitled)'}));

  /* up to three more columns: dropdowns become tag chips, the rest become label/value rows */
  var fields=[], tags=[];
  cols.slice(1,4).forEach(function(c){
    var disp=cellText(c);
    if(disp==='') return;
    if(c.type==='dropdown') tags.push(disp);
    else fields.push({name:c.name, val:disp});
  });
  if(fields.length){
    var fwrap=el('div',{class:'kanban-card-fields'});
    fields.forEach(function(f){
      fwrap.appendChild(el('div',{class:'kanban-field'},[
        el('span',{class:'kanban-field-label',text:f.name}),
        el('span',{class:'kanban-field-val',text:f.val,attrs:{title:f.val}})
      ]));
    });
    card.appendChild(fwrap);
  }
  if(tags.length){
    var twrap=el('div',{class:'kanban-tags'});
    tags.forEach(function(t){ twrap.appendChild(el('span',{class:'kanban-tag',text:t,attrs:{title:t}})); });
    card.appendChild(twrap);
  }

  card.addEventListener('dragstart',function(e){
    if(!canEdit){ try{e.preventDefault();}catch(_){} return; }   /* view-only: cards don't move */
    State._kdrag=row._id; card.classList.add('dragging');
    try{ e.dataTransfer.setData('text/plain',row._id); e.dataTransfer.effectAllowed='move'; }catch(_){}
  });
  card.addEventListener('dragend',function(){ State._kdrag=null; card.classList.remove('dragging'); clearLaneHover(); });
  // A plain click (not a drag) opens the row: editable modal when the user can edit,
  // otherwise the read-only record panel.
  card.addEventListener('click',function(){
    if(card.classList.contains('dragging')) return;
    if(canEdit) openRowModal('edit',row); else openRecordPanel(row._id);
  });
  return card;
}
function clearLaneHover(){
  if(!kanbanEl) return;
  Array.prototype.forEach.call(kanbanEl.querySelectorAll('.kanban-lane.drop-hover'),function(l){ l.classList.remove('drop-hover'); });
}
function wireLaneDrop(lane, list, groupCol, laneValue){
  lane.addEventListener('dragover',function(e){ e.preventDefault(); try{ e.dataTransfer.dropEffect='move'; }catch(_){} lane.classList.add('drop-hover'); });
  lane.addEventListener('dragleave',function(e){ if(!lane.contains(e.relatedTarget)) lane.classList.remove('drop-hover'); });
  lane.addEventListener('drop',function(e){
    e.preventDefault(); lane.classList.remove('drop-hover');
    var id=State._kdrag || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
    if(id) moveCardToLane(id, groupCol, laneValue);
  });
}
function moveCardToLane(rowId, col, laneValue){
  if(!ensureCanEdit()) return;                 /* server also enforces via requireTableWrite_ */
  var row=rowById(rowId); if(!row) return;
  var prev=row.values[col.id];
  var next=laneValue||'';
  if(String(prev)===String(next)) return;
  row.values[col.id]=next; invalidateView(); render();   // optimistic
  callServer('apiUpdateCell',[State.tableId,rowId,col.id,next]).then(function(){
    toast(next ? ('Moved to “'+next+'”') : 'Moved to Uncategorized');
  }).catch(function(e){
    row.values[col.id]=prev; invalidateView(); render(); showError(e);
  });
}

/* ============================================================= *
 *  Dashboard view
 *  A third layout (alongside Grid and Kanban): headline KPI tiles
 *  (row count + sum/avg of each Price/Number column) plus up to 3
 *  charts, where the user chooses the column AND the chart type for
 *  each. All aggregation runs over the *current view's* rows, so
 *  filters + search narrow the dashboard exactly like the grid.
 *  Charts are drawn as inline SVG — no external/CDN dependency, which
 *  keeps this served GAS app self-contained and org-safe.
 * ============================================================= */

/* ---- pure aggregation (no State/DOM; exported for tests) ---- */
function fmtNum(n){
  n=+n; if(isNaN(n)) return '0';
  var r=Math.round(n*100)/100;
  return r.toLocaleString('en-US',{maximumFractionDigits:2});
}
function sumNumbers(nums){
  var t=0; for(var i=0;i<nums.length;i++){ var n=+nums[i]; if(!isNaN(n)) t+=n; }
  return t;
}
function avgNumbers(nums){
  var vals=[]; for(var i=0;i<nums.length;i++){ var n=+nums[i]; if(!isNaN(n)) vals.push(n); }
  if(!vals.length) return 0;
  return sumNumbers(vals)/vals.length;
}
/* Smallest / largest finite value; 0 for an empty set (blanks/NaN ignored). */
function minNumbers(nums){
  var m=null; for(var i=0;i<nums.length;i++){ var n=+nums[i]; if(!isNaN(n) && (m===null || n<m)) m=n; }
  return m===null ? 0 : m;
}
function maxNumbers(nums){
  var m=null; for(var i=0;i<nums.length;i++){ var n=+nums[i]; if(!isNaN(n) && (m===null || n>m)) m=n; }
  return m===null ? 0 : m;
}
/* Median of the finite values — mean of the two middles for an even count. */
function medianNumbers(nums){
  var vals=[]; for(var i=0;i<nums.length;i++){ var n=+nums[i]; if(!isNaN(n)) vals.push(n); }
  if(!vals.length) return 0;
  vals.sort(function(a,b){ return a-b; });
  var mid=Math.floor(vals.length/2);
  return (vals.length%2) ? vals[mid] : (vals[mid-1]+vals[mid])/2;
}
/* Count occurrences of each distinct label, return the top N by count
   (ties broken by first-seen order), folding the remainder into "Other". */
function tallyCategories(values, topN){
  topN = topN || 12;
  var counts={}, order=[];
  for(var i=0;i<values.length;i++){
    var k=String(values[i]);
    if(k==='') continue;
    if(!Object.prototype.hasOwnProperty.call(counts,k)){ counts[k]=0; order.push(k); }
    counts[k]++;
  }
  var arr=order.map(function(k,idx){ return {label:k, count:counts[k], idx:idx}; });
  arr.sort(function(a,b){ return (b.count-a.count) || (a.idx-b.idx); });
  var labels=[], nums=[];
  if(arr.length>topN){
    var head=arr.slice(0,topN-1), tail=arr.slice(topN-1);
    head.forEach(function(o){ labels.push(o.label); nums.push(o.count); });
    var other=0; tail.forEach(function(o){ other+=o.count; });
    labels.push('Other ('+tail.length+')'); nums.push(other);
  } else {
    arr.forEach(function(o){ labels.push(o.label); nums.push(o.count); });
  }
  return {labels:labels, counts:nums};
}
/* Histogram of numeric values into `bins` equal-width buckets across [min,max].
   All-equal values collapse to one bucket; blanks/NaN are ignored. */
function bucketNumbers(nums, bins){
  bins = bins || 8;
  var vals=[]; for(var i=0;i<nums.length;i++){ var n=+nums[i]; if(!isNaN(n)) vals.push(n); }
  if(!vals.length) return {labels:[], counts:[]};
  var min=Math.min.apply(null,vals), max=Math.max.apply(null,vals);
  if(min===max) return {labels:[fmtNum(min)], counts:[vals.length]};
  var width=(max-min)/bins;
  var labels=[], counts=[];
  for(var b=0;b<bins;b++){
    var lo=min+width*b, hi=(b===bins-1)?max:min+width*(b+1);
    labels.push(fmtNum(lo)+'–'+fmtNum(hi));
    counts.push(0);
  }
  for(var j=0;j<vals.length;j++){
    var idx=Math.floor((vals[j]-min)/width);
    if(idx<0) idx=0; if(idx>=bins) idx=bins-1;
    counts[idx]++;
  }
  return {labels:labels, counts:counts};
}
/* Count rows per calendar day (YYYY-MM-DD), sorted ascending. */
function tallyByDay(dateStrings){
  var counts={}, keys=[];
  for(var i=0;i<dateStrings.length;i++){
    var s=String(dateStrings[i]==null?'':dateStrings[i]); var m=s.match(/^\d{4}-\d{2}-\d{2}/);
    if(!m) continue; var k=m[0];
    if(!Object.prototype.hasOwnProperty.call(counts,k)){ counts[k]=0; keys.push(k); }
    counts[k]++;
  }
  keys.sort();
  return {labels:keys, counts:keys.map(function(k){ return counts[k]; })};
}

/* ---- turn a column + rows into {labels,counts} for charting ---- */
function chartDataFor(col, rows){
  var type=col.type, i;
  if(type==='price'||type==='number'){
    var nums=[]; for(i=0;i<rows.length;i++){ var n=parseFloat(rows[i].values[col.id]); if(!isNaN(n)) nums.push(n); }
    return bucketNumbers(nums, 8);
  }
  if(type==='date'||type==='datetime'){
    var ds=[]; for(i=0;i<rows.length;i++){ ds.push(rows[i].values[col.id]); }
    return tallyByDay(ds);
  }
  var vals=[];
  for(i=0;i<rows.length;i++){
    var v=rows[i].values[col.id];
    if(type==='link'){ parseLinkIds(v).forEach(function(id){ vals.push(linkLabel(col,id)); }); }
    else { var disp=formatCellValue(v,type); vals.push(disp===''?'(blank)':disp); }
  }
  return tallyCategories(vals, 12);
}
function chartCaption(col){
  if(col.type==='price'||col.type==='number') return 'Distribution of '+col.name;
  if(col.type==='date'||col.type==='datetime') return 'Rows by '+col.name+' (per day)';
  return 'Rows by '+col.name;
}

/* ---- inline SVG chart primitives ---- */
/* Harmonized categorical palette — cool, mid-value jewel hues anchored on the
   app's iris-blue accent (#3B54D6) so charts sit inside the cool identity
   instead of fighting it. Ordered so the first few (the ones most charts use)
   lead with the accent, then a teal/violet/emerald/rose/blue progression, with
   one muted amber + slate for categorical separation. Mid-value so they stay
   legible on both the light canvas and dark theme. */
var CHART_PALETTE=['#3B54D6','#2C93A6','#7C5CD3','#2E9E6B','#D06089','#4F7BD1','#C58A3C','#6B7688'];
function svgEl(tag, attrs){
  var e=document.createElementNS('http://www.w3.org/2000/svg', tag);
  if(attrs) for(var k in attrs){ if(Object.prototype.hasOwnProperty.call(attrs,k)) e.setAttribute(k, attrs[k]); }
  return e;
}
function truncLabel(s,max){ s=String(s); return s.length>max ? s.slice(0,max-1)+'…' : s; }
function emptyChart(msg){ return el('div',{class:'chart-empty',text: msg||'No data to chart yet.'}); }
function svgText(x,y,cls,str,extra){
  var a={x:x, y:y, class:cls}, title=null;
  if(extra) for(var k in extra){ if(k==='title'){ title=extra[k]; } else { a[k]=extra[k]; } }
  var t=svgEl('text',a); t.textContent=str;
  /* an SVG <title> child gives a native hover tooltip — the full, untruncated text */
  if(title!=null && String(title)!=='' && String(title)!==String(str)){ var ti=svgEl('title'); ti.textContent=String(title); t.appendChild(ti); }
  return t;
}
/* Horizontal bars. The category name sits on its own full-width line above each
   bar so long row names stay fully readable (rather than being squeezed into a
   narrow left gutter); a <title> gives the exact text on hover as a fallback. */
function barChartSVG(data){
  var labels=data.labels, counts=data.counts, n=labels.length;
  if(!n) return emptyChart();
  var max=Math.max.apply(null,counts)||1;
  var padL=10, padR=12, top=10, labelH=17, barH=16, gap=16, valW=46;
  var itemH=labelH+barH;
  var W=520, H=top*2 + n*itemH + (n-1)*gap;
  var barArea=W - padL - padR - valW;
  var gridBottom=H-top;
  var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H, class:'chart-svg', preserveAspectRatio:'xMinYMin meet', role:'img'});
  /* faint vertical gridlines (quarters) give scale context behind the bars;
     the leftmost is the baseline axis. Drawn first so bars sit on top. */
  var ticks=4;
  for(var g=0; g<=ticks; g++){
    var gx=padL + barArea*g/ticks;
    svg.appendChild(svgEl('line',{x1:gx, y1:top, x2:gx, y2:gridBottom, class:(g===0?'chart-axis':'chart-grid')}));
  }
  for(var i=0;i<n;i++){
    var yTop=top + i*(itemH+gap);
    var color=CHART_PALETTE[i%CHART_PALETTE.length];
    /* full-width name line (truncates only for extreme lengths; hover shows all) */
    svg.appendChild(svgText(padL, yTop+labelH-5, 'chart-lbl', truncLabel(labels[i],72), {'title':labels[i]}));
    var by=yTop+labelH;
    var w=Math.max(2, Math.round(barArea*counts[i]/max));
    svg.appendChild(svgEl('rect',{x:padL, y:by, width:w, height:barH, rx:4, fill:color}));
    svg.appendChild(svgText(padL+w+6, by+barH/2, 'chart-val', String(counts[i]), {'dominant-baseline':'central'}));
  }
  return svg;
}
/* Line chart — best for a date/day series or an ordered distribution. */
function lineChartSVG(data){
  var labels=data.labels, counts=data.counts, n=labels.length;
  if(!n) return emptyChart();
  if(n===1) return barChartSVG(data);
  var W=520, H=240, padL=34, padR=14, padT=14, padB=46;
  var max=Math.max.apply(null,counts)||1;
  var innerW=W-padL-padR, innerH=H-padT-padB;
  function X(i){ return padL + innerW*(i/(n-1)); }
  function Y(v){ return padT + innerH*(1 - v/max); }
  var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H, class:'chart-svg', preserveAspectRatio:'xMinYMin meet', role:'img'});
  /* horizontal gridlines + y-axis scale (quarter steps, integer labels, deduped
     so a small max doesn't repeat "0,0,1,1"); g===0 doubles as the baseline. */
  var ticks=4, seen={};
  for(var g=0; g<=ticks; g++){
    var gv=max*g/ticks, gy=Y(gv);
    svg.appendChild(svgEl('line',{x1:padL, y1:gy, x2:padL+innerW, y2:gy, class:(g===0?'chart-axis':'chart-grid')}));
    var lbl=String(Math.round(gv));
    if(!Object.prototype.hasOwnProperty.call(seen,lbl)){ seen[lbl]=1; svg.appendChild(svgText(padL-6, gy, 'chart-lbl', lbl, {'text-anchor':'end','dominant-baseline':'central'})); }
  }
  svg.appendChild(svgEl('line',{x1:padL,y1:padT,x2:padL,y2:padT+innerH, class:'chart-axis'}));
  /* soft area fill under the line for weight (colour via palette, opacity via CSS) */
  var pts=[]; for(var i=0;i<n;i++){ pts.push(X(i)+','+Y(counts[i])); }
  svg.appendChild(svgEl('path',{d:'M'+padL+','+(padT+innerH)+' L'+pts.join(' L')+' L'+(padL+innerW)+','+(padT+innerH)+' Z', class:'chart-area', fill:CHART_PALETTE[0]}));
  svg.appendChild(svgEl('polyline',{points:pts.join(' '), fill:'none', stroke:CHART_PALETTE[0], 'stroke-width':2.5, 'stroke-linejoin':'round', 'stroke-linecap':'round'}));
  var step=Math.ceil(n/6);
  for(var j=0;j<n;j++){
    svg.appendChild(svgEl('circle',{cx:X(j), cy:Y(counts[j]), r:3, fill:CHART_PALETTE[0]}));
    if(j%step===0 || j===n-1){
      svg.appendChild(svgText(X(j), padT+innerH+16, 'chart-lbl', truncLabel(labels[j],10), {'text-anchor':'middle','title':labels[j]}));
    }
  }
  return svg;
}
function arcPath(cx,cy,r,ir,a1,a2){
  var large=(a2-a1)>Math.PI?1:0;
  var x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
  var x2=cx+r*Math.cos(a2), y2=cy+r*Math.sin(a2);
  if(ir>0){
    var xi2=cx+ir*Math.cos(a2), yi2=cy+ir*Math.sin(a2);
    var xi1=cx+ir*Math.cos(a1), yi1=cy+ir*Math.sin(a1);
    return 'M'+x1+' '+y1+' A'+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+
           ' L'+xi2+' '+yi2+' A'+ir+' '+ir+' 0 '+large+' 0 '+xi1+' '+yi1+' Z';
  }
  return 'M'+cx+' '+cy+' L'+x1+' '+y1+' A'+r+' '+r+' 0 '+large+' 1 '+x2+' '+y2+' Z';
}
/* Pie / donut with a legend (share % per slice). */
function pieChartSVG(data, donut){
  var labels=data.labels, counts=data.counts, n=labels.length;
  var total=0; for(var t=0;t<n;t++) total+=counts[t];
  if(!n || total<=0) return emptyChart();
  var W=520, H=240, cx=124, cy=H/2, r=94, ir=donut?52:0;
  var svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H, class:'chart-svg', preserveAspectRatio:'xMinYMin meet', role:'img'});
  var ang=-Math.PI/2;
  for(var i=0;i<n;i++){
    var frac=counts[i]/total, a2=ang+frac*Math.PI*2, color=CHART_PALETTE[i%CHART_PALETTE.length];
    if(n===1){
      svg.appendChild(svgEl('circle',{cx:cx,cy:cy,r:r,fill:color}));
      if(donut) svg.appendChild(svgEl('circle',{cx:cx,cy:cy,r:ir,class:'chart-donut-hole'}));
    } else {
      svg.appendChild(svgEl('path',{d:arcPath(cx,cy,r,ir,ang,a2), fill:color, class:'chart-slice'}));
    }
    ang=a2;
  }
  if(donut){
    if(n>1) svg.appendChild(svgEl('circle',{cx:cx,cy:cy,r:ir,class:'chart-donut-hole'}));
    svg.appendChild(svgText(cx, cy, 'chart-donut-total', String(total), {'text-anchor':'middle','dominant-baseline':'central'}));
  }
  var lx=258, lh=Math.min(22, (H-24)/Math.max(n,1)), ly=Math.max(20, (H-(n*lh))/2 + 8);
  for(var j=0;j<n;j++){
    var yy=ly + j*lh, pct=Math.round(counts[j]/total*100);
    svg.appendChild(svgEl('rect',{x:lx, y:yy-8, width:11, height:11, rx:2, fill:CHART_PALETTE[j%CHART_PALETTE.length]}));
    svg.appendChild(svgText(lx+18, yy, 'chart-lbl', truncLabel(labels[j],22)+' · '+counts[j]+' ('+pct+'%)', {'dominant-baseline':'central','title':labels[j]+' · '+counts[j]+' ('+pct+'%)'}));
  }
  return svg;
}
function renderChart(type, data){
  if(type==='pie') return pieChartSVG(data,false);
  if(type==='donut') return pieChartSVG(data,true);
  if(type==='line') return lineChartSVG(data);
  return barChartSVG(data);
}

/* ---- dashboard render ---- */
/* A KPI tile. opts.hero → the primary accent-tinted tile (row count);
   opts.stats → an array of [label,value] pairs rendered as a compact 2-col
   stat grid beneath the headline value (avg / median / min / max). */
function kpiTile(label, value, sub, opts){
  opts = opts || {};
  var kids=[
    el('div',{class:'dash-kpi-label',text:label}),
    el('div',{class:'dash-kpi-value',text:value})
  ];
  if(sub) kids.push(el('div',{class:'dash-kpi-sub',text:sub}));
  if(opts.stats && opts.stats.length){
    var grid=el('div',{class:'dash-stats'});
    opts.stats.forEach(function(s){
      grid.appendChild(el('div',{class:'dash-stat'},[
        el('span',{class:'dash-stat-k',text:s[0]}),
        el('span',{class:'dash-stat-v',text:s[1]})
      ]));
    });
    kids.push(grid);
  }
  return el('div',{class:'dash-kpi'+(opts.hero?' dash-kpi-hero':'')}, kids);
}
function chartCard(spec, idx, cols, rows){
  var card=el('div',{class:'dash-card'});

  /* Remove control sits in the card's top-right corner (positioned via CSS, out
     of the header flow so it never crowds the column/type pickers). */
  var rm=el('button',{class:'dash-rm',type:'button',title:'Remove chart',attrs:{'aria-label':'Remove chart'},text:'✕'});
  rm.addEventListener('click',function(){ State.dashCharts.splice(idx,1); render(); });
  card.appendChild(rm);

  var head=el('div',{class:'dash-card-head'});

  var colSel=el('select',{class:'select dash-sel',attrs:{'aria-label':'Chart column'}});
  colSel.appendChild(el('option',{value:'',text:'Choose a column…'}));
  cols.forEach(function(c){ var o=el('option',{value:c.id,text:c.name}); if(c.id===spec.colId) o.selected=true; colSel.appendChild(o); });
  colSel.value=spec.colId||'';
  function setColTitle(){ var o=colSel.options[colSel.selectedIndex]; colSel.title=(o?o.text:'')||'Choose a column to chart'; }
  setColTitle();
  colSel.addEventListener('change',function(){ setColTitle(); State.dashCharts[idx].colId=this.value; render(); });

  var typeSel=el('select',{class:'select dash-sel dash-sel-type',attrs:{'aria-label':'Chart type'}});
  [['bar','Bar'],['pie','Pie'],['donut','Donut'],['line','Line']].forEach(function(tp){ var o=el('option',{value:tp[0],text:tp[1]}); if(tp[0]===spec.chartType) o.selected=true; typeSel.appendChild(o); });
  typeSel.value=spec.chartType||'bar';
  typeSel.addEventListener('change',function(){ State.dashCharts[idx].chartType=this.value; render(); });

  head.appendChild(colSel); head.appendChild(typeSel);
  card.appendChild(head);

  /* Per-chart date range: pick a date/datetime column + From/To. Each card filters
     its own rows independently, so charts can cover different periods. Every table
     has a "Created At" datetime column, so a date column is always available. */
  var dateCols=cols.filter(function(c){ return c.type==='date'||c.type==='datetime'; });
  if(dateCols.length){
    var dSel=el('select',{class:'select dash-date-col',attrs:{'aria-label':'Filter this chart by date column'}});
    dSel.appendChild(el('option',{value:'',text:'— No date filter —'}));
    dateCols.forEach(function(c){ var o=el('option',{value:c.id,text:c.name}); if(c.id===spec.dateColId) o.selected=true; dSel.appendChild(o); });
    dSel.value=spec.dateColId||'';
    var fromI=el('input',{class:'input dash-date',type:'date',attrs:{'aria-label':'From date'}});
    var toI=el('input',{class:'input dash-date',type:'date',attrs:{'aria-label':'To date'}});
    fromI.value=spec.from||''; toI.value=spec.to||'';
    var rangeRow=el('div',{class:'dash-date-range'},[
      el('label',{class:'dash-date-f'},[el('span',{text:'From'}),fromI]),
      el('label',{class:'dash-date-f'},[el('span',{text:'To'}),toI])
    ]);
    function syncDates(){ var on=!!dSel.value; fromI.disabled=!on; toI.disabled=!on; rangeRow.style.opacity=on?'1':'.5'; }
    syncDates();
    dSel.addEventListener('change',function(){ State.dashCharts[idx].dateColId=this.value; if(!this.value){ State.dashCharts[idx].from=''; State.dashCharts[idx].to=''; } render(); });
    fromI.addEventListener('change',function(){ State.dashCharts[idx].from=this.value; render(); });
    toI.addEventListener('change',function(){ State.dashCharts[idx].to=this.value; render(); });
    card.appendChild(el('div',{class:'dash-dates'},[dSel,rangeRow]));
  }

  var body=el('div',{class:'dash-card-body'});
  var col=null; for(var i=0;i<cols.length;i++){ if(cols[i].id===spec.colId){ col=cols[i]; break; } }
  if(!col){
    body.appendChild(emptyChart('Choose a column to chart.'));
  } else {
    var ranged=!!(spec.dateColId && (spec.from || spec.to));
    var crows=filterByDateRange(rows, spec.dateColId, spec.from, spec.to);
    var data=chartDataFor(col, crows);
    if(!data.labels.length){
      body.appendChild(emptyChart(ranged ? 'No “'+col.name+'” values in this date range.' : 'No values in “'+col.name+'” yet.'));
    } else {
      var tot=0; for(var t=0;t<data.counts.length;t++) tot+=data.counts[t];
      body.appendChild(el('div',{class:'dash-card-cap'},[
        el('span',{class:'dash-cap-txt',text: chartCaption(col)}),
        el('span',{class:'dash-cap-tot',text: fmtNum(tot)+' total'})
      ]));
      body.appendChild(renderChart(spec.chartType||'bar', data));
    }
  }
  card.appendChild(body);
  return card;
}
function renderDashboard(view){
  if(!dashboardEl) return;
  dashboardEl.innerHTML='';
  var cols=displayColumns(State.columns);
  var rows=view.sorted;   // the current view's rows — filters + search already applied

  // Headline KPIs: total rows (hero) + a stat tile per Price/Number column
  // carrying the sum (headline) plus avg / median / min / max.
  dashboardEl.appendChild(el('div',{class:'dash-charts-head'},[
    el('h2',{class:'dash-h2',text:'Overview'})
  ]));
  var kpis=el('div',{class:'dash-kpis'});
  var filteredNote=(State.rows.length!==view.filtered.length) ? ('of '+State.rows.length+' total') : 'in this table';
  kpis.appendChild(kpiTile('Rows', String(rows.length), filteredNote, {hero:true}));
  cols.filter(function(c){ return c.type==='price'||c.type==='number'; }).forEach(function(c){
    var nums=[]; rows.forEach(function(r){ var nn=parseFloat(r.values[c.id]); if(!isNaN(nn)) nums.push(nn); });
    var fmt=(c.type==='price') ? function(x){ return formatCellValue(x,'price'); } : fmtNum;
    var stats = nums.length ? [
      ['Avg', fmt(avgNumbers(nums))],
      ['Median', fmt(medianNumbers(nums))],
      ['Min', fmt(minNumbers(nums))],
      ['Max', fmt(maxNumbers(nums))]
    ] : [];
    var sub = nums.length ? (nums.length+' value'+(nums.length===1?'':'s')) : 'no values';
    kpis.appendChild(kpiTile('Σ '+c.name, fmt(sumNumbers(nums)), sub, {stats:stats}));
  });
  dashboardEl.appendChild(kpis);

  // Charts section.
  dashboardEl.appendChild(el('div',{class:'dash-charts-head'},[
    el('h2',{class:'dash-h2',text:'Charts'}),
    el('span',{class:'dash-hint',text:'Visualise up to 3 columns — pick a chart type for each.'})
  ]));
  var grid=el('div',{class:'dash-charts'});
  (State.dashCharts||[]).forEach(function(spec, idx){ grid.appendChild(chartCard(spec, idx, cols, rows)); });
  if(!(State.dashCharts||[]).length){
    grid.appendChild(emptyChart('No charts yet — add one to get started.'));
  }
  dashboardEl.appendChild(grid);

  if((State.dashCharts||[]).length<3){
    var add=el('button',{class:'btn btn-secondary dash-add',type:'button'},[
      el('span',{class:'btn-ico',attrs:{'aria-hidden':'true'},text:'＋'}),
      document.createTextNode(' Add chart')
    ]);
    add.addEventListener('click',function(){ State.dashCharts.push(defaultChart()); render(); });
    dashboardEl.appendChild(add);
  }
}

/* ============================================================= *
 *  Calendar view
 *  A fourth layout: rows placed on a month grid by a chosen date/
 *  datetime column. It reuses the filtered + sorted view rows, so the
 *  search box, advanced filters and per-user isolation all carry over
 *  unchanged. Month navigation is ephemeral (State.calMonth); only the
 *  chosen date column is saved with the view.
 * ============================================================= */
var CAL_MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var CAL_DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* Normalize a cell value to its calendar day 'YYYY-MM-DD' (works for date and
   datetime, which stores 'YYYY-MM-DD HH:mm:ss'); '' when blank/unparseable. */
function dayKey(v){ if(v==null) return ''; var m=String(v).match(/^(\d{4}-\d{2}-\d{2})/); return m?m[1]:''; }
function daysInMonth(year, month){ return new Date(year, month, 0).getDate(); }   /* month is 1–12 */
function monthLabel(year, month){ return (CAL_MONTHS[month-1]||'?')+' '+year; }
/* Shift a 'YYYY-MM' key by delta months (falls back to today's month if key is bad). */
function shiftMonth(key, delta){
  var m=/^(\d{4})-(\d{2})$/.exec(String(key||'')), y, mo;
  if(m){ y=+m[1]; mo=+m[2]; } else { var d=new Date(); y=d.getFullYear(); mo=d.getMonth()+1; }
  var idx=y*12+(mo-1)+(delta||0); return Math.floor(idx/12)+'-'+pad2((idx%12)+1);
}
/* A month laid out as weeks (Sunday-first) of {y,m,d,key,inMonth} day cells,
   padded with leading/trailing days from adjacent months to fill whole weeks. */
function calendarMatrix(year, month){
  var startDow=new Date(year, month-1, 1).getDay();      /* 0=Sun … 6=Sat */
  var weeks=Math.ceil((startDow+daysInMonth(year, month))/7);
  var cur=new Date(year, month-1, 1-startDow), out=[];
  for(var w=0; w<weeks; w++){
    var row=[];
    for(var i=0;i<7;i++){
      var y=cur.getFullYear(), mo=cur.getMonth()+1, d=cur.getDate();
      row.push({y:y, m:mo, d:d, key:y+'-'+pad2(mo)+'-'+pad2(d), inMonth:(mo===month && y===year)});
      cur.setDate(cur.getDate()+1);
    }
    out.push(row);
  }
  return out;
}
/* Bucket rows by their day per the chosen column:
   {map:{'YYYY-MM-DD':[rows]}, undated:[rows]}. Pure — rows carry .values. */
function groupRowsByDay(rows, colId){
  var map={}, undated=[];
  (rows||[]).forEach(function(r){
    var k=dayKey(r && r.values ? r.values[colId] : '');
    if(!k){ undated.push(r); return; }
    (map[k]=map[k]||[]).push(r);
  });
  return {map:map, undated:undated};
}
/* Pick a human label for a row's chip: its first non-blank, non-system field. */
function calRowTitle(row){
  var cols=displayColumns(State.columns).filter(function(c){ return !c.system; });
  for(var i=0;i<cols.length;i++){
    var c=cols[i], v=row.values[c.id];
    var disp = c.type==='link' ? parseLinkIds(v).map(function(id){ return linkLabel(c,id); }).join(', ') : formatCellValue(v,c.type);
    if(disp!=='') return disp;
  }
  return '(untitled)';
}
function calChip(row){
  var t=calRowTitle(row);
  var chip=el('button',{class:'cal-chip',type:'button',title:t,text:t});
  // Edit on an editable table; view-only members open the read-only record panel.
  chip.addEventListener('click',function(){ if(canEditData()) openRowModal('edit',row); else openRecordPanel(row._id); });
  return chip;
}

/* ============================================================= *
 *  Shift Schedule roster
 *  The built-in "Shift Schedule" table renders as a weekly roster
 *  instead of the grid: green date bands run Sun→Sat, and each day's
 *  cell lists one line per person — "Angela: 8AM - 5PM (WFH)" for a
 *  working shift, or "Janos: REST DAY" / "Jhoanna: LEAVE" in red. A
 *  per-day note (e.g. "HBD, JANOS!!") sits above the day's shifts, and
 *  a person's whole line can be tinted via the Highlight column. The
 *  roster reuses the calendar's month machinery (month nav, the
 *  Sun-first week matrix, day bucketing) so it needs no new state.
 *  It is routed to from render() when State.scheduleView is set, and
 *  is additive: nothing here runs for a normal table.
 * ============================================================= */

/* Find a schedule column by its header name (case-insensitive). The three
   roster columns are added server-side by ensureScheduleColumns_, so the
   client keys off the names rather than ids that vary per workspace. */
function schedColByName(name){
  var lc=String(name||'').toLowerCase();
  for(var i=0;i<State.columns.length;i++){
    if(String(State.columns[i].name||'').toLowerCase()===lc) return State.columns[i];
  }
  return null;
}
/* The columns the roster cares about, resolved once per render. The date axis is
   the seeded "Date" column — NOT the built-in "Created At", which is also a
   datetime column and comes first, so a naive "first date column" would bucket
   every shift by when it was created instead of its shift date. Prefer the column
   named Date, then fall back to the first NON-system date/datetime column. */
function schedColumns(){
  var dateCol=schedColByName('Date');
  if(!dateCol || (dateCol.type!=='date' && dateCol.type!=='datetime')) dateCol=null;
  if(!dateCol){
    for(var i=0;i<State.columns.length;i++){
      var c=State.columns[i];
      if(!c.system && (c.type==='date'||c.type==='datetime')){ dateCol=c; break; }
    }
  }
  var firstData=State.columns.filter(function(c){ return !c.system; })[0] || null;
  return {
    name:      schedColByName('Name') || firstData,
    date:      dateCol,
    start:     schedColByName('Shift Start'),
    end:       schedColByName('Shift End'),
    status:    schedColByName('Status'),
    location:  schedColByName('Location'),
    highlight: schedColByName('Highlight')
  };
}
/* Normalize a Status value to 'working' | 'rest' | 'leave'. Blank, "Working",
   or anything unrecognized is treated as a working shift (the default). */
function schedStatusKind(v){
  var s=String(v==null?'':v).trim().toLowerCase();
  if(s==='rest day' || s==='rest') return 'rest';
  if(s==='leave') return 'leave';
  return 'working';
}
/* One person's roster line for a day, as the parts a renderer needs. Pure:
   takes the row and the resolved schedule columns, reads only row.values.
   Returns { text, name, detail, kind, highlight } where kind is
   'working' | 'rest' | 'leave'. `text` is the single-line form ("Angela: 8AM -
   5PM (WFH)", "Janos: REST DAY") used for the tooltip; `name`/`detail` are the
   same split two ways so the cell can render the name and the shift distinctly. */
function scheduleEntry(row, cols){
  var v=(row && row.values) ? row.values : {};
  var name = cols.name ? String(v[cols.name.id]==null?'':v[cols.name.id]).trim() : '';
  if(!name) name='(unnamed)';
  var kind = schedStatusKind(cols.status ? v[cols.status.id] : '');
  var highlight = cols.highlight ? String(v[cols.highlight.id]==null?'':v[cols.highlight.id]).trim().toLowerCase() : '';
  var detail;
  if(kind==='rest'){ detail = 'REST DAY'; }
  else if(kind==='leave'){ detail = 'LEAVE'; }
  else {
    var s = cols.start ? formatTimeShort(v[cols.start.id]) : '';
    var e = cols.end   ? formatTimeShort(v[cols.end.id])   : '';
    var when = (s && e) ? (s+' - '+e) : (s || e || '');
    var loc  = cols.location ? String(v[cols.location.id]==null?'':v[cols.location.id]).trim() : '';
    detail = (when || 'Shift')+(loc ? ' ('+loc+')' : '');
  }
  return { text: name+': '+detail, name: name, detail: detail, kind: kind, highlight: highlight };
}
/* Parse a stored 24-hour 'HH:mm' into minutes-since-midnight, or null when blank /
   unparseable. Used only for conflict overlap maths. Pure. */
function schedMinutes(v){
  var m=String(v==null?'':v).match(/^(\d{1,2}):(\d{2})/);
  if(!m) return null;
  var h=+m[1], mi=+m[2];
  if(h>23 || mi>59) return null;
  return h*60+mi;
}
/* Do two [start,end) minute ranges overlap? A missing/invalid bound, or end<=start,
   counts as "can't tell" → false (the caller still flags 2+ entries a day). Pure. */
function schedRangeOverlap(aS,aE,bS,bE){
  if(aS==null||aE==null||bS==null||bE==null) return false;
  if(aE<=aS || bE<=bS) return false;
  return aS<bE && bS<aE;
}
/* Human text for a conflict reason code (tooltips + the save warning). */
function schedConflictText(reason){
  return reason==='overlap'  ? 'Overlapping shifts on this day'
       : reason==='restwork' ? 'Working shift clashes with a Rest Day / Leave'
       : 'Scheduled more than once on this day';
}
/* Find scheduling conflicts across a set of rows. A conflict is any day on which the
   SAME person (by trimmed, lower-cased Name) appears more than once — which covers
   overlapping times, a working shift alongside a Rest Day / Leave, and plain
   double-booking. Pure: reads only row.values via the resolved `cols`. Returns
   { byId:{ rowId:reason }, dayHas:{ 'YYYY-MM-DD':true } } with reason one of
   'overlap' | 'restwork' | 'multi'. Unnamed or undated rows are ignored (they can't
   be said to clash with a specific person on a specific day). */
function schedConflicts(rows, cols){
  var byId={}, dayHas={};
  if(!cols || !cols.date || !cols.name) return { byId: byId, dayHas: dayHas };
  var byDayPerson={};
  (rows||[]).forEach(function(r){
    var v=(r && r.values) ? r.values : {};
    var day=dayKey(v[cols.date.id]);
    if(!day) return;
    var person=String(v[cols.name.id]==null?'':v[cols.name.id]).trim().toLowerCase();
    if(!person) return;
    var dmap=byDayPerson[day]||(byDayPerson[day]={});
    (dmap[person]||(dmap[person]=[])).push(r);
  });
  Object.keys(byDayPerson).forEach(function(day){
    var dmap=byDayPerson[day];
    Object.keys(dmap).forEach(function(person){
      var group=dmap[person];
      if(group.length<2) return;                 // one entry can't conflict with itself
      var anyWorking=false, anyOff=false, overlap=false, working=[];
      group.forEach(function(r){
        var v=r.values||{};
        if(schedStatusKind(cols.status ? v[cols.status.id] : '')==='working'){ anyWorking=true; working.push(r); }
        else { anyOff=true; }
      });
      for(var i=0;i<working.length && !overlap;i++){
        for(var j=i+1;j<working.length && !overlap;j++){
          var a=working[i].values||{}, b=working[j].values||{};
          if(schedRangeOverlap(
                cols.start?schedMinutes(a[cols.start.id]):null, cols.end?schedMinutes(a[cols.end.id]):null,
                cols.start?schedMinutes(b[cols.start.id]):null, cols.end?schedMinutes(b[cols.end.id]):null)) overlap=true;
        }
      }
      var reason = overlap ? 'overlap' : (anyWorking && anyOff ? 'restwork' : 'multi');
      dayHas[day]=true;
      group.forEach(function(r){ byId[r._id]=reason; });
    });
  });
  return { byId: byId, dayHas: dayHas };
}
/* Shift a 'YYYY-MM-DD' key by n days, returning the same format. Uses local date
   components (no UTC parse) so there's no timezone drift. '' for a bad key. */
function schedAddDays(key, n){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(key||''));
  if(!m) return '';
  var d=new Date(+m[1], +m[2]-1, +m[3]+(n||0));
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
/* One roster line (a person's entry for a day): a clickable two-tone row — the
   person's name, then the shift (or REST DAY / LEAVE) — that opens the row editor
   (admins) or the read-only record panel (members), tinted by the Highlight value
   when set. */
function schedEntryNode(entry, row, conflictReason){
  var cls='sched-entry'+(entry.kind!=='working'?' is-off':'')+(entry.highlight?' is-hl-'+entry.highlight:'')+(conflictReason?' is-conflict':'');
  var kids=[
    el('span',{class:'sched-entry-name',text:entry.name}),
    el('span',{class:'sched-entry-detail',text:entry.detail})
  ];
  if(conflictReason) kids.push(el('span',{class:'sched-entry-warn',attrs:{'aria-hidden':'true'},text:'⚠'}));
  var node=el('button',{class:cls,type:'button',title: conflictReason ? entry.text+' — ⚠ '+schedConflictText(conflictReason) : entry.text},kids);
  node.addEventListener('click',function(){ if(canEditData()) openRowModal('edit',row); else openRecordPanel(row._id); });
  return node;
}

  calendarMatrix(year,month).forEach(function(week){

    ]);

      var weekKeys=week.map(function(c){ return c.key; });
      var copyBtn=el('button',{class:'sched-band-copy',type:'button',
        title:'Copy this week’s shifts into next week',
        attrs:{'aria-label':'Copy '+monthDayLabel(a)+' to '+monthDayLabel(b)+' into the next week'}});
      copyBtn.appendChild(el('span',{attrs:{'aria-hidden':'true'},text:'⧉'}));
      copyBtn.appendChild(document.createTextNode(' Copy → next'));
      (function(keys){ copyBtn.addEventListener('click',function(){ copyWeekToNext(keys, cols); }); })(weekKeys);
      band.appendChild(copyBtn);
    }
    grid.appendChild(band);
    week.forEach(function(cell){
      var rows=grouped.map[cell.key]||[];
      var note=notes[cell.key]||'';
      var dcell=el('div',{class:'sched-cell'+(cell.inMonth?'':' is-out')+(cell.key===todayKey?' is-today':'')});
      /* day number; the month abbreviation shows only on the 1st or on spill-over

      var head=el('div',{class:'sched-daynum'},[ el('span',{class:'sched-daynum-d',text:String(cell.d)}) ]);
      if(cell.d===1 || !cell.inMonth) head.appendChild(el('span',{class:'sched-daynum-mo',text:CAL_MONTHS[cell.m-1].slice(0,3)}));
      if(cell.inMonth && conf.dayHas[cell.key]) head.appendChild(el('span',{class:'sched-day-warn',attrs:{title:'Scheduling conflict on this day','aria-label':'Scheduling conflict'},text:'⚠'}));
      dcell.appendChild(head);
      if(cell.inMonth){

        if(note) stack.appendChild(el('div',{class:'sched-note',title:note,text:note}));
        rows.forEach(function(r){ stack.appendChild(schedEntryNode(scheduleEntry(r,cols), r, conf.byId[r._id])); });
        dcell.appendChild(stack);
        if(canEditData()){
          var tools=el('div',{class:'sched-cell-tools'});
          var addHere=el('button',{class:'sched-mini',type:'button',title:'Add shift on this day',attrs:{'aria-label':'Add shift on '+cell.key},text:'＋'});

  if(grouped.undated.length){
    var un=el('div',{class:'sched-undated'});
    un.appendChild(el('div',{class:'sched-undated-head',text:'No '+cols.date.name+' · '+grouped.undated.length}));
    grouped.undated.forEach(function(r){ un.appendChild(schedEntryNode(scheduleEntry(r,cols), r, conf.byId[r._id])); });
    scheduleEl.appendChild(un);
  }

/* Small modal to add/edit the free-text note for a single day. Admins only
   (the buttons that open it are only shown to editors); the write is gated
   server-side by requireTableWrite_ in apiSetScheduleNote. */
function openScheduleNote(dateKey){
  if(!ensureCanEdit()) return;
  var current=(State.dateNotes||{})[dateKey]||'';
  var body=el('div');
  var field=el('div',{class:'field'});
  field.appendChild(el('label',{text:'Note for '+dateKey}));
  var ta=el('textarea',{class:'input',attrs:{rows:'3',maxlength:'500',placeholder:'e.g. HBD, JANOS!!'}});
  ta.value=current;
  field.appendChild(ta); body.appendChild(field);
  var save=el('button',{class:'btn btn-primary',type:'button',text:'Save note'});
  function submit(){
    var text=ta.value.trim();
    save.disabled=true; save.textContent='Saving…';
    callServer('apiSetScheduleNote',[State.tableId,dateKey,text]).then(function(res){
      State.dateNotes=(res && res.dateNotes) ? res.dateNotes : {};
      Modal.close(); toast(text?'Note saved':'Note removed'); render();
    }).catch(function(e){ save.disabled=false; save.textContent='Save note'; showError(e); });
  }
  save.addEventListener('click',submit);
  var clear=el('button',{class:'btn btn-secondary',type:'button',text:'Clear'});
  clear.addEventListener('click',function(){ ta.value=''; submit(); });
  var cancel=el('button',{class:'btn btn-secondary',type:'button',text:'Cancel',onclick:Modal.close});
  Modal.open({title:'Day note', body:body, foot:[cancel, clear, save]});
}
/* Duplicate a week: copy every shift in the given week (its 7 day keys, Sun→Sat,
   including spill-over days) into the following week, each date advanced by 7 days.
   Admin-gated (and the server re-checks). If the target week already holds shifts
   we ask: add on top, or replace (replaced rows go to Trash, so it's recoverable).
   Reuses apiImportRows (bulk insert) + apiBulkDeleteRows, then reloadData refreshes
   State.rows with the server-stamped copies. */
function copyWeekToNext(weekKeys, cols){
  if(!ensureCanEdit()) return;
  if(!cols || !cols.date){ return; }
  var srcSet={}; weekKeys.forEach(function(k){ srcSet[k]=true; });
  var dataCols=displayColumns(State.columns).filter(function(c){ return !c.system; });
  var src=State.rows.filter(function(r){ return srcSet[dayKey(r.values[cols.date.id])]; });
  if(!src.length){ toast('No shifts in that week to copy', 'warn'); return; }

  /* build copied records: every non-system field as-is, with the date column +7 */
  var copies=src.map(function(r){
    var rec={};
    dataCols.forEach(function(c){
      var val=r.values[c.id];
      if(c.id===cols.date.id) val=schedAddDays(dayKey(val),7);
      rec[c.id]=(val==null?'':val);
    });
    return rec;
  });

  /* existing shifts already sitting in the target week (for the collision prompt
     and for "replace") */
  var tgtSet={}; weekKeys.forEach(function(k){ var t=schedAddDays(k,7); if(t) tgtSet[t]=true; });
  var targetRows=State.rows.filter(function(r){ return tgtSet[dayKey(r.values[cols.date.id])]; });
  var n=copies.length;

  function run(mode){
    var p=Promise.resolve();
    if(mode==='replace' && targetRows.length){
      p=callServer('apiBulkDeleteRows',[State.tableId, targetRows.map(function(r){ return r._id; })]);
    }
    return p
      .then(function(){ return callServer('apiImportRows',[State.tableId, copies]); })
      .then(function(){ return reloadData(); })
      .then(function(){ toast('Copied '+n+' shift'+(n===1?'':'s')+' into the next week'); });
  }

  if(targetRows.length){
    openWeekCopyModal(n, targetRows.length, run);
  } else {
    run('add').catch(showError);
  }
}
/* The add-on-top vs replace prompt for Duplicate a week (shown only when the target
   week already has shifts). */
function openWeekCopyModal(n, existing, run){
  var body=el('div',{},[
    el('p',{class:'modal-note',text:'Copy '+n+' shift'+(n===1?'':'s')+' into next week. That week already has '+existing+' shift'+(existing===1?'':'s')+'.'}),
    el('div',{style:'font-size:12px;color:var(--muted);',text:'“Add on top” keeps the existing shifts and adds these alongside. “Replace week” moves the existing ones to Trash first (you can restore them).'})
  ]);
  var cancel=el('button',{class:'btn btn-secondary',type:'button',text:'Cancel',onclick:Modal.close});
  var addTop=el('button',{class:'btn btn-secondary',type:'button',text:'Add on top'});
  var replace=el('button',{class:'btn btn-primary',type:'button',text:'Replace week'});
  function go(mode,btn,label){
    addTop.disabled=replace.disabled=true; btn.textContent='Working…';
    run(mode).then(function(){ Modal.close(); }).catch(function(e){
      addTop.disabled=replace.disabled=false; addTop.textContent='Add on top'; replace.textContent='Replace week'; showError(e);
    });
  }
  addTop.addEventListener('click',function(){ go('add',addTop); });
  replace.addEventListener('click',function(){ go('replace',replace); });
  Modal.open({title:'Copy week', body:body, foot:[cancel, addTop, replace]});
}

function galleryCard(row, imgCol){

  /* hero: the first image in the chosen Attachment column, else a placeholder */

  if(f && f.id){
    var img=el('img',{class:'gallery-img',attrs:{src:driveThumbUrl(f.id,500),alt:f.name||'',loading:'lazy'}});
    /* a broken/again-private thumbnail falls back to the placeholder glyph */

    });

    media.classList.add('is-empty');
