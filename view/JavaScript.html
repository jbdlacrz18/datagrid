function downloadCsv(filename,csv){
  var content='﻿'+csv;   /* BOM so Excel reads UTF-8 correctly */
  try{
    var blob=new Blob([content],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=el('a',{href:url,download:filename}); document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.parentNode&&a.parentNode.removeChild(a); },1500);
    return true;
  }catch(e){
    try{ window.open('data:text/csv;charset=utf-8,'+encodeURIComponent(content),'_blank'); return true; }
    catch(e2){ return false; }
  }
}

/* ============================================================= *
 *  Access (roles) modal — admin only
 * ============================================================= */
function openAccessModal(){
  var body=el('div');
  body.appendChild(el('p',{class:'modal-note',html:'<strong>Admins</strong> shape the table — add, rename, retype, reorder, and delete columns — plus manage access and view activity. <strong>Members</strong> can add, edit, and delete rows. The spreadsheet owner is always an admin and can’t be changed here.'}));

  var list=el('div',{class:'roles-list'},[el('div',{class:'roles-empty',text:'Loading…'})]);
  body.appendChild(list);

  var emailInput=el('input',{class:'input',type:'email',placeholder:'name@example.com',maxLength:120});
  var roleSel=el('select',{class:'select'});
  [['member','Member'],['admin','Admin']].forEach(function(r){ roleSel.appendChild(el('option',{value:r[0],text:r[1]})); });
  var addBtn=el('button',{class:'btn btn-primary',type:'button',text:'Add'});
  var addForm=el('div',{class:'roles-add'},[emailInput,roleSel,addBtn]);
  body.appendChild(el('div',{class:'field',style:'margin-top:16px;'},[
    el('label',{},[document.createTextNode('Grant access '), el('span',{class:'hint',text:'· by email'})]),
    addForm
  ]));

  function draw(data){
    list.innerHTML='';
    var roles=(data && data.roles) || [];
    if(!roles.length){ list.appendChild(el('div',{class:'roles-empty',text:'No one has been granted access yet.'})); return; }
    roles.forEach(function(r){
      var isAdmin=r.role==='admin';
      var badge=el('span',{class:'role-badge '+(isAdmin?'is-admin':'is-member'),text:isAdmin?'Admin':'Member'});
      var idBox=el('div',{class:'role-id'},[
        el('span',{class:'role-email',text:r.email}),
        r.owner ? el('span',{class:'role-owner',text:'Owner · always admin'}) : null
      ]);
      var actions;
      if(r.owner){
        actions=el('div',{class:'roles-actions'},[badge]);
      } else {
        var toggle=el('button',{class:'btn btn-secondary btn-xs',type:'button',text:isAdmin?'Make member':'Make admin'});
        toggle.addEventListener('click',function(){
          toggle.disabled=true;
          callServer('apiSetRole',[r.email, isAdmin?'member':'admin'])
            .then(reload).then(function(){ toast('Access updated'); })
            .catch(function(e){ toggle.disabled=false; showError(e); });
        });
        var rm=el('button',{class:'icon-btn danger',type:'button',title:'Remove access','aria-label':'Remove '+r.email,html:ICON.trash});
        rm.addEventListener('click',function(){
          rm.disabled=true;
          callServer('apiRemoveRole',[r.email])
            .then(reload).then(function(){ toast('Access removed'); })
            .catch(function(e){ rm.disabled=false; showError(e); });
        });
        actions=el('div',{class:'roles-actions'},[badge,toggle,rm]);
      }
      list.appendChild(el('div',{class:'role-row'},[idBox,actions]));
    });
  }
  function reload(){ return callServer('apiListRoles').then(draw); }

  addBtn.addEventListener('click',function(){
    var email=emailInput.value.trim();
    if(!email || email.indexOf('@')<1){ toast('Enter a valid email address.','error'); return; }
    addBtn.disabled=true; addBtn.textContent='Adding…';
    callServer('apiSetRole',[email, roleSel.value])
      .then(reload)
      .then(function(){ emailInput.value=''; roleSel.value='member'; addBtn.disabled=false; addBtn.textContent='Add'; toast('Access granted'); })
      .catch(function(e){ addBtn.disabled=false; addBtn.textContent='Add'; showError(e); });
  });
  emailInput.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addBtn.click(); } });

  Modal.open({title:'Manage access', body:body, foot:[el('button',{class:'btn btn-primary',type:'button',text:'Done',onclick:Modal.close})], wide:true});
  callServer('apiListRoles').then(draw)
    .catch(function(e){ list.innerHTML=''; list.appendChild(el('div',{class:'roles-empty',text:'Couldn’t load the access list.'})); showError(e); });
}

/* ============================================================= *
 *  Activity (audit) log modal — admin only
 * ============================================================= */

/** Render an audit entry's details. For edits (UPDATE_ROW / UPDATE_CELL) the
 *  server writes one "Field: old → new" change per line; show each with the
 *  previous value struck through and the new value highlighted, so it's obvious
 *  what changed and what it was before. Adds, deletes, "(unchanged)", "(no
 *  changes)", and any line we can't confidently split fall back to plain,
 *  newline-preserving text. */
function auditDetailsNode(action, details){
  details = String(details==null?'':details);
  var ARROW=' → ';
  if(action==='UPDATE_ROW' || action==='UPDATE_CELL'){
    var lines = details.split('\n').filter(function(l){ return l !== ''; });
    var nodes = [], allParsed = lines.length>0;
    for(var i=0;i<lines.length;i++){
      var line=lines[i], aIdx=line.indexOf(ARROW), cIdx=line.indexOf(': ');
      if(aIdx>0 && cIdx>0 && cIdx<aIdx){
        var fld=line.slice(0,cIdx), oldV=line.slice(cIdx+2,aIdx), newV=line.slice(aIdx+ARROW.length);
        nodes.push(el('div',{class:'audit-change'},[
          el('span',{class:'chg-fld',text:fld}),
          el('span',{class:'chg-old'+(oldV==='(empty)'?' chg-empty':''),text:oldV}),
          el('span',{class:'chg-arr',text:'→'}),
          el('span',{class:'chg-new'+(newV==='(empty)'?' chg-empty':''),text:newV})
        ]));
      } else { allParsed=false; }
    }
    if(allParsed) return el('div',{class:'audit-det audit-changes'}, nodes);
  }
  return el('div',{class:'audit-det',text:details,attrs:{style:'white-space:pre-line'}});
}

function openActivityModal(){
  var LABELS={
    ADD_ROW:'Added row', UPDATE_ROW:'Updated row', UPDATE_CELL:'Edited cell', DELETE_ROW:'Deleted row',
    ADD_COLUMN:'Added column', UPDATE_COLUMN:'Updated column', DELETE_COLUMN:'Deleted column', REORDER_COLUMNS:'Reordered columns',
    SET_ROLE:'Changed access', REMOVE_ROLE:'Removed access', RESET_APP:'Reset the app',
    RESTORE_ROW:'Restored row', PURGE_ROW:'Deleted permanently', EMPTY_TRASH:'Emptied trash', SET_CURRENCY:'Changed currency',
    IMPORT_ROWS:'Imported rows', BULK_DELETE:'Deleted rows', BULK_SET_FIELD:'Set field on rows',
    CREATE_TABLE:'Created table', RENAME_TABLE:'Renamed table', DELETE_TABLE:'Deleted table'
  };
  var DELETES={ DELETE_ROW:1, DELETE_COLUMN:1, REMOVE_ROLE:1, RESET_APP:1, PURGE_ROW:1, EMPTY_TRASH:1, BULK_DELETE:1, DELETE_TABLE:1 };

  var body=el('div');
  body.appendChild(el('p',{class:'modal-note',text:'Every create, update, and delete is recorded here — who made the change, when, and for edits what changed (previous → new). Newest first; the most recent 200 are shown.'}));
  var wrap=el('div',{class:'audit-wrap'},[el('div',{class:'audit-empty',text:'Loading…'})]);
  body.appendChild(wrap);

  Modal.open({title:'Activity log', body:body, foot:[el('button',{class:'btn btn-primary',type:'button',text:'Done',onclick:Modal.close})], wide:true});

  callServer('apiGetAuditLog',[200]).then(function(res){
    wrap.innerHTML='';
    var entries=(res && res.entries) || [];
    if(!entries.length){ wrap.appendChild(el('div',{class:'audit-empty',text:'No activity recorded yet.'})); return; }
    entries.forEach(function(en){
      var label=LABELS[en.action] || en.action || 'Change';
      var top=el('div',{class:'audit-top'},[
        el('span',{class:'audit-act'+(DELETES[en.action]?' del':''),text:label}),
        el('span',{class:'audit-time',text:en.time})
      ]);
      var kids=[top, el('div',{class:'audit-user',text:en.user||'(anonymous)'})];
      if(en.details) kids.push(auditDetailsNode(en.action, en.details));
      wrap.appendChild(el('div',{class:'audit-row'+(DELETES[en.action]?' del':'')},kids));
    });
  }).catch(function(e){
    wrap.innerHTML=''; wrap.appendChild(el('div',{class:'audit-empty',text:'Couldn’t load the activity log.'})); showError(e);
  });
}

/* ============================================================= *
 *  Toasts
 * ============================================================= */
function toast(msg,kind){
  kind=kind||'success';
  var t=el('div',{class:'toast '+kind},[el('span',{class:'toast-dot'}), el('span',{text:msg})]);
  toasts.appendChild(t);
  setTimeout(function(){ t.style.transition='opacity .25s'; t.style.opacity='0'; setTimeout(function(){ t.parentNode&&t.parentNode.removeChild(t); },260); }, 2600);
}
/* A toast with an inline action button (used for one-click Undo after a delete).
   Stays up a little longer than a plain toast so there's time to click it. */
function toastUndo(msg,onUndo){
  var t=el('div',{class:'toast success'});
  var done=false;
  function dismiss(){ if(done) return; done=true; t.style.transition='opacity .25s'; t.style.opacity='0'; setTimeout(function(){ t.parentNode&&t.parentNode.removeChild(t); },260); }
  var btn=el('button',{class:'toast-undo',type:'button',text:'Undo',onclick:function(){ dismiss(); if(onUndo) onUndo(); }});
  t.appendChild(el('span',{class:'toast-dot'}));
  t.appendChild(el('span',{text:msg}));
  t.appendChild(btn);
  toasts.appendChild(t);
  setTimeout(dismiss, 6000);
}

})();
</script>
