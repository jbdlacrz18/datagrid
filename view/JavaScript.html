  }
  card.appendChild(media);

  /* body: headline + up to two more label/value rows (skip file columns) */
  var body=el('div',{class:'gallery-body'});
  body.appendChild(el('div',{class:'gallery-card-title',text: galleryCardTitle(row)}));
  var cols=displayColumns(State.columns).filter(function(c){ return !c.system && c.type!=='file'; });
  var fields=[];
  cols.forEach(function(c){
    var v=row.values[c.id];
    var disp = c.type==='link' ? parseLinkIds(v).map(function(id){ return linkLabel(c,id); }).join(', ') : formatCellValue(v,c.type);
    if(disp!=='') fields.push({name:c.name, val:disp});
  });
  fields.slice(1,3).forEach(function(fl){
    body.appendChild(el('div',{class:'gallery-field'},[
      el('span',{class:'gallery-field-label',text:fl.name}),
      el('span',{class:'gallery-field-val',text:fl.val,attrs:{title:fl.val}})
    ]));
  });
  card.appendChild(body);

  function open(){ openRecordPanel(row._id); }
  card.addEventListener('click',open);
  card.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); open(); } });
  return card;
}
function renderGallery(view){
  if(!galleryEl) return;
  galleryEl.innerHTML='';
  var imgCol=null;
  for(var i=0;i<State.columns.length;i++){ if(State.columns[i].id===State.galleryColId && State.columns[i].type==='file'){ imgCol=State.columns[i]; break; } }

  var rows=view.sorted;
  if(!rows.length){
    var narrowed = !!State.search || !!(State.filters && State.filters.length);
    galleryEl.appendChild(el('div',{class:'gallery-hint'},[
      el('div',{class:'gallery-hint-art',attrs:{'aria-hidden':'true'},text:'▦'}),
      el('h2',{text: narrowed ? 'No matches' : 'No rows yet'}),
      el('p',{text: narrowed ? 'No rows match your filters or search.' : 'Add your first record to see it here.'})
    ]));
    return;
  }

  /* a gentle nudge when the table has no Attachment column to draw heroes from */
  if(!fileColsList().length){
    galleryEl.appendChild(el('div',{class:'gallery-note',text:'Add an Attachment column and upload images to give each card a picture.'}));
  }

  var grid=el('div',{class:'gallery-grid'});
  rows.forEach(function(r){ grid.appendChild(galleryCard(r,imgCol)); });
  galleryEl.appendChild(grid);
}

/* ============================================================= *
 *  Multi-select for bulk actions
 *  Selection lives in State.selected (a set of row ids) and persists across
 *  pages; render() prunes ids whose rows have vanished. Every visible row is
 *  selectable — the server still enforces per-user access on the bulk call, so
 *  a member can only ever affect rows they own.
 * ============================================================= */
function selectedIds(){ return Object.keys(State.selected); }
function selectionCount(){ return selectedIds().length; }
function clearSelection(){ State.selected={}; }
function pruneSelection(){
  var have={}; State.rows.forEach(function(r){ have[r._id]=1; });
  Object.keys(State.selected).forEach(function(id){ if(!have[id]) delete State.selected[id]; });
}
function toggleRow(id,on){
  if(on) State.selected[id]=true; else delete State.selected[id];
  var tr=tbody.querySelector('tr[data-row-id="'+id+'"]');
  if(tr) tr.classList.toggle('is-selected',!!on);
  syncHeaderCheck(); renderBulkBar();
}
function toggleAllOnPage(on){
  (State._pageIds||[]).forEach(function(id){ if(on) State.selected[id]=true; else delete State.selected[id]; });
  Array.prototype.forEach.call(tbody.querySelectorAll('tr[data-row-id]'),function(tr){
    var sel=!!State.selected[tr.getAttribute('data-row-id')];
    tr.classList.toggle('is-selected',sel);
    var cb=tr.querySelector('.row-check'); if(cb) cb.checked=sel;
  });
  syncHeaderCheck(); renderBulkBar();
}
/* Reflect the current page's selection in the header "select all" checkbox:
   checked when every page row is selected, indeterminate when only some are. */
function syncHeaderCheck(){
  var box=thead.querySelector('.sel-all'); if(!box) return;
  var ids=State._pageIds||[]; var sel=0;
  ids.forEach(function(id){ if(State.selected[id]) sel++; });
  box.checked = ids.length>0 && sel===ids.length;
  box.indeterminate = sel>0 && sel<ids.length;
}
/* The floating action bar shown while one or more rows are selected. */
function renderBulkBar(){
  if(!bulkBar) return;
  var n=selectionCount();
  if(n===0){ bulkBar.hidden=true; bulkBar.innerHTML=''; return; }
  var hasEditable=displayColumns(State.columns).some(function(c){ return !c.system; });
  bulkBar.innerHTML='';
  var left=el('div',{class:'bulk-left'},[
    el('span',{class:'bulk-count',text:n+' selected'}),
    el('button',{class:'bulk-clear',type:'button',text:'Clear',onclick:function(){ clearSelection(); render(); }})
  ]);
  var setBtn=el('button',{class:'btn btn-secondary btn-xs',type:'button',text:'Set field…',
    title: hasEditable?'Set one column to a value for all selected rows':'No editable columns to set'});
  setBtn.disabled=!hasEditable;
  setBtn.addEventListener('click',function(){ if(!setBtn.disabled) openBulkSetFieldModal(); });
  var delBtn=el('button',{class:'btn btn-danger btn-xs',type:'button',text:'Delete',onclick:openBulkDeleteModal});
  var right=el('div',{class:'bulk-actions'},[setBtn,delBtn]);
  bulkBar.appendChild(left); bulkBar.appendChild(right);
  bulkBar.hidden=false;
}

function renderPager(view){
  var pg=view.pg;
  pager.hidden = view.filtered.length===0;
  if(pager.hidden) return;
  var start=pg.total===0?0:pg.start+1;
  var end=Math.min(pg.end,pg.total);
  pagerRange.textContent='Showing '+start+'–'+end+' of '+pg.total;
  pageInfo.textContent='Page '+pg.page+' / '+pg.totalPages;
  pageFirst.disabled=pagePrev.disabled=(pg.page<=1);
  pageNext.disabled=pageLast.disabled=(pg.page>=pg.totalPages);
}

function updateRowCount(total,shown){
  if(total===0){ rowCount.textContent=State.columns.length?'0 records':''; return; }
  rowCount.textContent=(shown!==total)?(shown+' of '+total+' records'):(total+' record'+(total===1?'':'s'));
}

/* ============================================================= *
 *  Sorting
 * ============================================================= */
function toggleSort(colId){
  if(State.sort.colId===colId){
    if(State.sort.dir===1) State.sort.dir=-1;
    else State.sort={colId:null,dir:1};   /* asc -> desc -> none */
  } else {
    State.sort={colId:colId,dir:1};
  }
  render();
}

/* ============================================================= *
 *  Column drag-to-reorder
 * ============================================================= */
function wireColumnDrag(th,handle,col){
  handle.addEventListener('dragstart',function(e){
    State._drag=col.id; th.classList.add('dragging');
    try{ e.dataTransfer.setData('text/plain',col.id); e.dataTransfer.effectAllowed='move'; }catch(_){}
  });
  handle.addEventListener('dragend',function(){
    State._drag=null; th.classList.remove('dragging');
    Array.prototype.forEach.call(thead.querySelectorAll('.drag-over'),function(x){x.classList.remove('drag-over');});
  });
  th.addEventListener('dragover',function(e){
    if(!State._drag || State._drag===col.id) return;
    e.preventDefault(); try{e.dataTransfer.dropEffect='move';}catch(_){}
    th.classList.add('drag-over');
  });
  th.addEventListener('dragleave',function(){ th.classList.remove('drag-over'); });
  th.addEventListener('drop',function(e){
    e.preventDefault(); th.classList.remove('drag-over');
    var src=State._drag;
    if(src && src!==col.id) moveColumn(src,col.id);
  });
}
function moveColumn(sourceId,targetId){
  var order=displayColumns(State.columns).map(function(c){return c.id;});
  var from=order.indexOf(sourceId), to=order.indexOf(targetId);
  if(from<0||to<0) return;
  order.splice(to,0, order.splice(from,1)[0]);
  var pos={}; order.forEach(function(id,i){ pos[id]=i; });
  State.columns.forEach(function(c){
    if(c.system){ c.order=-1; return; }   // system columns (Created At, Added By) stay pinned first
    if(pos[c.id]!==undefined) c.order=pos[c.id];
  });
  render();   // filter/sort are order-independent, so the cached view is reused
  callServer('apiReorderColumns',[State.tableId,order]).catch(showError);
}

/* ============================================================= *
 *  Column resize
 * ============================================================= */
function wireColumnResize(grip,col){
  grip.addEventListener('click',function(e){ e.stopPropagation(); });
  grip.addEventListener('dragstart',function(e){ e.preventDefault(); });
  grip.addEventListener('mousedown',function(e){
    e.preventDefault(); e.stopPropagation();
    var startX=e.clientX, startW=getColWidth(col.id), finalW=startW;
    var colEl=colgroup.querySelector('col[data-col="'+col.id+'"]');
    grip.classList.add('active');
    document.body.style.cursor='col-resize'; document.body.style.userSelect='none';
    function mv(ev){ finalW=Math.max(70,Math.min(640,startW+(ev.clientX-startX))); if(colEl) colEl.style.width=finalW+'px'; }
    function up(){
      document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up);
      grip.classList.remove('active'); document.body.style.cursor=''; document.body.style.userSelect='';
      setColWidthLocal(col.id,finalW);
      callServer('apiSetColumnWidth',[State.tableId,col.id,finalW]).catch(showError);
    }
    document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up);
  });
}

/* ============================================================= *
 *  Inline cell editing
 * ============================================================= */
var activeEditor=null;
/* Map a column type to the right HTML input, keyboard, and hints.
   Email/phone are text under the hood (phone keeps leading zeros). */
function applyInputType(inp,type){
  if(type==='date'){ inp.type='date'; }
  else if(type==='number'){ inp.type='number'; inp.step='any'; inp.setAttribute('inputmode','decimal'); }
  else if(type==='price'){ inp.type='number'; inp.step='0.01'; inp.setAttribute('inputmode','decimal'); inp.placeholder='0.00'; }
  else if(type==='email'){ inp.type='email'; inp.setAttribute('inputmode','email');
    inp.setAttribute('autocapitalize','off'); inp.setAttribute('spellcheck','false');
    inp.autocomplete='email'; inp.placeholder='name@example.com'; }
  else if(type==='phone'){ inp.type='tel'; inp.setAttribute('inputmode','tel');
    inp.autocomplete='tel'; inp.placeholder='e.g. 0917 123 4567'; }
  else if(type==='time'){ inp.type='time'; }   /* native time picker; value is canonical 24h 'HH:mm' */
  else { inp.type='text'; }
}

function startEdit(td,rowId,col){
  if(col && col.system) return;          // system columns (Created At, Added By) are read-only
  if(!canEditData()) return;             // view-only (adminManaged + non-admin): no inline editing — mirrors server
  if(activeEditor) activeEditor.cancel();
  var row=rowById(rowId); if(!row) return;
  var current=row.values[col.id]; if(current==null) current='';

  var editor;
  if(col.type==='dropdown'){
    editor=el('select',{class:'cell-editor'});
    editor.appendChild(el('option',{value:'',text:'—'}));
    var found=false;
    (col.options||[]).forEach(function(o){
      var op=el('option',{value:o,text:o});
      if(String(o)===String(current)){ op.selected=true; found=true; }
      editor.appendChild(op);
    });
    if(!found && current!==''){
      var op2=el('option',{value:String(current),text:String(current)}); op2.selected=true; editor.appendChild(op2);
    }
  } else {
    editor=el('input',{class:'cell-editor'});
    applyInputType(editor,col.type);
    editor.value=String(current);
  }
  td.innerHTML=''; td.appendChild(editor);
  editor.focus();
  if(editor.select && col.type!=='date' && col.type!=='dropdown'){ try{editor.select();}catch(_){}}

  var done=false;
  function commit(){
    if(done) return; done=true; activeEditor=null;
    var raw=editor.value;
    if((col.type==='number'||col.type==='price') && raw!=='' && isNaN(parseFloat(raw))){ toast(col.type==='price'?'Enter a valid amount.':'Enter a valid number.','error'); }
    else if(col.type==='email' && raw!=='' && !isNA(raw) && !isValidEmail(raw)){ toast('That doesn’t look like a valid email.','error'); }
    else if(col.type==='phone' && raw!=='' && !isNA(raw) && !isValidPhone(raw)){ toast('That doesn’t look like a valid phone number.','error'); }
    var newVal=coerceClient(raw,col.type);
    if(String(newVal)===String(current)){ renderCellTd(td,row,col); return; }
    row.values[col.id]=newVal; invalidateView(); renderCellTd(td,row,col);
    callServer('apiUpdateCell',[State.tableId,rowId,col.id,raw]).catch(function(e){
      row.values[col.id]=current; invalidateView(); renderCellTd(td,row,col); showError(e);
    });
  }
  function cancel(){ if(done) return; done=true; activeEditor=null; renderCellTd(td,row,col); }
  activeEditor={cancel:cancel};

  editor.addEventListener('keydown',function(e){
    if(e.key==='Enter'){ e.preventDefault(); editor.blur(); }
    else if(e.key==='Escape'){ e.preventDefault(); cancel(); }
  });
  editor.addEventListener('blur',commit);
  if(col.type==='dropdown') editor.addEventListener('change',function(){ editor.blur(); });
}

/* ============================================================= *
 *  Modal framework
 * ============================================================= */
var Modal=(function(){
  var lastFocus=null;
  function open(opts){
    lastFocus=document.activeElement;
    modalTitle.textContent=opts.title||'';
    modal.classList.toggle('wide',!!opts.wide);
    modalBody.innerHTML=''; if(opts.body) modalBody.appendChild(opts.body);
    modalFoot.innerHTML=''; (opts.foot||[]).forEach(function(b){ modalFoot.appendChild(b); });
    modalOverlay.hidden=false;
    var f=modal.querySelector('input,select,textarea');
    setTimeout(function(){ if(f) f.focus(); },30);
  }
  function close(){
    modalOverlay.hidden=true; modalBody.innerHTML=''; modalFoot.innerHTML='';
    if(lastFocus && lastFocus.focus){ try{lastFocus.focus();}catch(_){}}
  }
  return {open:open, close:close};
})();

/* ============================================================= *
 *  Record side-panel — a slide-over to view & edit one row
 *  without leaving the grid. Reuses the shared field builder
 *  (buildField) so validation / formatting exactly match the
 *  Add/Edit modal, and Save / Delete reuse the same server
 *  endpoints (apiUpdateRow / apiDeleteRow). No new server surface.
 * ============================================================= */
var _panelSave=null;   /* current row's submit fn; called by the once-bound Enter handler in bind() */
var Panel=(function(){
  var lastFocus=null;
  function open(){
    if(!panelOverlay) return;
    lastFocus=document.activeElement;
    panelOverlay.hidden=false;
    document.body.classList.add('panel-open');
    var f=recordPanel.querySelector('.panel-body input,.panel-body select,.panel-body textarea');
    setTimeout(function(){ if(f){ try{f.focus();}catch(_){} } },30);
  }
  function close(){
    if(!panelOverlay || panelOverlay.hidden) return;
    panelOverlay.hidden=true;
    document.body.classList.remove('panel-open');
    panelBody.innerHTML=''; panelFoot.innerHTML=''; _panelSave=null;
    State._panelRowId='';
    if(lastFocus && lastFocus.focus){ try{lastFocus.focus();}catch(_){} }
  }
  function isOpen(){ return !!panelOverlay && panelOverlay.hidden===false; }
  return {open:open, close:close, isOpen:isOpen};
})();

/* The ordered rows the panel steps through: the current filtered+sorted view, so
   prev/next follow exactly what the user sees (and span across pages). */
function panelRowList(){ return currentView().sorted; }
function panelIndex(){
  var rows=panelRowList();
  for(var i=0;i<rows.length;i++){ if(rows[i]._id===State._panelRowId) return i; }
  return -1;
}

/* Pure: id of the neighbour `delta` steps from currentId in an ordered row list,
   or '' when currentId is absent or the step falls off either end. */
function neighborRowId(rows, currentId, delta){
  rows=rows||[];
  var i=-1; for(var k=0;k<rows.length;k++){ if(rows[k]._id===currentId){ i=k; break; } }
  if(i<0) return '';
  var j=i+delta;
  if(j<0 || j>=rows.length) return '';
  return rows[j]._id;
}
/* Pure: after deleting deletedId from an ordered list, which row should the panel
   show next — the one that takes the slot (old next), else the previous, else ''. */
function nextRowIdAfterDelete(rows, deletedId){
  rows=rows||[];
  var i=-1; for(var k=0;k<rows.length;k++){ if(rows[k]._id===deletedId){ i=k; break; } }
  if(i<0) return '';
  var nb=rows[i+1] || rows[i-1] || null;
  return nb ? nb._id : '';
}

/* Open the slide-over for a row id and render its editable fields. */
function openRecordPanel(rowId){
  var row=rowById(rowId);
  if(!row) return;
  State._panelRowId=rowId;
  renderRecordPanel();
  Panel.open();
}

/* Step to the previous / next record in the current view (no-op at the ends). */
function panelStep(delta){
  var nextId=neighborRowId(panelRowList(), State._panelRowId, delta);
  if(!nextId) return;
  State._panelRowId=nextId;
  renderRecordPanel();
  var f=recordPanel.querySelector('.panel-body input,.panel-body select,.panel-body textarea');
  if(f){ try{f.focus();}catch(_){} }
}

/* (Re)draw head (title + position + step state), body (fields + activity), and
   foot (Delete / Close / Save) for the row currently open in the panel. */
function renderRecordPanel(){
  var row=rowById(State._panelRowId);
  if(!row){ Panel.close(); return; }
  var rows=panelRowList(), idx=panelIndex();

  /* Head: a human title from the first non-system value + "Record n of m". */
  var firstCol=displayColumns(State.columns).filter(function(c){ return !c.system; })[0];
  var titleText=firstCol ? formatCellValue(row.values[firstCol.id], firstCol.type) : '';
  panelTitle.textContent=(titleText && String(titleText).trim()) ? String(titleText) : 'Record';
  panelSub.textContent=(idx>=0 && rows.length) ? ('Record '+(idx+1)+' of '+rows.length) : '';
  panelPrev.disabled=!(idx>0);
  panelNext.disabled=!(idx>=0 && idx<rows.length-1);

  /* Body: editable fields (reuse buildField — same as the Add/Edit modal).
     On a view-only table (adminManaged + non-admin) the panel is read-only: inputs
     are disabled and the foot shows only Close — no Save/Delete. Mirrors the server,
     which rejects writes from non-admins on these tables. */
  var canEdit=canEditData();
  var editable=displayColumns(State.columns).filter(function(c){ return !c.system; });
  var fields=editable.map(function(col){
    var f=buildField(col, row.values[col.id]);
    f.node.classList.add('panel-field');
    if(!canEdit){
      var ctrls=f.node.querySelectorAll('input,select,textarea,button');
      Array.prototype.forEach.call(ctrls,function(c){ c.disabled=true; });
    }
    return f;
  });
  var form=el('div',{class:'panel-form'});
  if(!canEdit) form.classList.add('panel-form-readonly');
  fields.forEach(function(f){ form.appendChild(f.node); });
  panelBody.innerHTML='';
  panelBody.appendChild(form);
  panelBody.appendChild(buildRecordActivity(row));

  /* View-only foot: just Close, and no save shortcut armed. */
  if(!canEdit){
    _panelSave=null;
    var closeOnly=el('button',{class:'btn btn-secondary',type:'button',text:'Close',onclick:Panel.close});
    panelFoot.innerHTML='';
    panelFoot.appendChild(el('div',{class:'panel-foot-right'},[closeOnly]));
    return;
  }

  /* Foot: Delete (left) · Close + Save (right). Save reuses apiUpdateRow. */
  var saveBtn=el('button',{class:'btn btn-primary',type:'button',text:'Save changes'});
  function doSave(){
    var ok=true; fields.forEach(function(f){ if(!f.validate()) ok=false; });
    if(!ok) return;
    var rec={}; fields.forEach(function(f){ rec[f.col.id]=f.get(); });
    var r=rowById(row._id); if(!r) return;
    /* Optimistic: apply the edits locally and reflect them immediately (patch just
       this row's <tr>, or full-render when that isn't possible), then persist in the
       background. On success reconcile with the server's canonical values; on error
       roll back to the snapshot. Mirrors the inline-cell-edit pattern. */
    var prev=copyValues(r.values);
    for(var id in rec){ if(Object.prototype.hasOwnProperty.call(rec,id)) r.values[id]=rec[id]; }
    invalidateView();
    if(!patchRowTr(r)) render();
    if(Panel.isOpen() && State._panelRowId===r._id) renderRecordPanel();   /* refresh title + activity */
    toast('Changes saved');
    callServer('apiUpdateRow',[State.tableId,r._id,rec]).then(function(res){
      if(res && res.row){ var rr=rowById(r._id); if(rr){ rr.values=res.row.values; invalidateView(); if(!patchRowTr(rr)) render(); } }
      if(Panel.isOpen() && State._panelRowId===r._id) Panel.close();   /* auto-close the side panel once the save is persisted */
    }).catch(function(e){
      var rr=rowById(r._id); if(rr){ rr.values=prev; invalidateView(); if(!patchRowTr(rr)) render(); if(Panel.isOpen() && State._panelRowId===rr._id) renderRecordPanel(); }
      showError(e);
    });
  }
  saveBtn.addEventListener('click',doSave);
  _panelSave=doSave;
  var closeBtn=el('button',{class:'btn btn-secondary',type:'button',text:'Close',onclick:Panel.close});
  var del=el('button',{class:'btn btn-danger-ghost',type:'button',text:'Delete',onclick:function(){ panelDeleteRow(row); }});
  panelFoot.innerHTML='';
  panelFoot.appendChild(del);
  panelFoot.appendChild(el('div',{class:'panel-foot-right'},[closeBtn,saveBtn]));
}

/* Read-only "Activity" strip: the record's system metadata (Created At, Owner, …),
   respecting adminOnly columns exactly like the grid/trash. Purely presentational —
   built from data already loaded, no extra server call. */
function buildRecordActivity(row){
  var sys=displayColumns(State.columns).filter(function(c){
    return c.system && (!c.adminOnly || (State.me && State.me.isAdmin));
  });
  var wrap=el('div',{class:'panel-activity'});
  wrap.appendChild(el('h3',{class:'panel-activity-title',text:'Activity'}));
  if(!sys.length){
    wrap.appendChild(el('p',{class:'panel-activity-empty',text:'No activity is recorded for this record.'}));
    return wrap;
  }
  var dl=el('dl',{class:'panel-meta'});
  sys.forEach(function(c){
    var v=formatCellValue(row.values[c.id], c.type);
    dl.appendChild(el('div',{class:'panel-meta-row'},[
      el('dt',{class:'panel-meta-key',text:c.name}),
      el('dd',{class:'panel-meta-val',text:(v && String(v).trim())?String(v):'—'})
    ]));
  });
  wrap.appendChild(dl);
  return wrap;
}

/* Delete straight from the panel: soft-delete (to trash, with one-click undo, like
   the grid), then advance to the record that took this slot — else the previous one,
   else close when the view is empty. Optimistic: the row leaves the grid immediately
   and is restored if the server call fails. */
function panelDeleteRow(row){
  var before=panelRowList().slice();     /* ordered rows as shown, captured before the delete */
  var idx=-1; for(var i=0;i<State.rows.length;i++){ if(State.rows[i]._id===row._id){ idx=i; break; } }
  if(idx<0) return;
  var removed=State.rows[idx];
  State.rows.splice(idx,1);
  State.trashCount=(State.trashCount||0)+1;
  invalidateView(); updateTrashBadge();
  var nextId=nextRowIdAfterDelete(before, row._id);
  if(nextId && rowById(nextId)){ State._panelRowId=nextId; renderRecordPanel(); }
  else Panel.close();
  render();
  callServer('apiDeleteRow',[State.tableId,row._id]).then(function(){
    toastUndo('Row moved to trash', function(){ restoreRow(row._id); });
  }).catch(function(e){
    /* roll back: put the row back at its original index + restore the count */
    State.rows.splice(Math.min(idx,State.rows.length),0,removed);
    State.trashCount=Math.max(0,(State.trashCount||1)-1);
    invalidateView(); updateTrashBadge(); render();
    showError(e);
  });
}

/* Tab focus-trap while the panel is open (mirrors trapTab for the modal). */
function trapPanelTab(e){
  if(!panelOverlay || panelOverlay.hidden || e.key!=='Tab') return;
  var nodes=recordPanel.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])');
  var f=Array.prototype.filter.call(nodes,function(x){ return !x.disabled && x.offsetParent!==null; });
  if(!f.length) return;
  var first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

function trapTab(e){
  if(modalOverlay.hidden || e.key!=='Tab') return;
  var nodes=modal.querySelectorAll('button,input,select,textarea,a[href],[tabindex]:not([tabindex="-1"])');
  var f=Array.prototype.filter.call(nodes,function(x){ return !x.disabled && x.offsetParent!==null; });
  if(!f.length) return;
  var first=f[0], last=f[f.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
}

/* ---------- shared field builder for row forms ---------- */
/* Linked-record editor: a set of removable chips plus a picker to add more. Options
   come from the link cache (apiLinkOptions, isolation-respecting); if they haven't
   loaded yet we fetch them and redraw this field in place. get() returns the
   comma-separated id list the server expects. */
function buildLinkField(col,value){
  var sel=parseLinkIds(value);
  var chips=el('div',{class:'link-chips'});
  var picker=el('select',{class:'select link-picker'});
  var addBtn=el('button',{class:'btn btn-secondary btn-xs',type:'button',text:'Add'});
  var note=el('div',{class:'link-note hint'});
  var box=el('div',{class:'link-edit'},[chips, el('div',{class:'link-controls'},[picker,addBtn]), note]);

  function entry(){ return getLinkEntry(col) || {options:[],byId:{},loaded:false}; }
  function labelFor(id){ var e=entry(); var l=e.byId?e.byId[id]:''; return (l===''||l==null)?id:String(l); }
  function drawChips(){
    chips.innerHTML='';
    if(!sel.length){ chips.appendChild(el('span',{class:'link-empty hint',text:'No links yet.'})); return; }
    sel.forEach(function(id){
      chips.appendChild(el('span',{class:'link-chip removable'},[
        el('span',{text:labelFor(id)}),
        el('button',{class:'link-chip-x',type:'button',title:'Remove','aria-label':'Remove link',text:'×',
          onclick:function(){ sel=sel.filter(function(x){ return x!==id; }); drawChips(); drawPicker(); }})
      ]));
    });
  }
  function drawPicker(){
    var e=entry(), chosen={}; sel.forEach(function(id){ chosen[id]=1; });
    picker.innerHTML='';
    var avail=(e.options||[]).filter(function(o){ return !chosen[o.id]; });
    picker.appendChild(el('option',{value:'',text: !e.loaded ? 'Loading…' : (avail.length?'Choose a row to link…':'No more rows to link')}));
    avail.forEach(function(o){
      var lbl=(o.label===''||o.label==null)?('Untitled · '+String(o.id).slice(0,6)):o.label;
      picker.appendChild(el('option',{value:o.id,text:lbl}));
    });
    var disabled = !e.loaded || avail.length===0;
    picker.disabled=disabled; addBtn.disabled=disabled;
    note.textContent = (e.loaded && e.error) ? 'Couldn’t load the linked table.'
                     : (e.loaded && e.tableName) ? ('Links to '+e.tableName) : '';
  }
  function add(){ var id=picker.value; if(!id) return; if(sel.indexOf(id)<0) sel.push(id); drawChips(); drawPicker(); }
  addBtn.addEventListener('click',add);
  picker.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); add(); } });

  drawChips(); drawPicker();
  var e0=getLinkEntry(col);
  if(!e0 || !e0.loaded){ prefetchLinks(function(){ drawChips(); drawPicker(); }); }

  var node=el('div',{class:'field'},[
    el('label',{},[document.createTextNode(col.name+' '), el('span',{class:'hint',text:'· Link · optional'})]),
    box
  ]);
  return {node:node, get:function(){ return formatLinkIds(sel); }, validate:function(){ return true; }, col:col};
}
/* Attachment field for a `file` column (add/edit-row modal). Removable chips for the
   already-attached files (each chip opens the Drive file) plus an "Add files / photos"
   button. Picking files uploads each via apiUploadFile — one server round-trip per
   file, base64 read client-side — and appends the returned {id,name,url,mime,size}
   descriptor. get() returns the canonical JSON the server stores; while any upload is
   in flight validate() blocks the save so we never persist a half-uploaded set. The
   picker has no `accept` filter, so on mobile it offers the camera / photo library too. */
var MAX_FILES_CLIENT = 20;
function buildFileField(col,value){
  var sel=parseFiles(value);
  var pending=0;
  var chips=el('div',{class:'file-chips'});
  var fileInput=el('input',{type:'file',multiple:true,class:'file-input-hidden'});
  var addBtn=el('button',{class:'btn btn-secondary btn-xs',type:'button',text:'Add files / photos'});
  var note=el('div',{class:'file-note hint'});
  var err=el('div',{class:'field-error'});
  var box=el('div',{class:'file-edit'},[chips, el('div',{class:'file-controls'},[addBtn, fileInput]), note, err]);

  function human(n){ n=+n||0; if(n<1024) return n+' B'; if(n<1048576) return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(1)+' MB'; }
  function clearErr(){ err.textContent=''; err.classList.remove('show'); }
  function showFieldErr(m){ err.textContent=m; err.classList.add('show'); }
  function setBusy(){ addBtn.disabled = pending>0 || sel.length>=MAX_FILES_CLIENT; }
  function syncNote(){
    if(pending>0){ note.textContent='Uploading '+pending+' file'+(pending>1?'s':'')+'…'; }
    else if(sel.length){ note.textContent=sel.length+' file'+(sel.length>1?'s':'')+' attached.'; }
    else { note.textContent='Attach files or photos (up to '+MAX_FILES_CLIENT+', 10 MB each).'; }
  }
  function drawChips(){
    chips.innerHTML='';
    if(!sel.length && !pending){ chips.appendChild(el('span',{class:'file-empty hint',text:'No files yet.'})); }
    sel.forEach(function(f){
      var a=el('a',{class:'file-chip-open',href:f.url,target:'_blank',rel:'noopener',title:f.name},[
        el('span',{class:'file-chip-ico','aria-hidden':'true',text:'📎'}),
        el('span',{class:'file-chip-name',text:f.name})
      ]);
      if(f.size) a.appendChild(el('span',{class:'file-chip-size',text:human(f.size)}));
      chips.appendChild(el('span',{class:'file-chip removable'},[
        a,
        el('button',{class:'file-chip-x',type:'button',title:'Remove','aria-label':'Remove file',text:'×',
          onclick:function(){ sel=sel.filter(function(x){ return x!==f; }); drawChips(); syncNote(); setBusy(); }})
      ]));
    });
    if(pending>0){
      for(var i=0;i<pending;i++){
        chips.appendChild(el('span',{class:'file-chip uploading'},[
          el('span',{class:'file-spin','aria-hidden':'true'}),
          el('span',{class:'file-chip-name',text:'Uploading…'})
        ]));
      }
    }
  }
  function readAsDataUrl(file){
    return new Promise(function(resolve,reject){
      var r=new FileReader();
      r.onload=function(){ resolve(String(r.result||'')); };
      r.onerror=function(){ reject(new Error('Could not read “'+file.name+'”.')); };
      r.readAsDataURL(file);
    });
  }
  function upload(file){
    if(sel.length+pending>=MAX_FILES_CLIENT){ showFieldErr('You can attach up to '+MAX_FILES_CLIENT+' files.'); return; }
    if(file.size>10*1024*1024){ showFieldErr('“'+file.name+'” is too large (max 10 MB).'); return; }
    clearErr();
    pending++; drawChips(); syncNote(); setBusy();
    readAsDataUrl(file).then(function(dataUrl){
      return callServer('apiUploadFile',[State.tableId,{name:file.name, mime:file.type||'', data:dataUrl}]);
    }).then(function(desc){
      pending--;
      if(desc && desc.id) sel.push({id:desc.id, name:desc.name, url:desc.url, mime:desc.mime||'', size:+desc.size||0});
      drawChips(); syncNote(); setBusy();
    }).catch(function(e){
      pending--; drawChips(); syncNote(); setBusy();
      showFieldErr((e&&e.message)?e.message:'Upload failed.');
    });
  }
  addBtn.addEventListener('click',function(){ clearErr(); fileInput.value=''; fileInput.click(); });
  fileInput.addEventListener('change',function(){
    var list=fileInput.files?Array.prototype.slice.call(fileInput.files):[];
    list.forEach(upload);
  });

  drawChips(); syncNote(); setBusy();
  var node=el('div',{class:'field'},[
    el('label',{},[document.createTextNode(col.name+' '), el('span',{class:'hint',text:'· Attachment · optional'})]),
    box
  ]);
  return {node:node, get:function(){ return formatFiles(sel); }, validate:function(){
    if(pending>0){ showFieldErr('Please wait for uploads to finish.'); return false; }
    clearErr(); return true;
  }, col:col};
}
/* On the Shift Schedule roster only Name and Date are required — a Rest Day or
   Leave entry has no times, and Status/Location/Highlight are optional annotations.
   Everywhere else every built field stays required (link/attachment have their own
   optional builders and never reach here). Pure-ish: reads State.scheduleView. */
function schedFieldOptional(col){
  if(!State.scheduleView) return false;
  var n=String(col && col.name || '').toLowerCase();
  if(n==='name') return false;
  if(col && col.type==='date') return false;
  return true;
}
function buildField(col,value){
  if(col.type==='link') return buildLinkField(col,value);
  if(col.type==='file') return buildFileField(col,value);
  value=(value==null)?'':value;
  var input, extra=null;
  var originalValue=String(value);
  /* returns the canonical option spelling for a typed value, '' for blank, or null if it isn't an allowed option */
  function canonical(v){
    var t=String(v==null?'':v).trim();
    if(t==='') return '';
    var opts=col.options||[];
    for(var i=0;i<opts.length;i++){ if(String(opts[i]).toLowerCase()===t.toLowerCase()) return String(opts[i]); }
    if(originalValue!=='' && t.toLowerCase()===originalValue.toLowerCase()) return originalValue;
    return null;
  }
  if(col.type==='dropdown'){
    /* searchable dropdown: a text input backed by a <datalist>, so you can type to filter the options */
    var listId='dl_'+String(col.id).replace(/[^a-zA-Z0-9_]/g,'')+'_'+Math.floor(Math.random()*1e6);
    input=el('input',{class:'input'});
    input.setAttribute('list',listId);
    input.setAttribute('autocomplete','off');
    input.setAttribute('placeholder','Search or pick…');
    input.value=String(value);
    extra=el('datalist',{id:listId});
    (col.options||[]).forEach(function(o){ extra.appendChild(el('option',{value:String(o)})); });
    if(originalValue!=='' && canonical(originalValue)===null){
      extra.appendChild(el('option',{value:originalValue}));   /* keep a stored value that is no longer in the list */
    }
    /* Enter is used to pick a suggestion — don't let it bubble up and submit the whole form */
    input.addEventListener('keydown',function(e){ if(e.key==='Enter') e.stopPropagation(); });
    /* once a value is chosen, snap it to the option's canonical spelling */
    input.addEventListener('change',function(){ var c=canonical(input.value); if(c) input.value=c; });
  } else {
    input=el('input',{class:'input'});
    applyInputType(input,col.type);
    input.value=String(value);
  }
  var err=el('div',{class:'field-error'});
  var typeLabel=col.type.charAt(0).toUpperCase()+col.type.slice(1);
  /* Every field built here (text/number/price/date/dropdown/email/phone) is
     required — only link and attachment fields (their own builders) are optional,
     plus the optional roster fields on the Shift Schedule (see schedFieldOptional). */
  var optional=schedFieldOptional(col);
  if(!optional) input.setAttribute('aria-required','true');
  var node=el('div',{class:'field'},[
    el('label',{},[document.createTextNode(col.name+' '),
      optional ? el('span',{class:'hint',text:'· optional'}) : el('span',{class:'req',text:'*',attrs:{'aria-hidden':'true'}}),
      el('span',{class:'hint',text:' · '+typeLabel})]),
    input, extra, err
  ]);
  function validate(){
    var val=input.value, msg='';
    if(String(val).trim()===''){ if(!optional) msg='This field is required.'; }
    else if((col.type==='number'||col.type==='price') && isNaN(parseFloat(val))) msg = col.type==='price'?'Enter a valid amount.':'Enter a valid number.';
    else if(col.type==='email' && !isNA(val) && !isValidEmail(val)) msg='Enter a valid email address, or “N/A”.';
    else if(col.type==='phone' && !isNA(val) && !isValidPhone(val)) msg='Enter a valid phone number, or “N/A”.';
    else if(col.type==='dropdown' && canonical(val)===null) msg='Choose one of the listed options.';
    if(msg){ err.textContent=msg; err.classList.add('show'); input.classList.add('invalid'); return false; }
    err.classList.remove('show'); input.classList.remove('invalid'); return true;
  }
  input.addEventListener('input',function(){ if(err.classList.contains('show')) validate(); });
  return {node:node, get:function(){
    if(col.type==='dropdown'){ var c=canonical(input.value); return c===null?String(input.value).trim():c; }
    return input.value;
  }, validate:validate, col:col};
}

/* ============================================================= *
 *  Row modals (add / edit / delete)
 * ============================================================= */
function openRowModal(mode,row,seed){
  if(!ensureCanEdit()) return;   /* adminManaged tables: only admins may add/edit (mirrors server requireTableWrite_) */
  var cols=displayColumns(State.columns).filter(function(c){ return !c.system; });
  var body=el('div');
  var fields=cols.map(function(col){
    /* add mode can be pre-seeded (e.g. Kanban "+ Add" fills the lane's group value) */
    var initial = row ? row.values[col.id] : (seed && seed[col.id]!=null ? seed[col.id] : '');
    var f=buildField(col, initial); body.appendChild(f.node); return f;
  });

  var saveBtn=el('button',{class:'btn btn-primary',type:'button',text: mode==='add'?'Add row':'Save changes'});
  function submit(){
    var ok=true; fields.forEach(function(f){ if(!f.validate()) ok=false; });
    if(!ok) return;
    var rec={}; fields.forEach(function(f){ rec[f.col.id]=f.get(); });
    /* Add needs the server-assigned id and shifts pagination, so it stays await-then-render. */
    if(mode==='add'){
      saveBtn.disabled=true; saveBtn.textContent='Saving…';
      callServer('apiAddRow',[State.tableId,rec]).then(function(res){
        State.rows.push(res.row); invalidateView(); jumpToLastPage(); toast('Row added');
        Modal.close(); render();
        warnIfConflict(res.row._id);          // roster: flag if this shift now clashes
      }).catch(function(e){
        saveBtn.disabled=false; saveBtn.textContent='Add row'; showError(e);
      });
      return;
    }
    /* Edit is optimistic: apply locally, patch the one row, close now — then reconcile
       with the server's echo (or roll back to the snapshot on failure). */
    var r=rowById(row._id); if(!r){ Modal.close(); return; }
    var prev=copyValues(r.values);
    for(var id in rec){ if(Object.prototype.hasOwnProperty.call(rec,id)) r.values[id]=rec[id]; }
    invalidateView(); Modal.close();
    if(!patchRowTr(r)) render();
    if(Panel.isOpen() && State._panelRowId===r._id) renderRecordPanel();
    toast('Changes saved');
    warnIfConflict(r._id);                    // roster: flag if this edit now clashes
    callServer('apiUpdateRow',[State.tableId,r._id,rec]).then(function(res){
      if(res && res.row){ var rr=rowById(r._id); if(rr){ rr.values=res.row.values; invalidateView(); if(!patchRowTr(rr)) render(); if(Panel.isOpen() && State._panelRowId===rr._id) renderRecordPanel(); } }
    }).catch(function(e){
      var rr=rowById(r._id); if(rr){ rr.values=prev; invalidateView(); if(!patchRowTr(rr)) render(); if(Panel.isOpen() && State._panelRowId===rr._id) renderRecordPanel(); }
      showError(e);
    });
  }
  saveBtn.addEventListener('click',submit);
  body.addEventListener('keydown',function(e){
    if(e.key==='Enter' && e.target.tagName!=='TEXTAREA' && e.target.tagName!=='SELECT'){ e.preventDefault(); submit(); }
  });
  var cancel=el('button',{class:'btn btn-secondary',type:'button',text:'Cancel',onclick:Modal.close});
  /* Edit mode gets a Delete action too: this modal is the only editor the roster
     (Shift Schedule) opens, and the grid row's 🗑 button isn't present there — so
     without this, shifts couldn't be removed. It routes through the same
     confirm-to-trash flow, and the server still gates the write. */
  var foot=[cancel];
  if(mode!=='add'){
    var delBtn=el('button',{class:'btn btn-danger-ghost',type:'button',text:'Delete'});
    delBtn.addEventListener('click',function(){ Modal.close(); openDeleteRowModal(row); });
    foot.push(delBtn);
  }
  foot.push(saveBtn);
  Modal.open({title: mode==='add'?'Add row':'Edit row', body:body, foot:foot});
}
function jumpToLastPage(){
  State.page=currentView().pg.totalPages;   // reuses the memoised filtered/sorted view
}
function openDeleteRowModal(row){
  if(!ensureCanEdit()) return;   /* adminManaged tables: only admins may delete (mirrors server requireTableWrite_) */
  var cols=displayColumns(State.columns);
  var preview=cols.slice(0,3).map(function(c){ var v=formatCellValue(row.values[c.id],c.type); return c.name+': '+(v||'—'); }).join('   ·   ');
  var body=el('div',{},[
    el('p',{class:'modal-note',text:'Move this row to the trash? You can restore it later from Trash.'}),
    preview?el('div',{style:'font-size:12px;color:var(--muted);',text:preview}):null
  ].filter(Boolean));
  var cancel=el('button',{class:'btn btn-secondary',type:'button',text:'Cancel',onclick:Modal.close});
  var del=el('button',{class:'btn btn-danger',type:'button',text:'Delete row'});
  del.addEventListener('click',function(){
    del.disabled=true; del.textContent='Deleting…';
    callServer('apiDeleteRow',[State.tableId,row._id]).then(function(){
      State.rows=State.rows.filter(function(r){return r._id!==row._id;});
      State.trashCount=(State.trashCount||0)+1;
      invalidateView(); Modal.close(); render(); updateTrashBadge();
      toastUndo('Row moved to trash', function(){ restoreRow(row._id); });
    }).catch(function(e){ del.disabled=false; del.textContent='Delete row'; showError(e); });
  });
  Modal.open({title:'Delete row', body:body, foot:[cancel,del]});
}

/* One-click undo straight from the delete toast: restore the row and drop it back
   into the live table. Used by the "Row moved to trash · Undo" toast. */
function restoreRow(rowId){
  callServer('apiRestoreRow',[State.tableId,rowId]).then(function(res){
    if(res && res.row){
      if(!rowById(res.row._id)) State.rows.push(res.row);
      State.trashCount=Math.max(0,(State.trashCount||0)-1);
      invalidateView(); render(); updateTrashBadge(); toast('Row restored');
    }
  }).catch(showError);
}

/* Toolbar Trash badge: a small count of rows the caller can restore. */
function updateTrashBadge(){
  if(!trashBadge) return;
  var n=State.trashCount||0;
  if(n>0){ trashBadge.textContent=n>99?'99+':String(n); trashBadge.hidden=false; }
  else { trashBadge.textContent=''; trashBadge.hidden=true; }
}

/* ============================================================= *
 *  Trash modal — deleted rows, with Restore / Delete permanently
 * ============================================================= */
function openTrashModal(){
  var body=el('div');
  body.appendChild(el('p',{class:'modal-note',text:'Deleted rows are kept here so you can restore them. Restoring puts a row back in the table; deleting it permanently can’t be undone.'}));
  var wrap=el('div',{class:'trash-wrap'},[el('div',{class:'trash-empty',text:'Loading…'})]);
  body.appendChild(wrap);

  var emptyBtn=el('button',{class:'btn btn-danger-ghost',type:'button',text:'Empty trash'});
  emptyBtn.disabled=true;
  emptyBtn.addEventListener('click',function(){ confirmEmptyTrash(); });
  var done=el('button',{class:'btn btn-primary',type:'button',text:'Done',onclick:Modal.close});

  function draw(res){
    wrap.innerHTML='';
    var cols=((res && res.columns) || []).filter(function(c){ return !c.adminOnly || (res && res.isAdmin); });
    var rows=(res && res.rows) || [];
    emptyBtn.disabled=rows.length===0;
    if(!rows.length){ wrap.appendChild(el('div',{class:'trash-empty',text:'The trash is empty.'})); return; }
    // A compact list: a short preview of each row + when/who deleted it + actions.
    var preCols=cols.filter(function(c){ return !c.system; }).slice(0,3);
    rows.forEach(function(r){
      var bits=preCols.map(function(c){ var v=formatCellValue(r.values[c.id],c.type); return c.name+': '+(v||'—'); });
      var meta=[]; if(r.deletedAt) meta.push('Deleted '+r.deletedAt);
      if(res.isAdmin && r.deletedBy) meta.push('by '+r.deletedBy);
      var idBox=el('div',{class:'trash-id'},[
        el('div',{class:'trash-preview',text: bits.length?bits.join('   ·   '):'(empty row)'}),
        meta.length?el('div',{class:'trash-meta',text:meta.join(' · ')}):null
      ].filter(Boolean));
      var restore=el('button',{class:'btn btn-secondary btn-xs',type:'button',text:'Restore'});
      restore.addEventListener('click',function(){
        restore.disabled=true;
        callServer('apiRestoreRow',[State.tableId,r._id]).then(function(rr){
          if(rr && rr.row && !rowById(rr.row._id)) State.rows.push(rr.row);
          State.trashCount=Math.max(0,(State.trashCount||0)-1);
          invalidateView(); render(); updateTrashBadge();
          reload().then(function(){ toast('Row restored'); });
        }).catch(function(e){ restore.disabled=false; showError(e); });
      });
      var purge=el('button',{class:'icon-btn danger',type:'button',title:'Delete permanently','aria-label':'Delete permanently',html:ICON.trash});
      purge.addEventListener('click',function(){
        purge.disabled=true;
        callServer('apiPurgeRow',[State.tableId,r._id]).then(function(){
          State.trashCount=Math.max(0,(State.trashCount||0)-1);
          updateTrashBadge();
          reload().then(function(){ toast('Row permanently deleted'); });
        }).catch(function(e){ purge.disabled=false; showError(e); });
      });
      wrap.appendChild(el('div',{class:'trash-row'},[idBox, el('div',{class:'trash-actions'},[restore,purge])]));
    });
  }
  function reload(){ return callServer('apiListTrash',[State.tableId]).then(draw); }

  function confirmEmptyTrash(){
    var c2=el('div',{},[el('p',{class:'modal-note',text:'Permanently delete every row in the trash? This can’t be undone.'})]);
    var back=el('button',{class:'btn btn-secondary',type:'button',text:'Cancel',onclick:function(){ openTrashModal(); }});
    var yes=el('button',{class:'btn btn-danger',type:'button',text:'Empty trash'});
    yes.addEventListener('click',function(){
      yes.disabled=true; yes.textContent='Emptying…';
      callServer('apiEmptyTrash',[State.tableId]).then(function(res){
        var removed=(res&&res.removed)||0;
        State.trashCount=Math.max(0,(State.trashCount||0)-removed);
        updateTrashBadge(); Modal.close(); toast(removed?('Deleted '+removed+' row'+(removed===1?'':'s')):'Trash already empty');
      }).catch(function(e){ yes.disabled=false; yes.textContent='Empty trash'; showError(e); });
    });
    Modal.open({title:'Empty trash', body:c2, foot:[back,yes]});
  }

  Modal.open({title:'Trash', body:body, foot:[emptyBtn, el('span',{class:'spacer'}), done], wide:true});
  callServer('apiListTrash',[State.tableId]).then(draw)
    .catch(function(e){ wrap.innerHTML=''; wrap.appendChild(el('div',{class:'trash-empty',text:'Couldn’t load the trash.'})); showError(e); });
}

/* ============================================================= *
 *  Column modals (add / edit / delete)
 * ============================================================= */
/* Drop filters whose column was deleted, or whose operator no longer fits the
   column's (possibly changed) type — so a schema change (including one made by
   another admin and picked up by the live poll) can't leave a filter pointing
   at a missing column or a dangling operator. Safe to call anytime. */
function pruneFilters(){
  if(!State.filters || !State.filters.length) return;
  var typeById={}; State.columns.forEach(function(c){ typeById[c.id]=c.type; });
  State.filters=State.filters.filter(function(f){
    if(!Object.prototype.hasOwnProperty.call(typeById,f.colId)) return false;
    var ops=opsForType(typeById[f.colId]);
    for(var i=0;i<ops.length;i++) if(ops[i][0]===f.op) return true;
    return false;
  });
}
/* Drop color rules whose column vanished or whose operator no longer fits the
   column's (possibly changed) type — same guard as pruneFilters. */
function pruneColorRules(){
  if(!State.colorRules || !State.colorRules.length) return;
  var typeById={}; State.columns.forEach(function(c){ typeById[c.id]=c.type; });
  State.colorRules=State.colorRules.filter(function(r){
    if(!Object.prototype.hasOwnProperty.call(typeById,r.colId)) return false;
    var ops=opsForType(typeById[r.colId]);
    for(var i=0;i<ops.length;i++) if(ops[i][0]===r.op) return true;
    return false;
  });
}
/* A column can drive grid grouping unless it's an attachment or a link — those
   hold opaque descriptors/ids that don't make sensible group keys. */
function isGroupableCol(col){ return !!col && col.type!=='file' && col.type!=='link'; }
function groupableCols(){ return displayColumns(State.columns).filter(isGroupableCol); }
/* Clear the grid group-by column if it was removed or is no longer groupable
   (e.g. its type changed to attachment/link). Mirrors pruneFilters' self-heal. */
function pruneGridGroup(){
  if(!State.gridGroupColId) return;
  var col=null; State.columns.forEach(function(c){ if(c.id===State.gridGroupColId) col=c; });
  if(!col || !isGroupableCol(col)){ State.gridGroupColId=''; State._collapsedGroups={}; }
}

function applyColumns(cols){
  var ids={}; cols.forEach(function(c){ ids[c.id]=true; });
  State.columns=cols;
  State.rows.forEach(function(r){ cols.forEach(function(c){ if(r.values[c.id]===undefined) r.values[c.id]=''; }); });
  if(State.sort.colId && !ids[State.sort.colId]) State.sort={colId:null,dir:1};
  pruneFilters();
  pruneColorRules();
  pruneGridGroup();
  invalidateView();
}

/* ============================================================= *
 *  Import CSV modal — map columns, skip unmatched, never alter schema
 * ============================================================= *
 *  Two steps in one dialog:
 *    1) choose a .csv file — parsed in the browser (parseCsv);
 *    2) map each of your table's columns to a CSV column (auto-matched by name
 *       where possible), preview how many rows will import, then confirm.
 *  Unmapped CSV columns are ignored; no column is ever created or changed. The
 *  built-in Created At / Added By columns are set by the server, so they're not
 *  offered as import targets. */
function normalizeHeader(s){ return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' '); }

function openImportModal(){
  var targetCols=displayColumns(State.columns).filter(function(c){ return !c.system; });
  if(!targetCols.length){
    Modal.open({title:'Import CSV', body:el('div',{},[el('p',{class:'modal-note',text:'Add a column first — there’s nothing to import into yet.'})]),
      foot:[el('button',{class:'btn btn-primary',type:'button',text:'Close',onclick:Modal.close})]});
    return;
  }

  /* ----- Step 1: file picker ----- */
  function renderPick(errMsg){
    var body=el('div');
    body.appendChild(el('p',{class:'modal-note',text:'Choose a CSV file. On the next step you’ll match its columns to your table’s columns — anything you don’t map is skipped, and your columns and their types are never changed.'}));
    var file=el('input',{type:'file',attrs:{accept:'.csv,text/csv'},class:'input'});
    body.appendChild(el('div',{class:'field'},[el('label',{text:'CSV file'}),file]));
    var err=el('div',{class:'field-error'+(errMsg?' show':'')}); if(errMsg) err.textContent=errMsg;
    body.appendChild(err);

    var next=el('button',{class:'btn btn-primary',type:'button',text:'Next'});
    next.addEventListener('click',function(){
      var f=file.files && file.files[0];
      if(!f){ err.textContent='Choose a CSV file to continue.'; err.classList.add('show'); return; }
      if(f.size>10*1024*1024){ err.textContent='That file is larger than 10 MB. Try a smaller export.'; err.classList.add('show'); return; }
      next.disabled=true; next.textContent='Reading…';
      var reader=new FileReader();
      reader.onload=function(){
        var rows;
        try{ rows=parseCsv(String(reader.result||'')); }
        catch(e){ renderPick('Couldn’t read that file as CSV.'); return; }
        if(!rows.length){ renderPick('That file looks empty.'); return; }
        var header=rows[0].map(function(h){ return String(h==null?'':h).trim(); });
        var dataRows=rows.slice(1);
        if(!header.length || header.every(function(h){ return h===''; })){ renderPick('The first row must be column headers.'); return; }
        if(!dataRows.length){ renderPick('The file has a header row but no data rows.'); return; }
        renderMap(header, dataRows);
      };
      reader.onerror=function(){ renderPick('Couldn’t read that file.'); };
      reader.readAsText(f);
    });
    var cancel=el('button',{class:'btn btn-secondary',type:'button',text:'Cancel',onclick:Modal.close});
    Modal.open({title:'Import CSV', body:body, foot:[cancel,next]});
  }

  /* ----- Step 2: map columns + preview ----- */
  function renderMap(header, dataRows){
    // Auto-match: a table column maps to a CSV header with the same name (case/space-insensitive).
    var norm=header.map(normalizeHeader);
    var body=el('div');
    body.appendChild(el('p',{class:'modal-note',html:'Match each of your columns to a column from the file. Unmapped columns are left blank; CSV columns you don’t use are ignored. <strong>'+dataRows.length+'</strong> data row'+(dataRows.length===1?'':'s')+' found.'}));

    var grid=el('div',{class:'map-grid'});
    grid.appendChild(el('div',{class:'map-head',text:'Your column'}));
    grid.appendChild(el('div',{class:'map-head',text:'CSV column'}));
    var selectors=[];
    targetCols.forEach(function(col){
      var sel=el('select',{class:'select'});
      sel.appendChild(el('option',{value:'',text:'— Skip (leave blank) —'}));
      header.forEach(function(h,idx){
        if(h==='') return;
        sel.appendChild(el('option',{value:String(idx),text:h}));
      });
      var want=normalizeHeader(col.name); var match=norm.indexOf(want);
      if(match>=0) sel.value=String(match);
      selectors.push({col:col, sel:sel});
      var typeLabel=col.type.charAt(0).toUpperCase()+col.type.slice(1);
      grid.appendChild(el('div',{class:'map-col'},[el('span',{class:'map-name',text:col.name}),el('span',{class:'hint',text:'· '+typeLabel})]));
      grid.appendChild(el('div',{class:'map-pick'},[sel]));
    });
    body.appendChild(grid);

    var summary=el('div',{class:'map-summary'});
    body.appendChild(summary);

    // Build the records the server will import, applying each mapping + client coercion.
    function buildRecords(){
      var chosen=selectors.filter(function(s){ return s.sel.value!==''; });
      var recs=[], skipped=0;
      dataRows.forEach(function(cells){
        var rec={}, any=false;
        chosen.forEach(function(s){
          var raw=cells[parseInt(s.sel.value,10)];
          var val=coerceClient(raw==null?'':raw, s.col.type);
          if(val!=='' && val!=null){ any=true; }
          rec[s.col.id]=val;
        });
        if(any) recs.push(rec); else skipped++;
      });
      return {recs:recs, skipped:skipped, mapped:chosen.length};
    }
    function refreshSummary(){
      var b=buildRecords();
      if(b.mapped===0){ summary.textContent='Map at least one column to import.'; summary.className='map-summary warn'; }
      else { summary.className='map-summary';
        summary.textContent='Will import '+b.recs.length+' row'+(b.recs.length===1?'':'s')+
          (b.skipped?(' · '+b.skipped+' empty row'+(b.skipped===1?'':'s')+' skipped'):'')+' · '+b.mapped+' column'+(b.mapped===1?'':'s')+' mapped'; }
    }
    selectors.forEach(function(s){ s.sel.addEventListener('change',refreshSummary); });
    refreshSummary();

    var back=el('button',{class:'btn btn-secondary',type:'button',text:'Back',onclick:function(){ renderPick(''); }});
    var imp=el('button',{class:'btn btn-primary',type:'button',text:'Import'});
    imp.addEventListener('click',function(){
      var b=buildRecords();
      if(b.mapped===0){ toast('Map at least one column first.','error'); return; }
      if(!b.recs.length){ toast('No rows to import — every row was empty for the mapped columns.','error'); return; }
      imp.disabled=true; back.disabled=true; imp.textContent='Importing…';
      callServer('apiImportRows',[State.tableId,b.recs]).then(function(res){
        var added=(res&&res.added)||0;
        Modal.close();
        // Pull the imported rows into the live table via the normal refresh path.
        reloadData().then(function(){
          toast('Imported '+added+' row'+(added===1?'':'s')+((res&&res.skipped)?(' · '+res.skipped+' skipped'):''));
        });
      }).catch(function(e){ imp.disabled=false; back.disabled=false; imp.textContent='Import'; showError(e); });
    });
    Modal.open({title:'Import CSV — map columns', body:body, foot:[back, el('span',{class:'spacer'}), imp], wide:true});
  }

  renderPick('');
}

/* Re-fetch rows/columns from the server and re-render, keeping search/sort/page.
   Used after an import so the freshly-added rows appear without a full reload. */
function reloadData(){
  return callServer('getInitialData',[State.tableId]).then(function(data){
    if(!data) return;
    State.columns=(data.columns)||State.columns;
    State.rows=(data.rows)||[];
    State.sheetUrl=(data.sheetUrl)||State.sheetUrl;
    State.currency=data.currency || State.currency;
    if(typeof data.trashCount==='number') State.trashCount=data.trashCount;
    if(data.tables) State.tables=data.tables;
    if(data.tableId) State.tableId=data.tableId;
    if(typeof data.accessMode==='string') State.accessMode=data.accessMode;
    State.me=data.me || State.me;
    if(typeof data.scheduleView==='boolean') State.scheduleView=data.scheduleView;
    if(data.dateNotes) State.dateNotes=data.dateNotes;
    pruneFilters();                          // a background schema change may have removed a filtered column
    pruneColorRules();
    pruneGridGroup();
    invalidateView(); render(); updateTrashBadge(); renderTableSwitch();
    lastDataSig=dataSig(State.columns, State.rows);
    lastTablesSig=tablesSignature(State.tables);
  });
}

/* ============================================================= *
 *  Bulk action modals (operate on the current selection)
 *  The server re-checks per-row access on every id, so a member can only ever
 *  affect rows they own; ids they can't touch are silently skipped there. The
 *  client only holds rows the caller can see, so what's selected here already
 *  matches what the server will act on.
 * ============================================================= */
function openBulkDeleteModal(){
  if(!ensureCanEdit()) return;   /* adminManaged tables: only admins may bulk-delete (mirrors server requireTableWrite_) */
  var ids=selectedIds();
  if(!ids.length) return;
  var n=ids.length;
  var body=el('div',{},[
    el('p',{class:'modal-note',text:'Move '+n+' selected row'+(n===1?'':'s')+' to the trash? You can restore '+(n===1?'it':'them')+' later from Trash.'})
  ]);
  var cancel=el('button',{class:'btn btn-secondary',type:'button',text:'Cancel',onclick:Modal.close});
  var del=el('button',{class:'btn btn-danger',type:'button',text:'Delete '+n+' row'+(n===1?'':'s')});
  function reset(){ del.disabled=false; del.textContent='Delete '+n+' row'+(n===1?'':'s'); }
  del.addEventListener('click',function(){
    del.disabled=true; del.textContent='Deleting…';
    callServer('apiBulkDeleteRows',[State.tableId,ids]).then(function(res){
      var gone=(res&&res.ids)||[];
      var map={}; gone.forEach(function(id){ map[id]=1; });
      State.rows=State.rows.filter(function(r){ return !map[r._id]; });
      var d=(res&&res.deleted)||0;
      State.trashCount=(State.trashCount||0)+d;
      clearSelection(); invalidateView(); Modal.close(); render(); updateTrashBadge();
      if(d>0) toastUndo(d+' row'+(d===1?'':'s')+' moved to trash', function(){ restoreRows(gone); });
      else toast('Nothing was deleted.','error');
    }).catch(function(e){ reset(); showError(e); });
  });
  Modal.open({title:'Delete selected rows', body:body, foot:[cancel,del]});
}

function openBulkSetFieldModal(){
  if(!ensureCanEdit()) return;   /* adminManaged tables: only admins may bulk-set (mirrors server requireTableWrite_) */
  var ids=selectedIds();
  if(!ids.length) return;
  var cols=displayColumns(State.columns).filter(function(c){ return !c.system; });
  if(!cols.length){ toast('No editable columns to set.','error'); return; }

  var body=el('div');
  body.appendChild(el('p',{class:'modal-note',text:'Set one column to the same value for all '+ids.length+' selected row'+(ids.length===1?'':'s')+'. Only rows you can edit are changed.'}));

  var colSel=el('select',{class:'select'});
  cols.forEach(function(c){ colSel.appendChild(el('option',{value:c.id,text:c.name})); });
  body.appendChild(el('div',{class:'field'},[el('label',{text:'Column'}),colSel]));

  var fieldHost=el('div'); body.appendChild(fieldHost);
  var field=null;
  function colById(id){ for(var i=0;i<cols.length;i++){ if(cols[i].id===id) return cols[i]; } return cols[0]; }
  function buildFor(colId){
    fieldHost.innerHTML='';
    field=buildField(colById(colId), '');
    var lbl=field.node.querySelector('label');   /* relabel the reused field so its role ("new value") is obvious */
    if(lbl && lbl.firstChild && lbl.firstChild.nodeType===3) lbl.firstChild.textContent='New value ';
    fieldHost.appendChild(field.node);
  }
  colSel.addEventListener('change',function(){ buildFor(colSel.value); });
  buildFor(colSel.value);

  var cancel=el('button',{class:'btn btn-secondary',type:'button',text:'Cancel',onclick:Modal.close});
  var save=el('button',{class:'btn btn-primary',type:'button',text:'Set value'});
  function submit(){
    if(field && !field.validate()) return;
    var colId=colSel.value, raw=field?field.get():'';
    save.disabled=true; save.textContent='Setting…';
    callServer('apiBulkSetField',[State.tableId,ids, colId, raw]).then(function(res){
      var v=res?res.value:'';
      ids.forEach(function(id){ var r=rowById(id); if(r) r.values[colId]=v; });
      clearSelection(); invalidateView(); Modal.close(); render();
      var u=res?res.updated:0;
      toast('Updated '+u+' row'+(u===1?'':'s'));
    }).catch(function(e){ save.disabled=false; save.textContent='Set value'; showError(e); });
  }
  save.addEventListener('click',submit);
  body.addEventListener('keydown',function(e){
    if(e.key==='Enter' && e.target.tagName!=='TEXTAREA' && e.target.tagName!=='SELECT'){ e.preventDefault(); submit(); }
  });
  Modal.open({title:'Set field on selected', body:body, foot:[cancel,save]});
}

/* Restore several rows at once (used by the bulk-delete Undo toast). Tolerant of
   per-id failures so one already-purged row can't sink the rest. */
function restoreRows(ids){
  if(!ids || !ids.length) return;
  var jobs=ids.map(function(id){
    return callServer('apiRestoreRow',[State.tableId,id]).then(function(res){ return (res&&res.row)?res.row:null; }, function(){ return null; });
  });
  Promise.all(jobs).then(function(results){
    var restored=0;
    results.forEach(function(row){ if(row){ if(!rowById(row._id)) State.rows.push(row); restored++; } });
    if(restored>0){
      State.trashCount=Math.max(0,(State.trashCount||0)-restored);
      invalidateView(); render(); updateTrashBadge();
      toast('Restored '+restored+' row'+(restored===1?'':'s'));
    }
  });
}

/* ============================================================= *
 *  Advanced filters — modal + badge
 *  Filters live in State.filters (see the pure helpers up top). They're built
 *  here against a working copy, then committed on Apply. Everything is applied
 *  client-side in currentView(), so filtering never touches the server.
 * ============================================================= */
function activeFilterCount(){
  var cols=displayColumns(State.columns), byId={};
  cols.forEach(function(c){ byId[c.id]=c; });
  var n=0;
  (State.filters||[]).forEach(function(f){ if(isFilterActive(f,byId[f.colId])) n++; });
  return n;
}
function updateFilterBadge(){
  if(!filterBadge) return;
  var n=activeFilterCount();
  if(n>0){ filterBadge.textContent=String(n); filterBadge.hidden=false; if(btnFilter) btnFilter.classList.add('has-filters'); }

/* Count color rules that would actually paint a row right now: column still
   exists, its operator fits the type, and required value(s) are filled. Mirrors
   activeFilterCount so the badge tracks the same "is it doing anything" notion. */
function activeColorCount(){
  var cols=displayColumns(State.columns), byId={};
  cols.forEach(function(c){ byId[c.id]=c; });
  var n=0;
  (State.colorRules||[]).forEach(function(r){
    var col=byId[r.colId]; if(!col) return;
    var ops=opsForType(col.type), ok=false;
    for(var i=0;i<ops.length;i++){ if(ops[i][0]===r.op){ ok=true; break; } }
    if(ok && isFilterActive(r,col)) n++;
  });
  return n;
}
function updateColorBadge(){

function openFilterModal(){

  function newCond(){ var c=cols[0]; return {colId:c.id, op:opsForType(c.type)[0][0], value:'', value2:''}; }

/* ============================================================= *

function cfStyleLabel(s){
  return ({red:'Red',amber:'Amber',green:'Green',teal:'Teal',blue:'Blue',violet:'Violet',gray:'Gray'})[s] || 'Color';
}
function openColorRulesModal(){
  var cols=displayColumns(State.columns).filter(function(c){ return c.type!=='link' && c.type!=='file'; });

    });

    var parts=[];
    CF_STYLES.forEach(function(s){ if(byStyle[s]) parts.push(byStyle[s]+' '+cfStyleLabel(s).toLowerCase()); });
    var total=State.rows.length;
    previewEl.textContent='Paints '+painted+' of '+total+' row'+(total===1?'':'s')+(parts.length>1?' ('+parts.join(', ')+')':'');
  }
  function buildVals(rule,col){
    var host=el('div',{class:'filter-vals'});
    var ar=opArity(col.type,rule.op);
    if(ar===0){ host.appendChild(el('span',{class:'filter-novalue',text:'(no value needed)'})); return host; }
    var fam=filterFamily(col.type);
    function makeInput(which){
      var inp, cur = which===2 ? rule.value2 : rule.value;
      if(fam==='dropdown'){
        inp=el('select',{class:'select'});

        (col.options||[]).forEach(function(o){ inp.appendChild(el('option',{value:o,text:o})); });
      } else {
        inp=el('input',{class:'input'});
        if(fam==='number') applyInputType(inp,'number');
        else if(fam==='date') applyInputType(inp,'date');
        else inp.type='text';
      }
      inp.value=(cur==null?'':String(cur));
      function sync(){ if(which===2) rule.value2=inp.value; else rule.value=inp.value; updatePreview(); }
      inp.addEventListener('input',sync); inp.addEventListener('change',sync);
      return inp;
    }
    host.appendChild(makeInput(1));
    if(ar===2){ host.appendChild(el('span',{class:'filter-and',text:'and'})); host.appendChild(makeInput(2)); }
    return host;
  }
  function buildSwatch(rule){
    var host=el('div',{class:'cf-swatches',attrs:{role:'group','aria-label':'Row color'}});
    var btns=[];
    CF_STYLES.forEach(function(s){
      var b=el('button',{type:'button',class:'cf-swatch cf-sw-'+s,attrs:{'data-style':s,title:cfStyleLabel(s),'aria-label':cfStyleLabel(s)}});
      if(s===rule.style) b.classList.add('on');
      b.addEventListener('click',function(){
        btns.forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on'); rule.style=s; updatePreview();
      });
      btns.push(b); host.appendChild(b);
    });
    return host;
  }
  function buildRuleRow(rule, idx){
    var col=colById(rule.colId) || cols[0];

    colSel.addEventListener('change',function(){
      rule.colId=colSel.value;
      var nc=colById(rule.colId)||cols[0];

    var opSel=el('select',{class:'select filter-op'});
    opsForType(col.type).forEach(function(o){ var op=el('option',{value:o[0],text:o[1]}); if(o[0]===rule.op) op.selected=true; opSel.appendChild(op); });
    opSel.addEventListener('change',function(){ rule.op=opSel.value; rerender(); });

    var up=el('button',{class:'cf-move',type:'button',title:'Move up','aria-label':'Move up (higher priority)',text:'▲',
      onclick:function(){ if(idx>0){ var t=working[idx-1]; working[idx-1]=working[idx]; working[idx]=t; rerender(); } }});

      onclick:function(){ if(idx<working.length-1){ var t=working[idx+1]; working[idx+1]=working[idx]; working[idx]=t; rerender(); } }});
    if(idx===working.length-1) down.disabled=true;

    var rm=el('button',{class:'filter-del',type:'button',title:'Remove rule','aria-label':'Remove rule',text:'×',
      onclick:function(){ var i=working.indexOf(rule); if(i>=0) working.splice(i,1); rerender(); }});

    row.appendChild(colSel); row.appendChild(opSel); row.appendChild(buildVals(rule,col)); row.appendChild(buildSwatch(rule));
    row.appendChild(el('div',{class:'cf-rule-tools'},[up,down,rm]));
    return row;

  function rerender(){

  apply.addEventListener('click',submit);

/* A two-button pill. options=[[value,label],...]; onPick(value) fires on click. */
function segmented(options, current, onPick){
  var wrap=el('div',{class:'segmented',attrs:{role:'group'}});
  var btns=[];
  options.forEach(function(o){
    var b=el('button',{type:'button',text:o[1],attrs:{'data-val':o[0]}});
    if(o[0]===current) b.classList.add('on');
    b.addEventListener('click',function(){
      btns.forEach(function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      onPick(o[0]);
    });
    btns.push(b); wrap.appendChild(b);
  });
  return wrap;
}
/* One labelled row inside a settings card: name + description on the left, the
   control on the right. */
function settingRow(name, desc, control){
  return el('div',{class:'set-row'},[
    el('div',{class:'set-label'},[
      el('span',{class:'set-name',text:name}),
      el('span',{class:'set-desc',text:desc})
    ]),
    control
  ]);
}
/* A titled group of related settings, rendered as one bordered card. `caption`
   is the small grey hint beside the title (who the settings apply to). */
function setGroup(title, caption, card){
  var head=[el('span',{class:'set-group-title',text:title})];
  if(caption) head.push(el('span',{class:'set-group-cap',text:caption}));
  return el('div',{class:'set-group'},[ el('div',{class:'set-group-head'},head), card ]);
}
