   card read as a distinct, floating panel. Falls back gracefully where :has()
   is unsupported — the cards keep their border + shadow regardless. */
.modal-body:has(.set-groups){background:var(--surface-2);}
.set-card{
  border:1px solid var(--border);border-radius:var(--r-lg);
  background:var(--surface);box-shadow:var(--shadow-sm);overflow:hidden;
}
/* Inner panels step back to the tinted tone so they read on the white card. */
.set-card .modal-note,
.set-card .table-row{background:var(--surface-2);}

.set-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:13px 14px;border-bottom:1px solid var(--border);
}
.set-row:last-child{border-bottom:none;}
.set-row .select{flex:0 0 auto;width:200px;max-width:56%;}
.set-label{display:flex;flex-direction:column;gap:2px;min-width:0;}
.set-label .set-name{font-size:var(--fs-ui);font-weight:600;color:var(--text);}
.set-label .set-desc{font-size:var(--fs-sm);color:var(--faint);line-height:1.4;}
.segmented{
  display:inline-flex;flex:0 0 auto;
  border:1px solid var(--border-strong);border-radius:999px;background:var(--surface-2);padding:2px;
}
.segmented button{
  border:none;background:transparent;color:var(--muted);
  font:inherit;font-size:var(--fs-sm);font-weight:600;
  padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:background .12s,color .12s;
}
.segmented button.on{background:var(--accent);color:#fff;}
.segmented button:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-weak);}
.set-currency{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.set-currency input{
  width:70px;height:32px;text-align:center;
  border:1px solid var(--border-strong);border-radius:var(--r-md);
  background:var(--surface);color:var(--text);font-size:var(--fs-ui);
}
.set-currency input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak);}
.set-currency input[disabled]{opacity:.5;cursor:not-allowed;}
.set-currency .lock-note{font-size:var(--fs-xs);color:var(--faint);max-width:120px;line-height:1.35;}

/* ============================================================= *
 *  Website layout — "Product app-site"
 *  Reshapes the full-height app shell into a scrollable page: a
 *  sticky site navbar, a page header, the workspace centered in a
 *  max-width container, and a site footer. All component styles
 *  above are reused unchanged; only the outer structure is
 *  overridden here (equal-specificity rules declared later win).
 * ============================================================= */
html,body{height:auto;}
.app{height:auto;min-height:100vh;display:block;}

/* Sticky site navbar (built on the existing .topbar) */
.topbar{
  display:block;position:sticky;top:0;z-index:30;
  height:60px;padding:0;
  background:var(--surface);
  border-bottom:1px solid var(--border);
}
.nav-inner{
  max-width:1200px;margin:0 auto;height:100%;
  display:flex;align-items:center;gap:22px;padding:0 24px;
}
.nav-inner .topbar-right{margin-left:auto;}
.site-nav{display:flex;align-items:center;gap:4px;}
.site-nav-item{
  font-size:var(--fs-ui);font-weight:600;color:var(--muted);
  padding:6px 11px;border-radius:var(--r-md);
}
.site-nav-item.is-active{color:var(--accent);background:var(--accent-weak);}

/* Centered page content */
.site-content{padding:30px 24px 44px;}
.container{max-width:1200px;margin:0 auto;}

/* Page header */
.page-head{margin:0 0 20px;padding:0 2px;}
.page-title{font-size:26px;font-weight:700;letter-spacing:-.02em;color:var(--text);line-height:1.15;}
.page-sub{margin-top:5px;color:var(--muted);font-size:14px;}

/* Workspace rows sit inside the container: drop the old app-shell side margins */
.toolbar{padding:0 0 14px;}
.view-bar{margin:0 0 10px;}
.bulk-bar{margin:0 0 10px;}
.table-wrap{
  margin:0;display:block;height:auto;min-height:300px;max-height:none;
  box-shadow:var(--shadow-md);
}
.table-scroll{max-height:68vh;}
.pager{padding:14px 2px 0;}

/* Alternate views size naturally within the page */
.kanban,.dashboard,.schedule{max-height:none;}

/* Footer */
.site-footer{border-top:1px solid var(--border);background:var(--surface);}
.footer-inner{
  max-width:1200px;margin:0 auto;padding:22px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  color:var(--muted);font-size:var(--fs-sm);
}
.footer-brand{display:inline-flex;align-items:center;gap:7px;font-weight:650;color:var(--text);}
.footer-brand span[aria-hidden]{color:var(--accent);}

/* Loading veil covers the viewport, not the whole scrollable page */
.loader{position:fixed;z-index:35;}

@media (max-width:720px){
  .site-nav{display:none;}
  .site-content{padding:18px 12px 30px;}
  .page-title{font-size:22px;}
  .table-scroll{max-height:none;}
  .nav-inner{padding:0 14px;gap:12px;}
  .table-tabs{flex-wrap:nowrap;overflow-x:auto;}
}

/* Table tabs — the active-table switcher, moved out of Settings into the page.
   Classic underline tabs: one per table, the current one accented; admins get a
   trailing ＋ that opens Settings to create/manage tables. */
.table-tabs{
  display:flex;align-items:center;gap:2px;flex-wrap:wrap;
  margin:0 0 16px;border-bottom:1px solid var(--border);
}
.table-tabs[hidden]{display:none;}
.table-tab{
  position:relative;appearance:none;border:none;background:transparent;cursor:pointer;
  font-family:inherit;font-size:var(--fs-ui);font-weight:600;color:var(--muted);
  padding:9px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;
  border-radius:var(--r-sm) var(--r-sm) 0 0;white-space:nowrap;
  max-width:240px;overflow:hidden;text-overflow:ellipsis;
  transition:color .12s,background .12s,border-color .12s;
}
.table-tab:hover{color:var(--text);background:var(--surface-3);}
.table-tab.is-active{color:var(--accent);border-bottom-color:var(--accent);}
.table-tab:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-weak);}
.table-tab-add{color:var(--faint);font-size:16px;font-weight:400;padding:7px 12px;}
.table-tab-add:hover{color:var(--accent);background:var(--accent-weak);}

/* Shift Schedule: the toolbar collapses to only the ⋯ More menu, which the roster
   doesn't need (it has its own month-nav / Today / Add-shift bar) — so hide the
   whole minimised toolbar there, removing the stray "More". */
.toolbar.toolbar-min{display:none;}
</style>
